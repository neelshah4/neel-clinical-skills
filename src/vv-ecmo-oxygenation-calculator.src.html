<script>/* neel-theme no-flash: apply a saved choice before first paint; migrate a legacy per-tool key once. */

if(!t){var o=r.getAttribute('data-nt-legacy');if(o){var v=localStorage.getItem(o);if(v==='light'||v==='dark'){t=v;localStorage.setItem(k,v);}}}
if(t==='light'||t==='dark')r.setAttribute('data-theme',t);}catch(e){}})();</script>

</head>
<body class="bg-slate-50">
  <noscript><p style="padding:16px;font:16px/1.5 system-ui,sans-serif">This calculator needs JavaScript. Turn it on for this page and reload.</p></noscript>
  <div id="root"><p style="padding:16px;font:16px/1.5 system-ui,sans-serif">Loading the calculator…</p></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useCallback, useRef, useEffect } = React;

    const BASELINE = {
      mode: "forward",
      sEcmo: 100, qEcmo: 4.0, co: 6.0, measuredSaO2: 88, recirc: 0,
      hgb: 11, paO2: 60, pvO2: 35, hufner: 1.34,
      wt: 70, vo2i: 3.0,
      // Cross-check entries: typed for comparison only. calc() never reads them.
      cmpSa: null, cmpCo: null, cmpPre: null,
    };

    // Entry limits in one place so the scenario buttons and the fields cannot drift apart.
    // The flow and cardiac-output floors reach a neonate (about 0.2 L/min of circuit flow at 3 kg)
    // instead of silently clamping such a patient up to an adult value.
    const LIM = {
      sEcmo: [85, 100], qEcmo: [0.1, 8], co: [0.2, 12], measuredSaO2: [20, 100],
      recirc: [0, 60], hgb: [5, 22], paO2: [30, 500], pvO2: [15, 60],
      wt: [2, 150], vo2i: [1, 12],
      cmpSa: [20, 100], cmpCo: [0.05, 30], cmpPre: [20, 100],
    };
    const NAMES = { qEcmo: "ECMO flow", co: "Cardiac output", recirc: "Recirculation", hgb: "Hemoglobin", vo2i: "VO₂ index", measuredSaO2: "Measured SaO₂" };
    const UNITS = { qEcmo: "L/min", co: "L/min", recirc: "%", hgb: "g/dL", vo2i: "mL/kg/min", measuredSaO2: "%" };

    // Plausibility guards. These are heuristics of this tool, not published cut-points: they catch a weight or
    // a unit typed wrong. A cardiac output above 12 L/min, or above 400 mL/kg/min in a small patient, and a
    // circuit flow above 300 mL/kg/min, raise a note and keep the status from reading as reassuring.
    const GUARD = { coMaxLpm: 12, coPerKg: 0.4, flowPerKg: 0.3 };
    const coGuard = (wt) => Math.min(GUARD.coMaxLpm, GUARD.coPerKg * wt);

    const fin = Number.isFinite;
    const rd = (v, n = 3) => +Number(v).toFixed(n);
    const decimals = (v) => { const s = String(rd(v)); const i = s.indexOf("."); return i < 0 ? 0 : s.length - i - 1; };
    // Show the value the model is using: at least minDec decimals, more when the value needs them.
    const fmtVal = (v, minDec = 0) => (fin(v) ? Number(v).toFixed(Math.max(minDec, decimals(v))) : "");
    const fmtFlow = (v) => (fin(v) ? (v < 1 ? v.toFixed(2) : v.toFixed(1)) : "—");
    const perKg = (lpm, kg) => (kg > 0 && fin(lpm) ? (lpm * 1000 / kg).toFixed(0) : "—");

    const cls = (...xs) => xs.filter(Boolean).join(" ");
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    // MODEL CLOSURE. VO₂ is an INPUT (weight × index) and SvO₂ is SOLVED from the Fick relation.
    // If SvO₂ were a free slider, VO₂ = CO·(CaO₂−CvO₂)·10 and DO₂ = CO·CaO₂·10 would share the cardiac-output
    // factor: DO₂:VO₂ would collapse to 1/OER and cardiac output would cancel out of it.
    //
    // Forward:  Δ = [VO₂/(10·CO) − 0.003·(PaO₂ − PvO₂)] / (K·Hgb)     (arterio-venous sat gap)
    //           SaO₂ = S_ECMO − Δ·(Q_native / Q_eff),   SvO₂ = SaO₂ − Δ
    // Reverse:  with x = SaO₂ − SvO₂ and A = S_ECMO − SaO₂ (fractions), G = 10·Q_eff,
    //           a = K·Hgb and b = 0.003·(PaO₂ − PvO₂):
    //             G·a·x² + [G·(b + a·A) − VO₂]·x + G·A·b = 0,   CO = Q_eff·(A + x)/x
    //           The larger root is the physiologic branch for adult-sized inputs.
    //           The quadratic has real roots only when A ≥ A_min, i.e. SaO₂ ≤ S_ECMO − A_min is unreachable:
    //             A_min = (√(VO₂/(10·Q_eff)) − √b)² / a    (the SaO₂ floor shown in the error text).
    // The arithmetic in calc() is unchanged from v2.3; v3.0 changes what is reported around it.
    function calc(state) {
      const { mode, sEcmo, qEcmo, co, measuredSaO2, recirc, hgb, paO2, pvO2, hufner, wt, vo2i } = state;
      const R = clamp(recirc, 0, 95) / 100;
      // Effective ECMO flow definition: Q_eff = Q * (1 - R) (Fisser 2022, PMID 36117961).
      const qEff = qEcmo * (1 - R);
      const vo2 = vo2i * wt;              // mL/min (demand, held fixed)
      const a = hufner * hgb;             // mL/dL per unit saturation fraction
      const b = 0.003 * (paO2 - pvO2);    // dissolved-O₂ arterio-venous difference, mL/dL
      const sE = sEcmo / 100;

      let coOut, saFrac, svFrac, error = null, warn = null, floorHit = false;

      // Lowest SaO₂ the mixing model can return at these settings (reverse mode).
      let floorSat = NaN;
      if (a > 0 && qEff > 0 && b >= 0) {
        const root = Math.sqrt(vo2 / (10 * qEff)) - Math.sqrt(b);
        if (root > 0) floorSat = (sE - (root * root) / a) * 100;
      }

      if (mode === "forward") {
        coOut = co;
        const delta = a > 0 ? (vo2 / (10 * coOut) - b) / a : 0;
        if (coOut < qEff) {
          error = "Effective ECMO flow (" + fmtFlow(qEff) + " L/min) is above the cardiac output (" + fmtFlow(coOut) + " L/min). The model assumes the pump cannot drain more venous blood than the patient returns, so there is no solution. Lower the flow, or check the cardiac output and the recirculation fraction.";
        } else if (delta < 0) {
          error = "The entered VO₂ is smaller than the dissolved-oxygen term alone (0.003·(PaO₂ − PvO₂)), which gives a negative arterio-venous saturation gap. Check PaO₂, PvO₂ and the VO₂ index.";
        } else {
          const qNative0 = coOut - qEff;
          saFrac = sE - (qEff > 0 ? delta * qNative0 / qEff : 0);
          svFrac = saFrac - delta;
          // The saturation-only mixing model cannot go below 0%. That is a result (delivery cannot meet demand), not an entry error.
          if (saFrac <= 0 || svFrac <= 0) floorHit = true;
        }
      } else {
        saFrac = measuredSaO2 / 100;
        const A = sE - saFrac;
        const G = 10 * qEff;
        const p = G * a;
        const q = G * (b + a * A) - vo2;
        const r = G * A * b;
        const disc = q * q - 4 * p * r;
        const x = (p > 0 && disc >= 0) ? (-q + Math.sqrt(disc)) / (2 * p) : NaN;
        if (A < 0) {
          error = "Measured SaO₂ exceeds the post-oxygenator saturation, which implies the native lung is contributing (model assumption violated).";
        } else if (!(disc >= 0)) {
          error = fin(floorSat)
            ? "Measured SaO₂ (" + fmtVal(measuredSaO2) + "%) is below the lowest value this model can produce at these settings (" + floorSat.toFixed(1) + "%). A saturation that low needs more VO₂, less effective ECMO flow (more recirculation) or less hemoglobin than entered. Check each of them, and check the sample."
            : "No physiologic solution at this SaO₂, hemoglobin, flow and VO₂. Check PaO₂ and PvO₂, and the sample.";
        } else if (!fin(x) || x <= 0) {
          error = "No physiologic solution: the solved SaO₂ − SvO₂ gap is zero or negative. Check VO₂, hemoglobin and flow.";
        } else if (saFrac - x <= 0) {
          error = "No physiologic solution: the implied SvO₂ falls to zero or below. Lower VO₂, or raise the hemoglobin or the ECMO flow. If the measured SaO₂ is high for this flow, native-lung gas exchange may be the reason, and this model cannot use it.";
        } else {
          svFrac = saFrac - x;
          coOut = qEff * (A + x) / x;
        }
      }
      if (error) { if (mode === "reverse") coOut = NaN; saFrac = mode === "reverse" ? saFrac : NaN; svFrac = NaN; }

      // Plausibility notes: they never change a number, and they stop the status from reading as reassuring.
      const g = coGuard(wt);
      if (!error) {
        const qNat = Math.max(0, coOut - qEff);
        if (mode === "reverse") {
          if (coOut > g) warn = "Solved CO " + fmtFlow(coOut) + " L/min (" + perKg(coOut, wt) + " mL/kg/min at " + wt + " kg) is above this tool's plausibility guard of " + fmtFlow(g) + " L/min. The guard is a heuristic of this tool, not a published cut-point. Suspect high recirculation, an over-stated VO₂ index, a wrong weight, or a sampling artifact.";
          else if (coOut > 0 && qNat / coOut < 0.15) warn = "Solved native flow is only " + (100 * qNat / coOut).toFixed(0) + "% of the cardiac output. At this point a little residual native-lung oxygenation lowers the solved CO sharply, so read it as a lower bound that may sit far below the true value. The 15% edge is a heuristic of this tool.";
        } else if (coOut > g) {
          warn = "Entered CO " + fmtFlow(coOut) + " L/min is " + perKg(coOut, wt) + " mL/kg/min at " + wt + " kg, above this tool's plausibility guard of " + fmtFlow(g) + " L/min (a heuristic, not a published cut-point). Check the weight and the cardiac output.";
        }
        if (!warn && qEcmo > GUARD.flowPerKg * wt) warn = "ECMO flow " + fmtFlow(qEcmo) + " L/min is " + perKg(qEcmo, wt) + " mL/kg/min at " + wt + " kg, above this tool's plausibility guard (a heuristic, not a published cut-point). Check the weight and the flow.";
        if (!warn && paO2 < pvO2) warn = "PaO₂ is below PvO₂. Check the two entries.";
        if (floorHit) warn = "The model reaches its floor: the solved " + (saFrac <= 0 ? "SaO₂" : "SvO₂") + " is at or below 0%, so oxygen delivery cannot meet the entered VO₂. Values are shown clamped at 0%. Raise the ECMO flow or the hemoglobin, or lower VO₂, and check the inputs.";
      }

      const saO2 = fin(saFrac) ? clamp(saFrac * 100, 0, 100) : NaN;
      const svO2 = fin(svFrac) ? clamp(svFrac * 100, 0, 100) : NaN;
      const qNative = fin(coOut) && !error ? Math.max(0, coOut - qEff) : NaN;
      const caO2 = fin(saO2) && !error ? hufner * hgb * (saO2 / 100) + 0.003 * paO2 : NaN;
      const cvO2 = fin(svO2) ? hufner * hgb * (svO2 / 100) + 0.003 * pvO2 : NaN;
      const do2  = (fin(coOut) && fin(caO2)) ? coOut * caO2 * 10 : NaN;
      const oer  = (fin(do2) && do2 > 0 && vo2 / do2 <= 1) ? vo2 / do2 : NaN;   // above 100% is not a physiologic extraction
      const ratio = (fin(do2) && vo2 > 0) ? do2 / vo2 : NaN;
      return { saO2, svO2, co: coOut, caO2, cvO2, do2, vo2, oer, ratio, qEff, qNative, R, error, warn, floorSat, floorHit };
    }

    // The VO₂ at which the model reproduces BOTH a measured SaO₂ and a cardiac output (closed form from the forward
    // equations). Display only: it tells the reader what the assumed VO₂ index would have to be.
    function impliedVo2(state, saPct, coLpm) {
      const R = clamp(state.recirc, 0, 95) / 100;
      const qEff = state.qEcmo * (1 - R);
      const a = state.hufner * state.hgb;
      const b = 0.003 * (state.paO2 - state.pvO2);
      const sE = state.sEcmo / 100, sa = saPct / 100;
      if (!(coLpm > qEff) || !(sa < sE) || !(qEff > 0)) return null;
      const delta = (sE - sa) * qEff / (coLpm - qEff);
      const vo2 = 10 * coLpm * (a * delta + b);
      if (!(vo2 > 0)) return null;
      return { vo2, index: vo2 / state.wt, sv: (sa - delta) * 100 };
    }

    // How far the answer moves across the assumptions the clinician cannot measure here:
    // VO₂ index ±33% and recirculation 0–20% (plus the value entered).
    function sensitivity(state) {
      // Children: the 3.0 default is an adult teaching value, so the band reaches twice the entered index.
      const fs = state.wt < 40 ? [0.67, 1, 1.5, 2] : [0.67, 1, 1.33];
      const vs = fs.map((f) => clamp(state.vo2i * f, LIM.vo2i[0], LIM.vo2i[1]));
      const rs = Array.from(new Set([0, state.recirc, 20]));
      const key = state.mode === "forward" ? "saO2" : "co";
      const vals = []; let n = 0;
      for (const v of vs) for (const r of rs) {
        n += 1;
        const o = calc({ ...state, vo2i: v, recirc: r });
        if (!o.error && fin(o[key])) vals.push(o[key]);
      }
      if (!vals.length) return { lo: NaN, hi: NaN, n, ok: 0, vlo: vs[0], vhi: vs[vs.length - 1], rhi: Math.max(...rs) };
      return { lo: Math.min(...vals), hi: Math.max(...vals), n, ok: vals.length, vlo: vs[0], vhi: vs[vs.length - 1], rhi: Math.max(...rs) };
    }

    // Provenance of the band edges below.
    // SOURCED: DO₂:VO₂ 5:1 normal and supply dependence near 2:1 (ELSO 2021, PMID 33965970).
    // SOURCED anchor for low-SaO₂ concern: ECMO flow below 60% of cardiac output is frequently
    //   associated with SaO₂ <90% in ARDS (Schmidt 2013, PMID 23291732); restated in ELSO 2021.
    // DERIVED / TOOL HEURISTIC, no published cut-point: the 75% and 80% SaO₂ edges (80% is taken
    //   from the lower bound of the ELSO-described 80–90% typical band), the 3:1 ratio flag,
    //   the 95% + 5:1 over-support label, the 40% OER flag used in the stat tiles, and the plausibility guards.
    // UNSOURCED, TOOL DEFAULT: the 3.0 mL/kg/min resting VO₂ index. No published resting-VO₂
    //   reference was verified; it is a teaching default and is labelled as such where it is entered.
    // The edges are applied to the values as displayed (one decimal), so a label never contradicts the number beside it.
    function statusFor(out, st) {
      if (out.error || !fin(out.saO2) || !fin(out.ratio)) return { label: "Cannot solve; check inputs", tone: "danger" };
      if (out.floorHit) return { label: "Delivery below demand", tone: "danger" };
      const rev = st.mode === "reverse";
      const sa = Math.round(out.saO2 * 10) / 10;
      const ra = Math.round(out.ratio * 10) / 10;
      let r;
      if (rev) {
        // The solved CO is a lower bound, so a low DO₂:VO₂ here is a floor, not a verdict.
        if (sa < 75) r = { label: "Inadequate oxygenation", tone: "danger" };
        else if (ra < 3) r = { label: "Low DO₂:VO₂ on a lower-bound CO; verify lactate and ScvO₂", tone: "warn" };
        else if (sa < 80) r = { label: "Below target; verify lactate", tone: "warn" };
        else if (sa > 95 && ra > 5) r = { label: "Comfortable (likely over-supported)", tone: "info" };
        else r = { label: "Within target range", tone: "ok" };
      } else {
        if (ra < 1) r = { label: "Delivery below demand", tone: "danger" };
        else if (ra < 2) r = { label: "Critical (anaerobic threshold)", tone: "danger" };
        else if (sa < 75) r = { label: "Inadequate oxygenation", tone: "danger" };
        else if (ra < 3) r = { label: "Marginal; consider escalation", tone: "warn" };
        else if (sa < 80) r = { label: "Below target; verify lactate", tone: "warn" };
        else if (sa > 95 && ra > 5) r = { label: "Comfortable (likely over-supported)", tone: "info" };
        else r = { label: "Within target range", tone: "ok" };
      }
      if (out.warn && (r.tone === "ok" || r.tone === "info")) r = { label: "Plausibility check: read the note below", tone: "warn" };
      return r;
    }

    const TONE = {
      ok:     { bg: "bg-emerald-50",  text: "text-emerald-800",  dot: "bg-emerald-500", border: "border-emerald-300" },
      info:   { bg: "bg-sky-50",      text: "text-sky-800",      dot: "bg-sky-500",     border: "border-sky-300" },
      warn:   { bg: "bg-amber-50",    text: "text-amber-900",    dot: "bg-amber-500",   border: "border-amber-300" },
      danger: { bg: "bg-rose-50",     text: "text-rose-900",     dot: "bg-rose-500",    border: "border-rose-300" },
    };

    const BADGE = {
      "Measured":    "bg-sky-100 text-sky-700 border-sky-200",
      "Set on pump": "bg-slate-100 text-slate-700 border-slate-200",
      "Assumed":     "bg-amber-50 text-amber-800 border-amber-200",
      "Solved":      "bg-violet-100 text-violet-700 border-violet-200",
      "Check only":  "bg-white text-slate-700 border-slate-200",
    };
    function Badge({ kind }) {
      return <span className={cls("vv-badge border", BADGE[kind])}>{kind}</span>;
    }

    // Entry rules (commit on pause, blur or Enter; honest messages):
    //  - A typed value that is in range is applied after a 0.5 s pause, or at once on blur or Enter. Nothing is
    //    applied while the digits are still arriving, so "12.5" never passes through 1 or 12 on its way in.
    //  - A value outside the range is held, not applied, and is moved to the nearest allowed value on blur, with a message.
    //  - The box always shows the value the model is using. A message disappears when something else changes the value.
    //  - Escape puts back the value the field had when it was entered. Focusing a box selects its contents.
    let FIELD_SEQ = 0;
    function Field({ label, value, onChange, min, max, step, unit, hint, source, minDec = 0, badge, optional, note, sliderMax }) {
      step = step || 1;
      const idRef = useRef(null);
      if (idRef.current === null) { FIELD_SEQ += 1; idRef.current = "vvf" + FIELD_SEQ; }
      const id = idRef.current;
      const hasValue = value !== null && value !== undefined;
      const display = hasValue ? fmtVal(value, minDec) : "";
      const [draft, setDraft] = useState(null);
      const [msg, setMsg] = useState(null);
      const timer = useRef(null);
      const lastWrite = useRef(undefined);
      const startVal = useRef(undefined);
      const justFocused = useRef(false);
      const skipBlur = useRef(false);
      const editing = draft !== null;
      const shown = editing ? draft : display;
      const range = min + "–" + max + (unit ? " " + unit : "");
      useEffect(() => { if (value !== lastWrite.current) setMsg(null); }, [value]);
      useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);
      const stop = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } };
      const apply = (v) => { lastWrite.current = v; onChange(v); };
      const settle = (raw, bad, final) => {
        const t = (raw || "").trim();
        if (t === "") {
          if (bad) { setMsg(final ? "Kept the previous value; that entry is not a number." : "Not a number. Allowed range " + range + "."); return; }
          if (optional) { apply(null); setMsg(null); return; }
          setMsg(final ? "Left blank; kept " + display + (unit ? " " + unit : "") + "." : "Enter a value in " + range + ". Nothing applied yet.");
          return;
        }
        const v = parseFloat(t);
        if (!fin(v)) { setMsg(final ? "Kept the previous value; that entry is not a number." : "Not a number. Allowed range " + range + "."); return; }
        if (v < min || v > max) {
          if (final) { const c = clamp(v, min, max); apply(c); setMsg("Adjusted " + v + " to " + c + ". Allowed range is " + range + "."); }
          else setMsg("Outside " + range + ". Not applied. It moves to the nearest allowed value when you leave the field.");
          return;
        }
        if (v !== value) apply(v);
        setMsg(null);
      };
      const onText = (e) => {
        const t = e.target.value, bad = !!(e.target.validity && e.target.validity.badInput);
        setDraft(t); setMsg(null); stop();
        timer.current = setTimeout(() => settle(t, bad, false), 500);
      };
      const onBlur = (e) => {
        stop();
        if (skipBlur.current) { skipBlur.current = false; return; }
        if (draft === null) return;
        const bad = !!(e.target.validity && e.target.validity.badInput);
        const raw = draft;
        setDraft(null);
        settle(raw, bad, true);
      };
      const onKey = (e) => {
        if (e.key === "Enter") { e.currentTarget.blur(); }
        else if (e.key === "Escape") {
          stop(); skipBlur.current = true; setDraft(null); setMsg(null);
          if (startVal.current !== undefined && value !== startVal.current) apply(startVal.current);
          e.currentTarget.blur();
        }
      };
      const onFocus = (e) => { startVal.current = hasValue ? value : null; justFocused.current = true; e.target.select(); };
      const onMouseUp = (e) => { if (justFocused.current) { e.preventDefault(); justFocused.current = false; } };
      const fromSlider = (e) => { stop(); setDraft(null); setMsg(null); apply(parseFloat(e.target.value)); };
      const invalid = editing && msg !== null && /^(Outside|Not a number)/.test(msg);
      const mid = hasValue ? value : min;
      return (
        <div className="flex flex-col gap-1.5 py-2">
          <div className="flex items-baseline justify-between gap-3">
            <label htmlFor={id} className="text-[13px] font-medium text-slate-700 flex flex-wrap items-center gap-2">
              {label}
              {badge && <Badge kind={badge} />}
            </label>
            <div className="flex items-baseline gap-1 shrink-0">
              <input
                id={id}
                type="number"
                inputMode="decimal"
                aria-label={label}
                aria-invalid={invalid ? "true" : undefined}
                value={shown}
                min={min} max={max} step={step}
                onChange={onText}
                onBlur={onBlur}
                onKeyDown={onKey}
                onFocus={onFocus}
                onMouseUp={onMouseUp}
                className={cls("w-20 rounded-md border bg-white px-2 py-1 text-right text-sm font-semibold text-slate-900 tabular-nums focus:ring-2 focus:ring-sky-100", invalid ? "border-rose-300" : "border-slate-200 focus:border-sky-400")}
              />
              <span className="vv-unit text-xs text-slate-500">{unit}</span>
            </div>
          </div>
          {!optional && <input id={id + "r"} type="range" aria-label={label + " (slider)"} aria-valuetext={display + (unit ? " " + unit : "")} min={min} max={sliderMax || max} step={step} value={mid} onChange={fromSlider} className="w-full" />}
          {msg && <p role="status" className={cls("text-[12px] leading-snug font-medium", invalid ? "text-rose-700" : "text-amber-800")}>{msg}</p>}
          {note && <p className="vv-note">{note}</p>}
          {hint && <p className="text-[12px] leading-snug text-slate-500">{hint}</p>}
          {source && <details className="vv-src"><summary>Source and caveat</summary><p>{source}</p></details>}
        </div>
      );
    }

    // A value the model solves. It is plain text, not a box, so it cannot be mistaken for a field.
    function SolvedRow({ label, value, unit, hint, source, error }) {
      return (
        <div className="flex flex-col gap-1 py-2">
          <div className="flex items-baseline justify-between gap-3">
            <div className="text-[13px] font-medium text-slate-700 flex flex-wrap items-center gap-2">

              <Badge kind="Solved" />

          </div>

    }

    function Group({ title, desc, children }) {
      return (
        <div className="vv-group">
          <div className="vv-group-h"><h3>{title}</h3>{desc && <p>{desc}</p>}</div>
          <div className="divide-y divide-slate-100">{children}</div>

    function Stat({ label, value, unit, sub, tone, emphasize }) {
      const palette = {
        default: "bg-white border-slate-200",
        primary: "bg-sky-50 border-sky-200",
        derived: "bg-violet-50 border-violet-200",
        danger:  "bg-rose-50 border-rose-200",
        warn:    "bg-amber-50 border-amber-200",
        ok:      "bg-emerald-50 border-emerald-200",

      return (
        <div className={cls("rounded-xl border px-4 py-3 flex flex-col justify-between min-h-[88px]", palette[tone] || palette.default)}>
          <div className="text-[11px] font-medium uppercase tracking-wide text-slate-500">{label}</div>
          <div className="flex items-baseline gap-1.5 mt-1">
            <span className={cls("tabular-nums font-semibold text-slate-900", emphasize ? "text-3xl" : "text-xl")}>{value}</span>
            {unit && <span className="text-xs text-slate-500">{unit}</span>}
          </div>
          {sub && <div className="text-[11px] text-slate-500 mt-0.5">{sub}</div>}
        </div>
      );
    }

    // The bar colour follows the status tone, so the gauge and the verdict cannot disagree.
    function SatGauge({ saO2, label, sub, tone }) {
      const ok = fin(saO2);
      const pct = ok ? clamp(saO2, 0, 100) : 0;
      return (
        <div className="rounded-xl border border-slate-200 bg-white p-4">
          <div className="flex items-baseline justify-between mb-2">
            <div className="text-[11px] font-medium uppercase tracking-wide text-slate-500">{label}</div>

            </div>
          </div>
          <div className="relative h-3 w-full rounded-full bg-slate-100 overflow-hidden">
            <div className={cls("absolute inset-y-0 left-0 rounded-full transition-all duration-300", ok ? TONE[tone].dot : "bg-slate-100")} style={{ width: pct + "%" }} />
            <div className="absolute inset-y-0 border-l border-slate-400/60" style={{ left: "80%" }} />
            <div className="absolute inset-y-0 border-l border-slate-400/60" style={{ left: "90%" }} />
          </div>
          <div className="vv-ticks" aria-hidden="true">
            <span style={{ left: 0 }}>0%</span>
            <span style={{ left: "80%" }}>80%</span>
            <span style={{ left: "90%" }}>90%</span>
          </div>
          <div className="mt-2 text-[12px] text-slate-500">{sub}</div>
        </div>
      );
    }

    function ScenarioButton({ label, sub, onClick, tone }) {
      const palette = {
        slate:  "bg-white hover:bg-slate-50 border-slate-200 text-slate-800",
        sky:    "bg-sky-50 hover:bg-sky-100 border-sky-200 text-sky-900",
        amber:  "bg-amber-50 hover:bg-amber-100 border-amber-200 text-amber-900",
        violet: "bg-violet-50 hover:bg-violet-100 border-violet-200 text-violet-900",
        rose:   "bg-rose-50 hover:bg-rose-100 border-rose-200 text-rose-900",
        teal:   "bg-teal-50 hover:bg-teal-100 border-teal-200 text-teal-900",
      };
      return (
        <button type="button" onClick={onClick} className={cls("vv-scn rounded-lg border px-3 py-2.5 text-left transition-colors w-full", palette[tone] || palette.slate)}>
          <div className="text-[13px] font-semibold leading-tight">{label}</div>
          {sub && <div className="vv-scn-sub text-[12px] mt-0.5 leading-snug">{sub}</div>}
        </button>
      );
    }

    // Compact result for phones and tablets: it stays on screen while the fields are edited.
    function SummaryBar({ out, status, mode }) {
      return (
        <div className="vv-bar" aria-hidden="true">
          <div className="vv-bar-n">
            <span className="vv-bar-k">{mode === "forward" ? "Predicted SaO₂" : "Measured SaO₂"}</span>
            <span className="vv-bar-v">{fin(out.saO2) ? out.saO2.toFixed(1) : "—"}<small>%</small></span>
          </div>
          <div className="vv-bar-n">
            <span className="vv-bar-k">{mode === "forward" ? "CO (entered)" : "CO (solved)"}</span>
            <span className="vv-bar-v">{fin(out.co) ? out.co.toFixed(2) : "—"}<small> L/min</small></span>
          </div>
          <div className="vv-bar-s"><span className={cls("inline-block h-2.5 w-2.5 rounded-full shrink-0", TONE[status.tone].dot)} />{status.label}</div>
        </div>
      );
    }

    // Worked examples: all at 70 kg, K = 1.34, S_ECMO = 100%. The outputs are recomputed from the inputs, and Load
    // puts exactly these inputs into the calculator (the VO₂ index is VO₂ ÷ 70).
    const EXAMPLES = [
      { n: "1", name: "ARDS, moderate flow", hgb: 11, co: 6.0, q: 4.0, R: 0,  vo2: 210, pa: 60, pv: 35 },
      { n: "2", name: "Under-supported",     hgb: 10, co: 7.0, q: 3.0, R: 0,  vo2: 185, pa: 45, pv: 30 },
      { n: "3", name: "Anemic, full flow",   hgb: 7,  co: 5.0, q: 4.5, R: 0,  vo2: 133, pa: 80, pv: 40 },
      { n: "4", name: "Septic, hyperdyn",    hgb: 9,  co: 9.0, q: 5.0, R: 0,  vo2: 306, pa: 45, pv: 28 },
      { n: "5", name: "Recirculation 30%",   hgb: 11, co: 5.5, q: 4.5, R: 30, vo2: 190, pa: 60, pv: 33 },
    ];
    const exState = (e) => ({ ...BASELINE, mode: "forward", hgb: e.hgb, co: e.co, qEcmo: e.q, recirc: e.R, vo2i: e.vo2 / 70, paO2: e.pa, pvO2: e.pv, wt: 70, hufner: 1.34, sEcmo: 100 });

    function App() {
      const [tab, setTab] = useState("sat");
      const [state, setState] = useState(BASELINE);
      const [wtTouched, setWtTouched] = useState(false);
      const [scenNote, setScenNote] = useState(null);
      const update = useCallback((patch) => setState((s) => ({ ...s, ...patch })), []);
      const out = useMemo(() => calc(state), [state]);
      const status = useMemo(() => statusFor(out, state), [out, state]);
      const sens = useMemo(() => (calc(state).error ? null : sensitivity(state)), [state]);

      const reset = () => { setState({ ...BASELINE, mode: state.mode }); setWtTouched(false); setScenNote(null); };
      // Switching direction carries the value the other direction was showing, so the scenario stays the same one.
      const setMode = (mode) => {
        if (mode === state.mode) return;
        const patch = { mode };
        if (mode === "reverse" && fin(out.saO2)) patch.measuredSaO2 = clamp(rd(out.saO2, 1), LIM.measuredSaO2[0], state.sEcmo);
        if (mode === "forward" && fin(out.co)) patch.co = clamp(rd(out.co, 2), LIM.co[0], LIM.co[1]);
        update(patch); setScenNote(null);
      };
      // Scenario buttons: every result is clamped to the field limits, and a clamp is said out loud.
      const scenario = (raw) => {
        const patch = {}; const notes = [];
        for (const k of Object.keys(raw)) {
          const hi = k === "measuredSaO2" ? state.sEcmo : LIM[k][1];
          const c = clamp(raw[k], LIM[k][0], hi);
          patch[k] = rd(c);
          if (Math.abs(c - raw[k]) > 1e-9) notes.push(NAMES[k] + " held at " + fmtVal(patch[k]) + " " + UNITS[k] + ", the limit of the field");
        }
        update(patch); setScenNote(notes.length ? notes.join("; ") + "." : null);
      };
      const flowStep = clamp(Math.round(state.wt * 0.025 / 0.05) * 0.05, 0.05, 1.0);
      const fs = fmtFlow(flowStep);
      const sCoUp     = () => scenario({ co: state.co * 1.3 });
      const sVo2Up    = () => scenario({ vo2i: state.vo2i + 1.0 });
      const sEcmoUp   = () => scenario({ qEcmo: state.qEcmo + flowStep });
      const sEcmoDown = () => scenario({ qEcmo: state.qEcmo - flowStep });
      const sRecircUp = () => scenario({ recirc: state.recirc + 20 });
      const sAnemia   = () => scenario({ hgb: state.hgb - 4 });
      const sTransfuse= () => scenario({ hgb: state.hgb + 2 });
      const sSeptic   = () => scenario({ co: state.co * 1.4, vo2i: state.vo2i + 1.0 });
      const sSaUp     = () => scenario({ measuredSaO2: state.measuredSaO2 + 5 });
      const sSaDown   = () => scenario({ measuredSaO2: state.measuredSaO2 - 5 });

      const fwd = state.mode === "forward";
      const ra1 = fin(out.ratio) ? Math.round(out.ratio * 10) / 10 : NaN;
      const oerPct = fin(out.oer) ? Math.round(out.oer * 100) : NaN;
      const ratioTone = !fin(ra1) ? "default" : (ra1 < 2 ? (fwd ? "danger" : "warn") : ra1 < 3 ? "warn" : "ok");

      // Cross-check block: display only, never read by calc().
      const x = [];
      if (fwd && state.cmpSa !== null && !out.error) {
        const d = state.cmpSa - out.saO2;
        const iv = impliedVo2(state, state.cmpSa, state.co);
        x.push({ k: "SaO₂", t: "Predicted " + out.saO2.toFixed(1) + "% against your measured " + fmtVal(state.cmpSa, 1) + "%: " + (d >= 0 ? "+" : "−") + Math.abs(d).toFixed(1) + " points (measured minus predicted).",
          s: iv ? "For the model to reproduce both your SaO₂ and this cardiac output, the VO₂ index would have to be " + iv.index.toFixed(2) + " mL/kg/min (" + iv.vo2.toFixed(0) + " mL/min) instead of the " + fmtVal(state.vo2i, 1) + " assumed, with SvO₂ " + iv.sv.toFixed(1) + "%. If that is far from what you expect, suspect recirculation, native-lung gas exchange, or the cardiac output." : "The two values cannot be reconciled by VO₂ alone: the measured SaO₂ must be below the post-oxygenator saturation and the cardiac output above the effective flow." });
      }
      if (!fwd && state.cmpCo !== null && !out.error) {
        const d = state.cmpCo - out.co;
        const iv = impliedVo2(state, state.measuredSaO2, state.cmpCo);
        x.push({ k: "Cardiac output", t: "Solved CO " + out.co.toFixed(2) + " L/min against your measured " + fmtVal(state.cmpCo, 2) + " L/min: " + (d >= 0 ? "+" : "−") + Math.abs(d).toFixed(2) + " L/min (measured minus solved).",
          s: iv ? "For the model to reproduce both your SaO₂ and this cardiac output, the VO₂ index would have to be " + iv.index.toFixed(2) + " mL/kg/min (" + iv.vo2.toFixed(0) + " mL/min) instead of the " + fmtVal(state.vo2i, 1) + " assumed. A measured CO well above the solved one can also mean native-lung gas exchange (the solved CO is a lower bound) or a thermodilution error." : "The two values cannot be reconciled by VO₂ alone: the measured CO must exceed the effective ECMO flow." });
      }
      if (state.cmpPre !== null) {
        const gap = state.sEcmo - state.cmpPre;
        const parts = [];
        if (!out.error && fin(out.svO2)) {
          const pre = (1 - out.R) * out.svO2 + out.R * state.sEcmo;
          parts.push("The model implies a pre-oxygenator saturation of " + pre.toFixed(1) + "% (true mixed venous " + out.svO2.toFixed(1) + "% mixed with recirculated outlet blood at R = " + fmtVal(state.recirc) + "%). Your reading: " + fmtVal(state.cmpPre, 1) + "%.");
        }
        if (gap > 0) {
          const v = 10 * state.qEcmo * state.hufner * state.hgb * (gap / 100);
          parts.push("Oxygen added across the membrane, from the saturation drop alone: about " + v.toFixed(0) + " mL/min (" + (v / state.wt).toFixed(2) + " mL/kg/min at " + state.wt + " kg). In steady state with no native-lung transfer this equals the patient's VO₂, whatever the recirculation. It ignores dissolved O₂ and native-lung transfer, so it is approximate.");
        } else {
          parts.push("A pre-oxygenator saturation at or above the post-oxygenator one implies no oxygen transfer. Check both readings.");
        }
        x.push({ k: "Circuit saturation", t: parts[0], s: parts.slice(1).join(" ") });
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 antialiased">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

            <header className="mb-4">
              <div className="flex flex-wrap items-end justify-between gap-3">
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-slate-900">V-V ECMO Oxygenation Calculator</h1>
                  <p className="text-sm text-slate-600 mt-0.5">Interactive teaching model · Bartlett mixing model, Compr Physiol 2020 · Adult-derived evidence base, weight-indexed inputs · For ICU / PCCM fellows</p>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={reset} className="text-sm px-3 py-1.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-slate-700">Reset baseline</button>
                </div>
              </div>
            </header>

            <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 mb-5 flex gap-3 items-start">
              <div className="text-amber-600 mt-0.5 shrink-0">⚠</div>
              <div className="text-[13px] text-amber-900 leading-snug">
                {fwd ? (
                  <React.Fragment><strong>Teaching model assumes zero native lung gas exchange.</strong> Real V-V ECMO patients have residual native-lung function, so actual SaO₂ is usually <em>higher</em> than predicted. In this direction the predicted SaO₂ is a lower bound and a thought aid, not a substitute for an arterial blood gas.</React.Fragment>
                ) : (
                  <React.Fragment><strong>Teaching model: in this direction the bias runs the other way.</strong> Residual native-lung function raises the measured SaO₂ above what mixing alone can produce, narrowing SaO₂ − SvO₂ and back-solving a cardiac output that is systematically <em>too low</em>. A recirculation entered below the true value pushes the other way and <em>over-states</em> it, and the two errors do not cancel. Read the solved CO, and the DO₂:VO₂ built on it, with both in mind.</React.Fragment>
                )}
                {" "}Not for clinical decisions.
                <details className="vv-src mt-2">
                  <summary>Scope and limits</summary>
                  <p>Every threshold, cohort and flow range cited in this tool is adult or animal: the ELSO 2021 <em>adult</em> V-V guideline, Schmidt 2013, Patel 2019, Fisser 2022, Russ 2022 (pigs) and BLENDER (veno-arterial); the only pediatric-adjacent source is a neonatal cannula simulation. Flow, cardiac-output and VO₂ fields are weight-indexed and the sliders reach neonatal values, but no pediatric cut-point here is sourced. Do not carry the 5–6 L/min cannula ceiling or the 80–90% SaO₂ band onto a child.</p>
                </details>
              </div>
            </div>

            <SummaryBar out={out} status={status} mode={state.mode} />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">

              <section className="lg:col-span-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" aria-labelledby="vv-inputs-h">
                <h2 id="vv-inputs-h" className="text-sm font-semibold text-slate-900 mb-2">Inputs</h2>

                <div className="vv-mode" role="group" aria-label="What you have">
                  <div className="vv-mode-k">I have</div>
                  <div className="vv-seg">
                    <button type="button" aria-pressed={!fwd} onClick={() => setMode("reverse")} className={cls("px-3 py-1.5 rounded-md text-[13px] font-medium transition-colors", !fwd ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900")} title="Enter the measured SaO₂; solve for CO">
                      The patient's SaO₂ <span className="font-normal">(solve CO)</span>
                    </button>
                    <button type="button" aria-pressed={fwd} onClick={() => setMode("forward")} className={cls("px-3 py-1.5 rounded-md text-[13px] font-medium transition-colors", fwd ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900")} title="Enter CO; predict SaO₂">
                      A cardiac output <span className="font-normal">(predict SaO₂)</span>
                    </button>
                  </div>
                  <p className="text-[12px] text-slate-500 mt-1.5">{fwd ? "Enter a cardiac output; the SaO₂ shown is predicted by the mixing equation." : "Enter the arterial SaO₂ from the blood gas; the calculator back-solves the cardiac output."} Switching carries the value across.</p>
                </div>

                <Group title="Patient" desc="From the chart, the blood gas and the monitor">
                  <Field label="Body weight" value={state.wt} onChange={(v) => { setWtTouched(true); update({ wt: v }); }} min={LIM.wt[0]} max={LIM.wt[1]} step={0.5} unit="kg" badge="Measured"
                    note={!wtTouched ? "Default 70 kg. Enter the patient's weight: it sets total VO₂, every per-kg readout, the plausibility guards and the scenario step sizes." : null}
                    hint="Sets total VO₂ and indexes the flow readouts."
                    source="Sets total VO₂ and indexes the flow readouts, the plausibility guards and the scenario step sizes. Nothing else in this tool is size-specific. The cited bands and ceilings remain adult." />
                  <Field label="Hemoglobin" value={state.hgb} onChange={(v) => update({ hgb: v })} min={LIM.hgb[0]} max={LIM.hgb[1]} step={0.5} unit="g/dL" minDec={1} badge="Measured"
                    hint={"Each gram binds " + state.hufner + " mL O₂; less hemoglobin widens the arterio-venous saturation gap."}
                    source={"Each gram binds " + state.hufner + " mL O₂ (1.34: Bartlett 2017, PMID 27040797; 1.39: ELSO 2021). With VO₂ fixed, less hemoglobin forces a wider arterio-venous saturation gap, so anemia lowers SvO₂ and SaO₂ as well as CaO₂ and DO₂."} />
                  {fwd ? (
                    <Field label="Cardiac output (CO)" value={state.co} onChange={(v) => update({ co: v })} min={LIM.co[0]} max={LIM.co[1]} sliderMax={clamp(rd(coGuard(state.wt), 2), 1, LIM.co[1])} step={0.05} unit="L/min" minDec={1} badge="Measured"
                      hint={"Total venous return: " + perKg(state.co, state.wt) + " mL/kg/min at " + state.wt + " kg. Enter an echo or catheter value, or your best estimate."}
                      source="Sepsis, fever and agitation raise CO; a higher CO dilutes the ECMO contribution. Thermodilution overestimated CO by 2.1–2.7 L/min during V-V ECMO in six anesthetized pigs (Russ 2022, PMID 34860710); a porcine finding, not a human V-V ECMO measurement, and not a licence to discount a measured cardiac output by 2 L/min at the bedside." />
                  ) : (
                    <Field label="Measured arterial SaO₂" value={state.measuredSaO2} onChange={(v) => update({ measuredSaO2: v })} min={LIM.measuredSaO2[0]} max={state.sEcmo} step={0.5} unit="%" minDec={1} badge="Measured"
                      hint="From the arterial blood gas (a pulse-oximeter SpO₂ is only an estimate of it). It cannot exceed the post-oxygenator saturation."
                      source="Any residual native-lung oxygenation carried inside this number biases the solved cardiac output low." />
                  )}
                  <Field label="Arterial PaO₂" value={state.paO2} onChange={(v) => update({ paO2: v })} min={LIM.paO2[0]} max={LIM.paO2[1]} step={1} unit="mmHg" badge="Measured"
                    hint="The patient's arterial value. It adds only the small dissolved-O₂ term, 0.003·PaO₂ mL/dL."
                    source="On V-V ECMO commonly 50–80 mmHg (a teaching convention carried by this tool); ELSO 2021 gives no PaO₂ range and states only that SaO₂ is typically 80–90%. A very high PaO₂ is described with a return cannula across the interatrial septum, where this model does not apply (Guevara-Chaux, PMID 40985532)." />
                </Group>

                <Group title="Circuit" desc="From the pump console and the circuit monitor">
                  <Field label="ECMO blood flow (Q_ECMO)" value={state.qEcmo} onChange={(v) => update({ qEcmo: v })} min={LIM.qEcmo[0]} max={LIM.qEcmo[1]} sliderMax={clamp(rd(GUARD.flowPerKg * state.wt, 2), 1, LIM.qEcmo[1])} step={0.05} unit="L/min" minDec={1} badge="Set on pump"
                    hint={perKg(state.qEcmo, state.wt) + " mL/kg/min at " + state.wt + " kg, shown for scale only."}
                    source="Cannula-limited. ELSO 2021 gives 5–6 L/min as the usual ceiling set by cannula size and Patel 2019 describes typical flows of 3–4 L/min (both adult figures). No weight-indexed flow target is sourced in this tool. Higher flows are conventionally linked to hemolysis and access insufficiency, but no flow threshold for either is published." />
                  <Field label="Post-oxygenator (ECMO outlet) saturation" value={state.sEcmo} onChange={(v) => update({ sEcmo: v })} min={LIM.sEcmo[0]} max={LIM.sEcmo[1]} step={1} unit="%" badge="Measured"
                    hint="Blood leaving the oxygenator, not the drainage line. About 100% when the membrane works."
                    source="A healthy oxygenator returns blood at ~100%. Judge oxygenator dysfunction by a rising transmembrane pressure drop (normal <50 mmHg; a change >100 mmHg suggests obstruction) together with a falling post-membrane PaO₂, not by a single saturation cut-point (Patel 2019, PMID 31632747). No published post-oxygenator saturation threshold was found. The pre-oxygenator (drainage-line) saturation goes in the check box below, not here." />
                </Group>

                <Group title="Assumptions" desc="Defaults you can change. They are not measured here, and the answer moves with them">
                  <Field label="Recirculation fraction" value={state.recirc} onChange={(v) => update({ recirc: v })} min={LIM.recirc[0]} max={LIM.recirc[1]} step={1} unit="%" badge="Assumed"
                    hint="Default 0%. Enter an estimate if you have one; see the sensitivity line under the result."
                    source="Femoro-jugular median 5% (IQR 0–11) vs jugulo-femoral 19% (IQR 13–28) (Fisser 2022, PMID 36117961, erratum on record, Front Med (Lausanne) 2022;9:1045207, PMID 36267622; linkage only, consult before relying on these figures). In single-lumen atrio-femoral support, a conventional draining cannula gave 38.0 ± 13.7% vs 19.0 ± 12.2% for a multistage design (Palmér 2016, PMID 27660904); malpositioned neonatal dual-lumen cannulae reached 39 ± 4%, maximum 42%, in a validated CFD model (Jamil 2020, PMID 31580212). Effective ECMO flow = Q_ECMO × (1 − R). Reviews: Abrams 2015, PMID 25423117; Tomarchio 2024, PMID 38654449." />
                  <Field label="Oxygen consumption (VO₂ index)" value={state.vo2i} onChange={(v) => update({ vo2i: v })} min={LIM.vo2i[0]} max={LIM.vo2i[1]} step={0.1} unit="mL/kg/min" minDec={1} badge="Assumed"
                    note={state.wt < 40 ? "Below 40 kg, 3.0 mL/kg/min is an adult teaching default and is not sourced for children. The result moves a lot with this value; see the sensitivity line." : null}
                    hint={"Total VO₂ = " + (state.vo2i * state.wt).toFixed(0) + " mL/min at " + state.wt + " kg. A teaching default, not a measurement."}

                    source="On V-V ECMO the return cannula discharges upstream of the pulmonary artery, so a PA-catheter sample is the post-mixing product of this equation rather than an input to it: feeding one back in drives SaO₂ and SvO₂ together and, in reverse mode, back-solves an arbitrarily large cardiac output. The circuit's pre-oxygenator (drainage-line) saturation is a different quantity: it mixes true venous blood with recirculated outlet blood, so it sits at or above the SvO₂ solved here. Enter it in the check box below to compare. No validated bedside route to a true mixed venous on V-V ECMO was found. Walker 2009 (PMID 19948749) is a bench derivation in a circuit primed with porcine blood whose own conclusion calls the original model an oversimplification of the high arterial pO₂ during therapy, with accurate clinical calculation left to future work (a method not yet clinically validated, not a sampling instruction)." />

              <p className="text-[12px] text-slate-500 mb-3">Each row is reversible: give it the SaO₂ and recover the CO, or give it the CO and recover the SaO₂. The nine columns after the scenario name are inputs; SvO₂, SaO₂, DO₂ and the ratio are outputs of the closed model, recomputed here from those inputs. Load puts the whole row into the calculator (mode "A cardiac output", 70 kg), so every figure can be reproduced on screen.</p>

                      <th className="py-2 pr-3 font-medium">SvO₂ out</th>

              </div>
              <p className="text-[12px] text-slate-500 mt-3 leading-snug">Conventions: weight 70 kg, so each row's VO₂ index is its VO₂ ÷ 70 and is not a round number (Load enters it exactly) · K = 1.34 mL O₂/g Hgb · S_ECMO = 100% · VO₂ in mL/min. Case 5 uses effective Q_ECMO = 4.5 × (1−0.30) = 3.15 L/min. SvO₂ is solved from the Fick relation, so each row has one degree of freedom fewer than a model with a free SvO₂ slider. The reverse solver returns the entered cardiac output from the unrounded SaO₂; typing the one-decimal SaO₂ printed above returns it to within about 0.02 L/min on these five rows.</p>

            <section className="mt-6 grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 className="text-sm font-semibold text-slate-900 mb-2">Key caveats</h2>
                <ul className="text-[12px] text-slate-700 space-y-1.5 list-disc pl-5 leading-snug">
                  <li><strong>No native lung function: the sign of that error flips between the two modes.</strong> In <em>forward</em> mode the predicted SaO₂ is a lower bound: recovering lungs raise the real SaO₂ above it. In <em>reverse</em> mode the same residual lung function raises the measured SaO₂, narrows SaO₂ − SvO₂ and back-solves a cardiac output that is systematically <em>too low</em>. The one note that names this bias flags a solved native flow below 15% of the cardiac output (a heuristic of this tool). The guard for a measured SaO₂ above the post-oxygenator saturation cannot fire while the field limits hold the measured value at or below it. Otherwise nothing warns automatically: read the solved CO as a possible under-estimate. It does not correct the thermodilution bias below; it errs the other way, and a spuriously low CO in a hypoxemic patient invites inotrope or volume decisions this model cannot support.</li>
                  <li><strong>SvO₂ is solved here, not sampled: no validated bedside route to a true mixed venous on V-V ECMO was found.</strong> The return cannula discharges upstream of the pulmonary artery, so a PA-catheter sample is the post-mixing product of this equation rather than an input to it. Entering one collapses the forward equation toward SaO₂ = SvO₂ and drives the reverse denominator toward zero, and at the bedside it teaches a trainee to read arterial-equivalent blood as a reassuring extraction ratio in an under-supported patient. The published alternative (correcting a pre-membrane sample for recirculation) rests on Walker 2009 (PMID 19948749), a bench derivation in a circuit primed with porcine blood whose own conclusion is that the original model is an oversimplification of the high arterial pO₂ during therapy and that accurate clinical calculation awaits further work. Treat it as a method not yet clinically validated. The circuit's pre-oxygenator (venous-line) saturation is a different quantity from the SvO₂ solved here: it mixes true venous blood with recirculated outlet blood. The optional check box under Inputs compares it with the model and never feeds it into the result. No published source was found for the sometimes-taught maneuver of briefly stopping sweep gas to read a true mixed venous, and neither Walker 2009 nor Schmidt 2013 describes it.</li>
                  <li><strong>Status bands are this tool's display heuristics.</strong> The 75% and 80% SaO₂ edges, the 3:1 ratio flag, the 95% over-support label and the 40% OER flag are conventions of this calculator, not guideline cut-points. The 80% edge is taken from the lower bound of the ELSO-described 80–90% typical band. The nearest sourced anchor for low-SaO₂ concern is an ECMO flow below 60% of cardiac output, frequently associated with SaO₂ &lt;90% in ARDS (Schmidt 2013, PMID 23291732; restated in ELSO 2021).</li>
                  <li><strong>SaO₂ 80–90% is a tolerated floor, not a goal</strong> (Ortoleva &amp; Chweich 2022, PMID 35644745; a two-page letter, not a primary study). Lactate, ScvO₂, and the DO₂:VO₂ trend trump any single number.</li>
                  <li><strong>DO₂:VO₂ &lt; 2:1</strong> = the supply-dependence threshold, with 5:1 as the normal ratio, both stated in ELSO 2021 (PMID 33965970).</li>
                  <li><strong>Dissolved O₂ small but real.</strong> 0.003·PaO₂ mL/dL: about 1.5% of CaO₂ at PaO₂ 100 with Hgb 15 and SaO₂ 100%, about 2.0% at Hgb 11 under the same conditions, about 1.4% at this tool's baseline (PaO₂ 60, SaO₂ 88%), and larger in severe anemia. ELSO 2021 writes the same term as 0.0034·PaO₂.</li>
                  <li><strong>Hüfner constant 1.34 vs 1.39.</strong> 1.34 accounts for normal MetHb/COHb (Bartlett 2017, PMID 27040797); ELSO 2021 uses 1.39.</li>
                  <li><strong>DO₂:VO₂ means something here only because VO₂ is an input.</strong> If SvO₂ were a free slider, VO₂ = CO·(CaO₂ − CvO₂)·10 and DO₂ = CO·CaO₂·10 would share the cardiac-output factor: the ratio would collapse to 1/OER, CO would cancel identically, and weaning ECMO flow would make the ratio rise. This calculator holds VO₂ fixed at weight × index and solves SvO₂ from Fick, so the ratio responds to flow, hemoglobin and cardiac output in the directions a bedside clinician expects. The 3.0 mL/kg/min default index is this calculator's teaching convention; no published resting-VO₂ reference was verified for it.</li>
                  <li><strong>Reverse mode has an SaO₂ floor, and no solution below it.</strong> The back-solve is a quadratic in SaO₂ − SvO₂. Its roots are real only when the measured SaO₂ is at or above a floor, S_ECMO − (√(VO₂/(10·Q_eff)) − √b)² / (K·Hgb) with b = 0.003·(PaO₂ − PvO₂). Below the floor the entered VO₂ is too <em>low</em>, or the effective flow too high, to explain a saturation that low: raising VO₂, adding recirculation or lowering hemoglobin moves the floor down, and the error text gives its value at the current settings. The tool also reports no solution when the only root is non-positive or when the implied SvO₂ falls to zero. For small patients the quadratic can have a second physiologic root at a very high cardiac output; the tool returns the root with the larger saturation gap, which is the lower cardiac output.</li>
                  <li><strong>Real recirculation runs higher than a zeroed slider suggests, and this tool has no input for its strongest determinant.</strong> In 21 high-flow V-V patients, recirculation was measurable in 19 (median 14%, IQR 7–25) and 12 (57%) had ≥10%; right ventricular dysfunction more than doubled it (25% vs 9%) (PMID 42490650).</li>
                  <li><strong>Measured cardiac output is itself biased high on V-V ECMO (in pigs).</strong> Thermodilution overestimated CO by a mean 2.1 L/min in healthy animals and 2.7 L/min after lung injury, and the error grew with recirculation, in six anesthetized pigs (Russ 2022, PMID 34860710). It is a porcine finding, not a human V-V ECMO measurement, and the reverse mode is not the corrective for it: the back-solve carries its own opposite bias (first bullet above), so the two errors do not cancel.</li>
                  <li><strong>A return cannula across the interatrial septum invalidates the model.</strong> Inadvertent veno-left-atrial return produces a very high PaO₂ with absent recirculation and a low sweep requirement; in reverse mode this calculator would back-solve a meaningless cardiac output (Guevara-Chaux, PMID 40985532).</li>
                  <li><strong>Oxygen-target trials do not yet license moving the band.</strong> BLENDER randomized conservative (SaO₂ 92–96%) against liberal (97–100%) targets and found no difference in ICU-free days or mortality, but it studied <em>veno-arterial</em> ECMO (PMID 39162827). A meta-analysis of 12 studies found hyperoxia associated with higher mortality overall (OR 1.41, 95% CI 1.22–1.64) with no significant association in the V-V subgroup (PMID 41237735), which also tempers the over-supported label above. <span className="text-slate-500">BLENDER (PMID 39162827) has an erratum on record: Intensive Care Med 2024;50(12):2241–2242, PMID 39412548. Link only; consult it before relying on this result.</span></li>
                  <li><strong>Confirming recirculation or cannula position is an ultrasound question.</strong> The 2026 ELSO state-of-the-art review covers the bedside strategies this calculator cannot substitute for (Douflé, PMID 41588617).</li>
                  <li><strong>Every threshold in this tool is adult or animal; none of it is a pediatric cut-point.</strong> The cited evidence base is the ELSO 2021 <em>adult</em> V-V guideline, Schmidt 2013 (adult ARDS), Patel 2019 (adult review), Fisser 2022 (adult), Russ 2022 (pigs), Ortoleva 2022 (adult letter) and BLENDER (adult veno-arterial); the only pediatric-adjacent source is a neonatal cannula flow simulation (CFD) (Jamil 2020). Flow, cardiac-output and VO₂ are weight-indexed and the sliders reach neonatal values: a 3 kg neonate on roughly 0.2 L/min of circuit flow against a cardiac output near 0.6 L/min can be entered, but the 5–6 L/min cannula ceiling, the 80–90% SaO₂ band and the 60%-of-CO flow anchor must not be carried onto a child. No weight-indexed flow target is sourced in this tool.</li>
                  <li><strong>Typed values are never rewritten in silence.</strong> A value is applied after a short pause or when you leave the field, so a number such as 12.5 never passes through 1 or 12 on its way in. A value outside the range is held, and on leaving the field it moves to the nearest allowed value with a message under the field. The box always shows the value the model is using, and a message clears when something else changes the value.</li>
                  <li><strong>Plausibility guards and the status label.</strong> A note appears, and the status cannot read as reassuring, when an entered or solved cardiac output exceeds 12 L/min or 400 mL/kg/min (whichever is lower), when circuit flow exceeds 300 mL/kg/min, or when the solved native flow is under 15% of the cardiac output. These numbers are heuristics of this tool, set to catch a wrong weight or unit; none is a published cut-point. In "The patient's SaO₂" mode a low DO₂:VO₂ is labelled a lower bound, because the solved cardiac output is one.</li>
                  <li><strong>Two assumptions move the answer and cannot be measured here.</strong> The VO₂ index and the recirculation fraction are defaults. The panel under the result shows how far the answer runs across a VO₂ index of ±33% and recirculation of 0–20%. The optional circuit saturation check estimates VO₂ from the oxygen added across the membrane; it is approximate and is shown beside the assumption, not in place of it.</li>
                </ul>
              </div>

              <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

                  <li>Bartlett RH. <em>Physiology of Extracorporeal Gas Exchange.</em> Compr Physiol 2020;10(3):879–891. PMID 32941687. DOI 10.1002/cphy.c190006. <span className="text-slate-500">Source of the mixing model implemented here; the article is paywalled, so no figure number is cited.</span></li>
                  <li>Bartlett RH. <em>Physiology of Gas Exchange During ECMO for Respiratory Failure.</em> J Intensive Care Med 2017;32(4):243–248. PMID 27040797. DOI 10.1177/0885066616641383.</li>
                  <li>Schmidt M, Tachon G, Devilliers C, et al. <em>Blood oxygenation and decarboxylation determinants during venovenous ECMO for respiratory failure in adults.</em> Intensive Care Med 2013;39(5):838–846. PMID 23291732. DOI 10.1007/s00134-012-2785-8.</li>

                  <li>Abrams D, Bacchetta M, Brodie D. <em>Recirculation in venovenous extracorporeal membrane oxygenation.</em> ASAIO J 2015;61(2):115–121. PMID 25423117. DOI 10.1097/MAT.0000000000000179.</li>
                  <li>Palmér O, Palmér K, Hultman J, Broman M. <em>Cannula Design and Recirculation During Venovenous Extracorporeal Membrane Oxygenation.</em> ASAIO J 2016;62(6):737–742. PMID 27660904. PMC5098462. DOI 10.1097/MAT.0000000000000440.</li>

                  <li>Tomarchio E, Momigliano F, Giosa L, Collins PD, Barrett NA, Camporota L. <em>The intricate physiology of veno-venous extracorporeal membrane oxygenation: an overview for clinicians.</em> Perfusion 2024;39(1_suppl):49S–65S. PMID 38654449. DOI 10.1177/02676591241238156.</li>

                <h3 className="text-[12px] font-semibold text-slate-900 mt-4 mb-2">Added at the 2026-08-31 evidence refresh</h3>
                <ol start="12" className="text-[11px] text-slate-700 space-y-1.5 list-decimal pl-5 leading-snug">
                  <li>Fisser C, et al. <em>Recirculation in single lumen cannula venovenous extracorporeal membrane oxygenation: a non-randomized bi-centric trial.</em> Front Med (Lausanne) 2022. PMID 36117961. DOI 10.3389/fmed.2022.973240. <span className="text-slate-500">Source of the femoro-jugular recirculation figure and of Q_eff = Q × (1 − R). Erratum on record: Front Med (Lausanne) 2022;9:1045207, PMID 36267622. Link only, text not read; this page makes no claim about what it changed: consult it before relying on the recirculation figures cited in the Recirculation field.</span></li>

                  <li>Behnel N, et al. <em>The Role of Recirculation-Guided Blood Flow Adjustment in Venovenous Extracorporeal Membrane Oxygenation: A Pilot Study.</em> ASAIO J 2026. PMID 42490650. DOI 10.1097/MAT.0000000000002796.</li>
                  <li>Guevara-Chaux J, et al. <em>Effects of Inadvertent Left Atrial Return During Venovenous ECMO: The Veno-Left Atrial Case Series.</em> ASAIO J 2026;72(3):e42–e48. PMID 40985532. DOI 10.1097/MAT.0000000000002562.</li>
                  <li>Burrell A, et al. <em>Conservative or liberal oxygen targets in patients on venoarterial ECMO (BLENDER).</em> Intensive Care Med 2024;50(9):1470–1483. PMID 39162827. DOI 10.1007/s00134-024-07564-8. <span className="text-slate-500">Erratum on record: Intensive Care Med 2024;50(12):2241–2242, PMID 39412548. Link only, text not read; this page makes no claim about what it changed: consult it before relying on the BLENDER result cited in Key caveats.</span></li>
                  <li>Zeng M, et al. <em>Association between hyperoxia and mortality in patients undergoing ECMO: a systematic review and meta-analysis.</em> J Crit Care 2026;91:155338 (epub 2025). PMID 41237735. DOI 10.1016/j.jcrc.2025.155338.</li>

                <p className="text-[12px] text-slate-500 mt-3 leading-snug">Retraction and expression-of-concern screen run 2026-08-31 across every entry above: none found. <strong>Correction screening, re-run 2026-09-01.</strong> The earlier pass screened publication types only, which cannot see an erratum published as its own record (the usual case). The screen was therefore re-run as an erratum-linkage screen: the CommentsCorrections field of every PMID printed in this tool, fetched from PubMed E-utilities and parsed for ErratumIn, RetractionIn, ExpressionOfConcernIn and CorrectedandRepublishedIn. The same screen by the same method was run over all eleven tools in this set. On this page 18 of 18 source PMIDs were screened, and two carry an erratum: PMID 36117961 (Fisser 2022) and PMID 39162827 (BLENDER), with no retraction and no expression of concern anywhere. What the screen returns is the linkage and not the correction: neither erratum was retrieved, so this page reports that each exists and that a reader should consult it, and asserts nothing about what either one changed. Both are marked on their reference-list row above and at their point of use: the recirculation-fraction field and the oxygen-target caveat bullet. Where a number in this tool has no published source it is labelled in place as a teaching convention or a display heuristic rather than removed.</p>

<script>
/* neel-theme v1.0 — shared Light | Dark control. One key ("neel.theme") for every tool on the
   github.io origin; reads the tool's legacy key once (data-nt-legacy on <html>). data-theme stays
   unset until the reader chooses, so OS changes apply until then. Public API:
   window.NeelTheme.get() -> 'light'|'dark' (effective), .set('light'|'dark'), and a
   'neeltheme' event on document ({detail:{theme}}) for tools that repaint charts. */
(function(){
  var KEY = 'neel.theme', root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function stored(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
  function effective(){
    var t = root.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return mq && mq.matches ? 'dark' : 'light';
  }
  var btns = [];
  function sync(){
    var t = effective();
    btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-nt') === t)); });
    try { document.dispatchEvent(new CustomEvent('neeltheme', { detail: { theme: t } })); } catch(e){}
  }
  function set(t){
    if (t !== 'light' && t !== 'dark') return;
    root.setAttribute('data-theme', t);
    try { localStorage.setItem(KEY, t); } catch(e){ /* private mode: session-only */ }
    sync();
  }
  window.NeelTheme = { get: effective, set: set };
  function mount(){
    if (document.querySelector('.nt-switch')) return;
    var wrap = document.createElement('div');
    wrap.className = 'nt-switch'; wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Colour theme');
    ['light', 'dark'].forEach(function(t){
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-nt', t); b.textContent = t === 'light' ? 'Light' : 'Dark';
      b.addEventListener('click', function(){ set(t); });
      wrap.appendChild(b); btns.push(b);
    });
    document.body.insertBefore(wrap, document.body.firstChild);
    sync();
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', function(){ if (!stored()) sync(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
