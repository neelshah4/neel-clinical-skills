function Narrative({ clickRef }) {
  const C = (ids) => <Cite ids={ids} clickRef={clickRef} />;
  return (
    <div className="card" style={{ marginTop: 20 }}>
      <h2 id="narrative-h">Important findings &amp; considerations</h2>
      <div className="narrative">
        <p>NLR carries the most consistent diagnostic and prognostic weight available from a single CBC. Zahorec introduced the ratio in 2001 as a “neutrophil-lymphocyte stress factor” in 90 oncological ICU patients, but that paper reports only relative neutrophil and lymphocyte percentages and proposes no numeric range{C([6])}; the interpretive bands come from his 2021 review, and this tool cites them there rather than to the original. The normal range sits at 1–2, the grey zone at 2.3–3.0, and values above 3.0 or below 0.7 are pathological in adults{C([19])}; healthy-population reference intervals are wider still, 0.78–3.53 in 413 adults{C([20])} and 0.89–3.26 in men and 0.87–3.16 in women across 29,947{C([21])}. At 7.97 the ratio meets the sepsis-diagnosis cut-point derived outside the ICU: sens 64.3%, spec 80.2%, AUC 0.74, which work out to a positive likelihood ratio of about 3.2 and a negative of about 0.45 — calculated here from those two figures, and the pair that actually transports to another population. The paper's PPV of 86.5% does not travel with them, because it belongs to that cohort's prevalence: 251 of 377 patients were septic, roughly 66.6%. Carry the same sensitivity and specificity to a 25% pre-test probability and the post-test figure drops to about 52%. NPV 53.2% is the other half of the same lesson — a value below the cut-point clears nobody{C([4])}. At 12.65 it meets the bacteremia cut-point of Russell 2019, where a patient-level meta-analysis of five studies (n = 3,320) gave AUC 0.72. Ten studies reported the association qualitatively; only those five contributed patient-level data to the pooled AUC and to the cut-point itself{C([2])}. Scale the enthusiasm to match: pooled across 21 studies and 23,621 patients, high versus low NLR carries OR 1.11 (95% CI 1.08–1.14) for sepsis mortality{C([29])}.</p>

        <p>The Hwang J-curve matters at both ends. In 1,395 patients with severe sepsis or septic shock, persistently low NLR carried adjusted HR 2.25 (1.63–3.11) for 28-day mortality against 2.65 (1.64–4.29) for persistently high NLR, and the lowest quintile died most often, at 24.4%{C([3])}. A reassuringly low ratio in a hypoperfused patient is not reassurance; it is a flag for immunoparesis. Direction outperforms any single draw: across 30 studies and 26,441 critically ill patients, NLR was the leucocyte parameter that best separated survivors from non-survivors, running lower in survivors on days 0–1 (mean difference −0.29, 95% CI −0.45 to −0.12), days 2–4 (−1.02, −1.57 to −0.48) and days 5–7 (−0.69, −1.00 to −0.38){C([28])}. In 1,572 ED episodes of suspected sepsis the ratio reached AUC 0.68 (0.65–0.71) for bacterial sepsis by Sepsis-2 criteria — modest for a marker this widely quoted{C([1])}.</p>

        <p>Eosinopenia is the second high-signal feature, and the gap between its optimistic and its pooled estimates is the lesson. Abidi 2008 reported sens 80%, spec 91%, +LR 9.12 and AUC 0.89 at AEC &lt;50 cells/µL in 177 medical ICU admissions; at the &lt;40 cut-point that separates SIRS from infection, specificity fell to 80% with a 55–93% confidence interval wide enough to swallow the claim{C([13])}. Pooling seven studies and 3,842 subjects gives SROC AUC 0.73 (0.68–0.76), sens 0.66, spec 0.68 and +LR 2.09 (1.44–3.02){C([16])}, and the largest prospective series — 770 ED patients across five centres, 422 infected — puts ≤10/mm³ at spec 88%, sens 48%, AUC 0.75, level with neutrophils (0.74) and leukocytes (0.72) and behind CRP (0.89){C([25])}. Treat 9.12 as a single-centre ceiling and roughly 2–4 as the expectation, and use eosinopenia to rule in rather than to rule out. Sustained eosinophils below 0.0454 ×10³/µL carried HR 4.20 (2.66–6.62) for mortality across 2,311 first bacteremia episodes{C([15])}, although standalone prognostic discrimination stays poor: AUC 0.562 in 496 ICU patients with severe CAP, even though eosinopenia there was independently associated with 30-day mortality at HR 1.95 (1.19–3.20){C([27])}. Steroids blunt the diagnostic signal without erasing the prognostic one — a count ≤30/µL predicted mechanical ventilation in CAP regardless of glucocorticoid treatment (RR 2.12, 1.61–2.80){C([26])}.</p>

        <p>Bandemia is informative even when the total WBC looks normal. In 2,342 admissions with a normal count, ≥20% bands carried adjusted OR 6.2 (3.2–11.8) for positive blood cultures and 2.8 (1.7–4.3) for any significant positive culture, while 11–19% carried 3.8 (2.0–7.2); that study treated ≤10% bands as its normal reference group, which is why this tool starts bandemia at 11% rather than 10%{C([7])}. An independent 970-patient cohort supports the same direction at a &gt;10% threshold, adjusted OR 6.13 (4.02–9.40), sens 0.42, spec 0.91{C([23])}. The counting is the weak link. Among CAP proficiency-testing participants the coefficient of variation for a 100-cell manual band count was 55.8%, and 32.9% among the CAP Hematology and Clinical Microscopy Committee itself; grouping bands with segmented neutrophils drops those to 6.2% and 5.0%. Grouping, not abandonment, is what the Committee actually recommends, and 86.4% of laboratories performing manual differentials still break bands out separately (4,554 of 5,268), while only 73.0% of respondents supplied a band reference range at all (3,222 of 4,412){C([8])}. Automated extended-differential parameters are a separate question: in 68 evaluable samples, NE-SFL was the strongest discriminator for bacteremia overall (AUC &gt;0.8), with IG% best only in the HIV-negative subgroup (AUC 0.9){C([9])}. Read band percent as a directional cue, never an adjudication.</p>

        <p>Persistent lymphopenia speaks to prognosis more than to diagnosis, and no single threshold spans both age groups. In children the anchor is ALC &lt;1,000 cells/µL on two days between study days 0–5, adjusted OR 2.98 (1.85–4.02) for prolonged MODS or death among 401 with severe sepsis{C([10])}. In adults, day-4 ALC modelled continuously in 335 bacteremic patients gave adjusted OR 0.68 per unit for 28-day survival and 0.74 for 1-year survival, with severe persistent lymphopenia set at ≤0.6 ×10⁹/L{C([11])}. Roughly 0.6 to 1.0 depending on cohort and day is the honest statement. Trajectory carries the risk: among 1,640 septic patients with initial lymphopenia, the persistent-low group (n = 544, 33.2%) had the lowest 7- and 28-day survival, and after adjustment remained associated with 28-day mortality (aHR 1.76, 1.27–2.45) though no longer with 7-day{C([32])}. Profound lymphopenia with a near-normal WBC remains the viral-pneumonia signature. Correcting the count is not correcting the outcome: recombinant IL-7 raises ALC in sepsis (mean difference 1.33 at 3 weeks across four RCTs) without reducing mortality (RR 1.01, 0.36–2.81) or secondary infection (RR 1.05, 0.48–2.30){C([12, 30])}, and the intravenous-route trial stopped early after 3 of 15 patients developed fever and respiratory distress 5–8 h after dosing{C([31])}.</p>

        <p>Platelet trajectory beats any single value, and timing separates from depth. In 363 ED sepsis episodes the nadir gave a dose-response for 28-day mortality (50–99 ×10⁹/L adjusted HR 2.04; 20–49, 2.98; &lt;20, 3.46) and the magnitude of decline an independent one (30–50%, 1.79; &gt;50%, 2.43). An intermediate or late nadir carried adjusted HR 4.39–7.28 and 5.85–9.58 respectively, while an initial or early nadir carried no significant association{C([24])}. A later nadir is therefore the adverse one, and a fall past 50% in sepsis demands ISTH DIC scoring. The total white count itself discriminates poorly: across 25,776 hospitalised patients with a differential and a blood culture, AUROC was 0.58 for WBC, 0.63 for ANC and 0.74 for neutrophil percentage, so the percentage beats both absolute counts and the interval likelihood ratios beat any single threshold{C([22])}. SIRS misses about 12% of severe sepsis outright — 13,278 of 109,663 ICU patients with infection and organ failure were SIRS-negative{C([18])}. Steroids, G-CSF, chemotherapy, asplenia, pregnancy and a recent seizure each move the baseline; use the toggles.</p>

        <p>One framing caveat outranks every number above. Sepsis-3 rests on the 1996 SOFA score{C([17])}, and its 2025 successor could not build an immune subscore at all: developing SOFA-2 took 60 experts across 65 countries and validation in 3.34 million patients over 10 databases, and the task force reported that scores for the gastrointestinal and immune systems could not be developed for insufficient data, complexity, or lack of content and predictive validity{C([34])}. The six retained organ systems discriminate better than SOFA-1 — AUROC 0.746 versus 0.679 for in-hospital mortality in 24,510 patients with suspected infection{C([35])}, and 0.779 versus 0.755 for ICU mortality in 30,667 MIMIC-IV sepsis admissions{C([36])} — and none of that gain comes from the CBC. Pediatrics went further and dropped the white count from the definition entirely{C([37, 38])}. The CBC is a lens on the host response, not an adjudicator of sepsis; every threshold on this page is an input to a bedside argument that lactate, perfusion, source and culture will settle.</p>
      </div>
    </div>
  );
}

function ReferencesList({ highlighted }) {
  return (
    <div className="card" style={{ marginTop: 20 }}>
      <h2 id="refs-h">References</h2>
      <div className="ref-note">
        <strong>Verification status — 2026-08-31.</strong> Thirteen of the forty references below were re-resolved against their PubMed records during this revision, and the figures this tool quotes from them were read back against the source abstract: Hwang 2017 [3], Spoto 2021 [4], Xin 2022 [5], Drees 2012 [7], Vergara-Lluri 2024 [8], Podd 2023 [10], Abidi 2008 [13], Zahorec 2021 [19], Lavoignet 2026 [25], Cilloniz 2026 [27], Lu 2026 [30], Ma 2026 [32] and Hyde 2025 [39]. Zahorec [19] is listed first among equals because his 1–2 normal range, 2.3–3.0 grey zone and &gt;3.0 / &lt;0.7 pathological limits set every NLR band, colour and label on this page. The remaining twenty-seven references were <em>not</em> re-checked in this revision — treat the figures quoted from them as carried forward rather than re-verified. Numbers on this page that carry no citation are labelled as conventions or approximations where they appear: the ANC 500 and 100 thresholds, the WBC and platelet display bands, the ALC 400 boundary, the 5–10% left-shift band, and the asplenia and pregnancy baselines. This tool makes no blanket claim that every identifier below has been resolved.
      </div>
      <ol className="refs">
        {REFERENCES.map((r) => (
          <li key={r.id} id={`ref-${r.id}`} className={highlighted === r.id ? "target" : ""}>
            {r.text} <em>{r.cite}</em>{r.pmid && (<> PMID <a href={`https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/`} target="_blank" rel="noopener">{r.pmid}</a>.</>)}
            {r.doi && (<> DOI <a href={`https://doi.org/${r.doi}`} target="_blank" rel="noopener">{r.doi}</a>.</>)}
            {r.url && (<> <a href={r.url} target="_blank" rel="noopener">{r.url}</a></>)}
          </li>
        ))}
      </ol>
    </div>
  );
}
