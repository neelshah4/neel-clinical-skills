<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ICU CBC Interpreter — sepsis / infection lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500&display=swap" />
<script crossorigin="anonymous"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
        src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin="anonymous"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
        src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous"
        integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva"
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  /* ============================================================
     Theme tokens — paper / paper-dark, warm-black ink, one warm-slate
     accent. Inter (UI) · Source Serif 4 (body) · JetBrains Mono (inputs)
     ============================================================ */
  :root,
  :root[data-theme="dark"] {
    --bg:           #14120F;          /* paper-dark warm */
    --surface:      #1B1814;          /* tint × 0.6 on paper-dark */
    --surface-2:    #221E18;
    --line:         #2A2620;          /* hairline */
    --line-soft:    #221E18;
    --ink:          #F5F0E6;          /* ink-dark warm */
    --ink-soft:     #C5BEB0;
    --ink-mute:     #8A847A;
    --accent:       #6E7A8F;          /* warm slate, slightly lifted on dark */
    --accent-deep:  #4A5468;
    --accent-soft:  rgba(110,122,143,0.16);
    --calm:         #6FAA8A;          /* warm pos on dark */
    --caution:      #D3A655;          /* warm gold on dark */
    --concern:      #C77A48;          /* warm amber */
    --critical:     #C95E5E;          /* warm neg on dark */
    --neutral:      #6F6963;
    --calm-bg:      rgba(111,170,138,0.10);
    --caution-bg:   rgba(211,166,85,0.10);
    --concern-bg:   rgba(199,122,72,0.10);
    --critical-bg:  rgba(201,94,94,0.12);
    --signature:    #F5F0E6;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg:           #FAF6EE;          /* paper warm — not pure white */
    --surface:      #FFFFFF;          /* paper-quiet */
    --surface-2:    #F1ECDF;          /* tint */
    --line:         #D9D2C0;
    --line-soft:    #E7E1CF;
    --ink:          #1A1A1A;          /* warm black */
    --ink-soft:     #4A4540;
    --ink-mute:     #7A746E;
    --accent:       #4A5468;          /* warm slate */
    --accent-deep:  #2F3744;
    --accent-soft:  rgba(74,84,104,0.10);
    --calm:         #2E7D5B;
    --caution:      #B88A2C;
    --concern:      #B5662A;
    --critical:     #B23A3A;
    --neutral:      #6A6660;
    --calm-bg:      rgba(46,125,91,0.08);
    --caution-bg:   rgba(184,138,44,0.10);
    --concern-bg:   rgba(181,102,42,0.10);
    --critical-bg:  rgba(178,58,58,0.10);
    --signature:    #1A1A1A;
    color-scheme: light;
  }

  /* Auto match system if user hasn't toggled (data-theme absent) */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg:#FAF6EE; --surface:#FFFFFF; --surface-2:#F1ECDF;
      --line:#D9D2C0; --line-soft:#E7E1CF;
      --ink:#1A1A1A; --ink-soft:#4A4540; --ink-mute:#7A746E;
      --accent:#4A5468; --accent-deep:#2F3744; --accent-soft:rgba(74,84,104,0.10);
      --calm:#2E7D5B; --caution:#B88A2C; --concern:#B5662A; --critical:#B23A3A;
      --calm-bg:rgba(46,125,91,0.08); --caution-bg:rgba(184,138,44,0.10);
      --concern-bg:rgba(181,102,42,0.10); --critical-bg:rgba(178,58,58,0.10);
      --signature:#1A1A1A;
      color-scheme: light;
    }
  }

  :root {
    --radius:    8px;     /* small radii only */
    --radius-sm: 4px;
    /* No shadows. No gradients. Hairlines only. */
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    transition: background-color 200ms ease-out, color 200ms ease-out;
  }
  body {
    font-family: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "lnum" 1;  /* tabular figures — non-negotiable for data work */
  }
  /* Display + UI surfaces use Inter; body keeps Source Serif 4 */
  .display, .top h1, .pattern-label, .card h2, .narrative {
    font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  }
  .ui, button, input, label, .label, .ev-state, .pattern-sev, .seg button,
  .case-card .ctitle, .case-card .csub, .toggle, .top .sub, .top .right,
  .chip .label, .input-row label, .footer, .pill, .peds-note, .ev-finding,
  .ev-num, .ev-caveat, .ev-claim {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* All numerics across UI: tabular figures */
  .val, .ev-num, .input-row input, .case-card, .chip, .ev-finding {
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .shell { max-width: 1320px; margin: 0 auto; padding: 24px 28px 64px; }

  /* Header — signature top-label card (overline → 0.5pt rule → serif body) */
  .top {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
    align-items: end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .top .overline {
    font-family: "Inter", sans-serif;
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--ink-mute);
    margin-bottom: 8px;
    display: block;
  }
  .top .hairline {
    height: 0.5px;
    background: var(--accent);
    margin: 6px 0 10px;
    max-width: 64px;
  }
  .top h1 {
    font-weight: 500; font-size: 28px; margin: 0;
    letter-spacing: -0.012em;
    line-height: 1.1;
    color: var(--ink);
  }
  .top .sub {
    color: var(--ink-soft); font-size: 13px;
    margin-top: 6px;
    font-style: italic;
  }
  .top .right {
    color: var(--ink-mute); font-size: 11.5px;
    text-align: right;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .theme-toggle {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 6px 11px;
    font-size: 11.5px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color 200ms ease-out, color 200ms ease-out;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--ink); }
  .theme-toggle .glyph {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  :root[data-theme="light"] .theme-toggle .glyph,
  :root:not([data-theme]) .theme-toggle .glyph {
    background: var(--ink);
  }
  .disclaimer {
    font-size: 10.5px; color: var(--ink-mute);
    max-width: 220px;
    line-height: 1.45;
  }

  /* Sticky derived-metric ribbon — asymmetric weights
     60% NLR hero (left) · 30% six small chips (middle) · 10% verdict tile (right) */
  .ribbon {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1.6fr 3.2fr 1.4fr;
    gap: 14px;
    align-items: stretch;
    margin-bottom: 20px;
  }
  .ribbon .nlr-hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .ribbon .nlr-hero[data-sev="calm"]     { border-left-color: var(--calm); }
  .ribbon .nlr-hero[data-sev="caution"]  { border-left-color: var(--caution); }
  .ribbon .nlr-hero[data-sev="concern"]  { border-left-color: var(--concern); }
  .ribbon .nlr-hero[data-sev="critical"] { border-left-color: var(--critical); }
  .ribbon .nlr-hero .label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-mute); margin-bottom: 4px;
  }
  .ribbon .nlr-hero .hero-val {
    font-family: "Inter", sans-serif;
    font-weight: 600; font-size: 44px;
    color: var(--ink); line-height: 1;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .ribbon .nlr-hero .hero-sub {
    font-size: 11px; color: var(--ink-soft); margin-top: 6px;
    font-style: italic;
    font-family: "Source Serif 4", Georgia, serif;
  }
  .ribbon .chip-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .chip {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color 200ms ease-out;
    display: flex; flex-direction: column; justify-content: center;
  }
  .chip:hover { border-color: var(--accent); }
  .chip .label {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--ink-mute);
    display: flex; align-items: center;
  }
  .chip .val {
    font-weight: 600; font-size: 17px; color: var(--ink);
    display: flex; align-items: baseline; gap: 5px;
    margin-top: 2px;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .chip .val .unit { font-size: 10px; color: var(--ink-mute); font-weight: 400; letter-spacing: 0; }
  .chip .severity-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--neutral); margin-right: 5px;
  }
  .chip[data-sev="calm"]     .severity-dot { background: var(--calm); }
  .chip[data-sev="caution"]  .severity-dot { background: var(--caution); }
  .chip[data-sev="concern"]  .severity-dot { background: var(--concern); }
  .chip[data-sev="critical"] .severity-dot { background: var(--critical); }
  .verdict-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 2px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .verdict-tile[data-sev="calm"]     { border-top-color: var(--calm); }
  .verdict-tile[data-sev="caution"]  { border-top-color: var(--caution); }
  .verdict-tile[data-sev="concern"]  { border-top-color: var(--concern); }
  .verdict-tile[data-sev="critical"] { border-top-color: var(--critical); }
  .verdict-tile .label {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-mute); margin-bottom: 4px;
    font-family: "Inter", sans-serif;
  }
  .verdict-tile .verdict-text {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 13px; line-height: 1.3;
    color: var(--ink);
    font-style: italic;
  }

  /* Main grid */
  .main { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }

  /* Cards — hairline-only, no shadows */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .card h2 {
    font-weight: 500; font-size: 17px; margin: 0 0 14px;
    color: var(--ink);
    border-bottom: 0.5px solid var(--line); padding-bottom: 10px;
    letter-spacing: -0.005em;
  }
  .card h3 {
    font-family: "Inter", sans-serif;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-mute); margin: 16px 0 8px; font-weight: 600;
  }

  /* Input panel */
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .input-row { display: flex; flex-direction: column; gap: 5px; }
  .input-row label {
    font-size: 10.5px; color: var(--ink-mute);
    text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 600;
  }
  .input-row input {
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    font-feature-settings: "tnum" 1, "lnum" 1;
    transition: border-color 200ms ease-out;
  }
  .input-row input:hover { border-color: var(--accent); }
  .input-row .hint {
    font-size: 10.5px; color: var(--ink-mute); font-style: italic;
  }
  .seg {
    display: flex; gap: 0; background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    margin-top: 8px; overflow: hidden;
  }
  .seg button {
    flex: 1; background: transparent; color: var(--ink-soft);
    border: none; padding: 7px 10px; font-size: 11.5px; cursor: pointer;
    font-weight: 600;
    transition: background-color 200ms ease-out;
    letter-spacing: 0.04em;
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft); color: var(--ink);
  }
  .seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }

  /* Confounder toggle chips */
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggle {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11.5px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: border-color 200ms ease-out, background-color 200ms ease-out, color 200ms ease-out;
  }
  .toggle:hover { border-color: var(--accent); color: var(--ink); }
  .toggle[aria-pressed="true"] {
    background: var(--caution-bg);
    border-color: var(--caution);
    color: var(--ink);
    font-weight: 500;
  }

  /* Actions */
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 11.5px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: border-color 200ms ease-out, background-color 200ms ease-out;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .btn.primary { background: var(--accent-soft); border-color: var(--accent); }

  /* Interpretation panel — serif display, asymmetric weight */
  .pattern-label {
    font-size: 22px; font-weight: 500;
    color: var(--ink); margin: 0 0 8px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .pattern-sub {
    color: var(--ink-soft); font-size: 13.5px;
    margin-bottom: 14px; line-height: 1.55;
    font-family: "Source Serif 4", Georgia, serif;
  }
  .pattern-sev {
    display: inline-block; font-size: 10px;
    padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700;
    margin-bottom: 14px;
    border: 1px solid currentColor;
  }
  .pattern-sev[data-sev="calm"]     { color: var(--calm); }
  .pattern-sev[data-sev="caution"]  { color: var(--caution); }
  .pattern-sev[data-sev="concern"]  { color: var(--concern); }
  .pattern-sev[data-sev="critical"] { color: var(--critical); }

  .ev-row {
    border-top: 0.5px solid var(--line);
    padding: 14px 0;
  }
  .ev-row:last-of-type { border-bottom: 0.5px solid var(--line); }
  .ev-finding {
    font-weight: 600; font-size: 13.5px; color: var(--ink);
    display: flex; justify-content: space-between; gap: 10px;
    align-items: baseline;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .ev-finding .ev-state {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em;
    padding: 3px 8px; border-radius: 3px; font-weight: 700;
    flex-shrink: 0;
    border: 0.5px solid currentColor;
    background: transparent;
  }
  .ev-state[data-sev="calm"]     { color: var(--calm); background: var(--calm-bg); }
  .ev-state[data-sev="caution"]  { color: var(--caution); background: var(--caution-bg); }
  .ev-state[data-sev="concern"]  { color: var(--concern); background: var(--concern-bg); }
  .ev-state[data-sev="critical"] { color: var(--critical); background: var(--critical-bg); }
  .ev-claim {
    color: var(--ink); font-size: 13px; margin: 6px 0 4px;
    line-height: 1.55;
  }
  .ev-num {
    font-size: 12px; color: var(--ink-soft);
    line-height: 1.5;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .ev-num strong {
    color: var(--ink-mute); font-weight: 600;
    font-family: "Inter", sans-serif;
    text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 10px;
    margin-right: 4px;
  }
  .ev-caveat {
    font-size: 11.5px; color: var(--ink-mute); font-style: italic;
    margin-top: 6px; line-height: 1.5;
  }
  sup.cite {
    font-size: 10px;
    color: var(--accent);
    cursor: pointer;
    padding-left: 1px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
  }
  sup.cite:hover { text-decoration: underline; }

  /* Warning cards — hairline left rule, restraint */
  .warn {
    background: transparent;
    border: 0.5px solid var(--caution);
    border-left: 3px solid var(--caution);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    margin: 12px 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .warn[data-sev="caution"]  { border-color: var(--caution);  border-left-color: var(--caution); }
  .warn[data-sev="critical"] { border-color: var(--critical); border-left-color: var(--critical); }
  .warn .head {
    font-family: "Inter", sans-serif;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 10.5px; margin-bottom: 5px;
  }
  .warn[data-sev="caution"]  .head { color: var(--caution); }
  .warn[data-sev="critical"] .head { color: var(--critical); }

  /* Narrative panel — Source Serif 4 editorial */
  .narrative {
    font-size: 15px; line-height: 1.68; color: var(--ink);
    max-width: 64ch;
  }
  .narrative p { margin: 0 0 14px; }
  .narrative p:last-child { margin-bottom: 0; }
  .narrative em { font-style: italic; color: var(--ink); }

  /* Cases shelf — case cards in restrained bento */
  .shelf {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-top: 18px;
  }
  .case-card {
    background: var(--surface);
    border: 0.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    transition: border-color 200ms ease-out;
  }
  .case-card:hover { border-color: var(--accent); }
  .case-card .ctitle {
    font-weight: 600; font-size: 12.5px; margin-bottom: 4px;
    line-height: 1.3;
    color: var(--ink);
  }
  .case-card .csub {
    color: var(--ink-mute); font-size: 11.5px; line-height: 1.45;
    font-family: "Source Serif 4", Georgia, serif;
    font-style: italic;
  }

  /* References — numbered Vancouver-style */
  .refs { list-style: none; padding: 0; margin: 0; counter-reset: r; }
  .refs li {
    counter-increment: r;
    padding: 10px 4px 10px 36px;
    position: relative;
    border-bottom: 0.5px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.55;
    transition: background-color 200ms ease-out;
  }
  .refs li::before {
    content: counter(r) ".";
    position: absolute; left: 6px; top: 10px;
    color: var(--ink-mute);
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .refs li.target {
    background: var(--accent-soft);
    border-radius: var(--radius-sm);
    padding-left: 38px; padding-right: 10px;
  }
  .refs em { color: var(--ink-mute); font-style: italic; }
  .refs a { color: var(--accent); }

  /* Footer */
  .footer {

// ============== DERIVED METRICS + INTERPRETATION ENGINE ==============
// A cleared field is missing, not zero. Coercing "" to 0 is what previously
// painted an empty platelet box "critical" while its evidence row printed
// nothing at all.
const numOrNull = (v) => {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
};
const fmt = (v, dp) => (v == null ? "—" : v.toFixed(dp));

// Input bounds. Percentages are bounded 0–100; counts are bounded below at 0.
// The upper bounds are generous instrument ceilings — interface guards against
// a typo silently driving the engine, not clinical limits.
const FIELD_SPEC = {
  wbc:      { min: 0, max: 500 },
  plt:      { min: 0, max: 3000 },
  neutPct:  { min: 0, max: 100 },
  lymphPct: { min: 0, max: 100 },
  monoPct:  { min: 0, max: 100 },
  eosPct:   { min: 0, max: 100 },
  basoPct:  { min: 0, max: 100 },
  bandPct:  { min: 0, max: 100 },
};

// The differential-mode switch is load-bearing, not a label change.
//   manual — the last field is a band percentage from a 100-cell manual
//            differential. Bands sit inside the 100 and inside the ANC, and
//            Drees 2012's 11% / 20% odds ratios were derived on exactly that
//            measurement [7].
//   auto   — the last field is an analyser immature-granulocyte percentage.
//            It is reported alongside NEUT% rather than inside the 100-cell
//            count, and on analysers that already fold IG into NEUT% adding
//            it again double-counts, so it is kept out of the ANC. No
//            IG%-specific diagnostic cut-point is carried in this tool, so
//            the Drees band thresholds are NOT applied to it.
function derive(cbc, mode) {
  const isManual = mode === "manual";
  const wbcVal = numOrNull(cbc.wbc);
  const wbc = wbcVal == null ? 0 : wbcVal;
  const has = wbcVal != null;
  const pct = (k) => { const n = numOrNull(cbc[k]); return n == null ? 0 : n; };
  const abs = (k) => (wbc * pct(k)) / 100;
  const leftShiftPct = pct("bandPct");             // raw value of the last field
  const bandPct = isManual ? leftShiftPct : null;  // manual 100-cell band %
  const igPct   = isManual ? null : leftShiftPct;  // analyser IG %
  const abc = has && isManual ? abs("bandPct") : null;
  const anc = has ? abs("neutPct") + (isManual ? abs("bandPct") : 0) : null;
  const alc = has ? abs("lymphPct") : null;
  const amc = has ? abs("monoPct") : null;
  const aec = has ? abs("eosPct") : null;
  const nlr  = (anc != null && alc != null && alc > 0) ? (anc / alc) : null;
  const dNlr = (anc != null && alc != null && alc > 0) ? (anc / Math.max(wbc - anc, 0.1)) : null; // approx
  return { wbc: wbcVal, anc, alc, amc, aec, abc, nlr, dNlr, igPct, bandPct, leftShiftPct, isManual, mode };
}

// Differential audit. In manual mode bands sit inside the 100-cell count; in
// auto mode IG% is reported alongside NEUT% and is excluded from the sum.
// Every absolute on this page is WBC × percent, so a differential that does
// not close produces a confidently wrong ANC, ALC and AEC with no other sign.
function diffAudit(cbc, mode) {
  const keys = mode === "manual"
    ? ["neutPct", "bandPct", "lymphPct", "monoPct", "eosPct", "basoPct"]
    : ["neutPct", "lymphPct", "monoPct", "eosPct", "basoPct"];
  const missing = [];
  let sum = 0;
  keys.forEach((k) => {
    const n = numOrNull(cbc[k]);
    if (n == null) missing.push(k); else sum += n;
  });
  const blank = Object.keys(FIELD_SPEC).filter((k) => numOrNull(cbc[k]) == null);
  const outOfRange = Object.keys(FIELD_SPEC).filter((k) => {
    const n = numOrNull(cbc[k]);
    return n != null && (n < FIELD_SPEC[k].min || n > FIELD_SPEC[k].max);
  });
  return {
    sum,
    blank,
    outOfRange,
    sumOff: missing.length === 0 && Math.abs(sum - 100) > 0.5,
  };
}

// NLR display bands. Every boundary is a published number, not a house scheme:
//   0.7   — Zahorec 2021 LOW pathological limit [19]
//   2.3 / 3.0 — Zahorec 2021 grey zone and upper pathological limit [19]
//   7.97  — Spoto 2021 sepsis-diagnosis cut-point [4]
//   12.65 — Russell 2019 bacteremia cut-point [2]
// Zahorec's band set was re-read against the source abstract on 2026-08-31:
// "A normal range of NLR is between 1-2, the values higher than 3.0 and below
// 0.7 in adults are pathological. NLR in a grey zone between 2.3-3.0 may serve
// as early warning of pathological state or process."
// The low limb is not decorative. This file devotes an evidence branch and a
// narrative paragraph to Hwang's J-curve, where the LOWEST NLR quintile
// carried the HIGHEST 28-day mortality [3] — so a sub-0.7 ratio must not
// render calm, and the tool's own case 2 (ANC 0.20 / ALC 0.40 = NLR 0.50)
// previously did exactly that. The grey zone is likewise coloured caution,
// matching the evidence row that calls it an early-warning band.
function nlrSeverity(nlr) {
  if (nlr == null)   return "neutral";
  if (nlr < 0.7)     return "concern";   // below Zahorec's low pathological limit
  if (nlr < 2.3)     return "calm";      // normal range 1–2 and its upper margin
  if (nlr < 7.97)    return "caution";   // grey zone 2.3–3.0, then above 3.0
  if (nlr < 12.65)   return "concern";
  return "critical";
}

// WBC and platelet display bands below are laboratory reporting conventions
// (SIRS uses >12 and <4; 20/50/100/450 ×10³/µL are transfusion- and
// consumption-threshold conventions). They are shown to colour the interface,
// not because any study cited here derived them.
function wbcSeverity(wbc) {
  if (wbc == null) return "neutral";
  if (wbc < 1)   return "critical";
  if (wbc < 4)   return "concern";
  if (wbc <= 12) return "calm";
  if (wbc <= 20) return "caution";
  return "concern";
}

function plateletSeverity(plt) {
  if (plt == null) return "neutral";
  if (plt < 20)  return "critical";
  if (plt < 50)  return "concern";
  if (plt < 100) return "caution";
  if (plt <= 450) return "calm";
  return "caution";
}

// ANC bands. <0.5 and <0.1 are the febrile-neutropenia thresholds in standard
// IDSA/ASCO neutropenic-fever guidance — consensus practice, not a figure taken
// from any study cited in this tool. The 7.7 upper bound is a laboratory
// reference convention and is likewise unsourced here.
function ancSeverity(anc) {
  if (anc == null) return "neutral";
  if (anc < 0.1) return "critical";
  if (anc < 0.5) return "critical";
  if (anc < 1.0) return "concern";
  if (anc < 7.7) return "calm";
  return "caution";
}

function alcSeverity(alc) {
  if (alc == null) return "neutral";
  if (alc < 0.4) return "critical";
  if (alc < 1.0) return "concern";
  return "calm";
}

// AEC bands. ONE eosinopenia boundary is used everywhere in this file: the
// severity colour, the evidence row and the pattern engine all read
// AEC_EOSINOPENIA, and the operating characteristics quoted alongside are the
// ones Abidi 2008 reported at that same cut-point [13]. Re-read against the
// source abstract 2026-08-31: eosinophils <50 cells/mm³ gave sens 80% (71–86),
// spec 91% (79–96), +LR 9.12 (3.9–21), −LR 0.21 (0.15–0.31), AUC 0.89 for
// non-infected versus infected.
// Earlier builds carried 0.04 in the severity function, 0.05 in the pattern
// engine, and Abidi's <50 statistics in the prose — so an AEC of 45 cells/µL
// read "within reference range, argues against bacterial sepsis" and "occult
// infection signature" on the same screen. One boundary, one statistic set.
// An analyser-reported 0 and an AEC of 30 cells/µL remain the same finding —
// no source grades exactly zero as worse.
const AEC_EOSINOPENIA = 0.05;   // ×10³/µL — i.e. <50 cells/µL
function aecSeverity(aec) {
  if (aec == null)  return "neutral";
  if (aec < AEC_EOSINOPENIA) return "concern";
  if (aec < 0.5)    return "calm";
  if (aec >= 1.5)   return "caution"; // eosinophilia
  return "calm";
}

// Pattern matching.
//
// corePattern() holds the CBC read. patternLabel() wraps it so that a
// confounder ANNOTATES the read instead of replacing it — the steroid branch
// used to sit above every infection branch and return sev "caution", which
// capped a shocked patient at gold because a toggle was on.
//
// Branch order is itself a clinical decision and is commented where it matters.
function corePattern(d, toggles) {
  const t = (k) => toggles.has(k);
  const plt = d.plt;

  if (d.wbc == null) return {
    label: "No WBC entered — nothing to interpret",
    sev: "neutral",
    sub: "Every absolute count on this page is WBC × percent. Enter a white cell count to run the pattern engine.",
  };

  // Chemo / neutropenic first
  if (t("chemo") && d.anc != null && d.anc < 0.5) return {
    label: "Neutropenic fever framework — CBC pattern uninterpretable",
    sub: "ANC <500. NLR and band-based scoring are not meaningful. Treat as febrile neutropenia until cultures resolve.",
    sev: "critical",
  };
  // This tool records no temperature, so it cannot assert febrile neutropenia
  // and must not direct empiric coverage on a neutrophil count alone.
  if (d.anc != null && d.anc < 0.5) return {
    label: "Severe neutropenia",
    sev: "critical",
    sub: "ANC <500 cells/µL. No temperature is entered anywhere in this tool, so it cannot establish febrile neutropenia: if fever is documented, the febrile-neutropenia framework and local empiric-coverage protocol apply. Severe neutropenia without fever has causes that do not call for empiric antibacterials — drug-induced agranulocytosis, marrow infiltration, sepsis-induced marrow suppression, and benign ethnic (Duffy-null) neutropenia, which is a baseline rather than a risk state. Establish the cause and the fever status before treating the number.",
  };

  // DIC sits ABOVE the NLR branches. A septic profile with thrombocytopenia is
  // the finding that changes the next order (PT/PTT, fibrinogen, D-dimer), and
  // the bandemia triple below would otherwise swallow it — the tool's own case
  // 6 fired the triple at NLR 19.0 and never surfaced the ISTH prompt. The old
  // alc < 1.0 conjunct was dropped rather than replaced with a new number: it
  // was unsourced, and it excluded case 6 at ALC 1.215 even after reordering.
  if (plt != null && plt < 100 && d.wbc > 12) return {
    label: "Septic profile with thrombocytopenia — consider DIC",
    sev: "critical",
    sub: "Trajectory matters more than the single value. Check PT/PTT, fibrinogen, D-dimer; calculate ISTH DIC score.",
  };

  // Bacterial-sepsis signature. 12.65 = Russell 2019 bacteremia cut-point;
  // AEC_EOSINOPENIA = Abidi <50 cells/µL; 11% = Drees 2012 bandemia, whose
  // normal reference group was ≤10% bands on a 100-cell MANUAL differential.
  // The band limb is therefore manual-mode only: an analyser IG% runs on a
  // different scale, and transporting Drees's odds ratios onto it made this
  // flagship pattern unreachable for every default-mode user while a genuinely
  // marked automated left shift scored calm.
  if (d.isManual && d.nlr != null && d.nlr >= 12.65 && d.aec != null && d.aec < AEC_EOSINOPENIA && d.bandPct >= 11) return {
    label: "Bandemic leukocytosis with eosinopenia — bacterial sepsis pattern",
    sev: "critical",
    sub: "Extreme NLR, marked left shift, and eosinopenia together are suggestive of bacterial sepsis. Source control, lactate-guided resuscitation, broad coverage pending cultures.",
  };
  // Auto-diff equivalent: the two limbs that ARE scale-independent still fire,
  // and the missing third limb is named rather than faked.
  if (!d.isManual && d.nlr != null && d.nlr >= 12.65 && d.aec != null && d.aec < AEC_EOSINOPENIA) return {
    label: "Extreme NLR with eosinopenia — bacterial sepsis pattern",
    sev: "critical",
    sub: "NLR above the 12.65 bacteremia cut-point together with eosinopenia below 50 cells/µL. The third limb of the signature is a manual band count: Drees's 11% and 20% thresholds were derived on a 100-cell manual differential and are not transferable to an analyser IG%, so the left shift is not scored in auto-diff mode. Switch to manual diff if a band count is available. Source control, lactate-guided resuscitation, broad coverage pending cultures.",
  };

  // Profound lymphopenia is evaluated BEFORE the NLR ladder. A collapsed
  // lymphocyte count is the denominator, so it drives NLR upward on its own;
  // reading the ratio first relabelled the viral signature "sepsis range".
  if (d.alc != null && d.alc < 0.4 && d.wbc <= 12) return {
    label: "Profound lymphopenia with near-normal WBC — viral / immune-mediated",
    sev: "concern",
    sub: "Classic for severe viral pneumonia (e.g., SARS-CoV-2, influenza). Also seen in advanced sepsis-induced immunoparesis.",
  };
  if (d.nlr != null && d.nlr >= 7.97) return {
    label: "Severe inflammation — sepsis range",
    sev: "concern",
    sub: "NLR at or above the 7.97 sepsis-diagnosis cut-point. Integrate with lactate, PCT, and source.",
  };
  if (d.aec != null && d.aec < AEC_EOSINOPENIA && d.nlr != null && d.nlr >= 3.0 && d.wbc <= 12) return {
    label: "Occult infection signature — investigate before WBC rises",
    sev: "concern",
    sub: "Normal WBC with eosinopenia and an NLR above Zahorec's pathological limit of 3.0 is suspicious for early or low-burden infection. Image and culture before symptoms escalate.",
  };
  if (t("asplenia")) return {
    label: "Asplenic baseline — standard thresholds invalid",
    sev: "caution",
    sub: "Baseline mild leukocytosis and reactive thrombocytosis are expected. Maintain a high pre-test probability for encapsulated organisms; trend, do not anchor on absolutes.",
  };
  // The 5–10% left-shift band is a reporting convention rather than a published
  // cut-point, and it is still a BAND convention — so it is only applied to a
  // manual count.
  const mildLeftShift = d.isManual && d.bandPct >= 5;
  if (d.wbc > 12 && d.aec != null && d.aec > 0 && (mildLeftShift || !d.isManual)) return {
    label: mildLeftShift ? "Leukocytosis with mild left shift — SIRS pattern"
                         : "Leukocytosis with preserved eosinophils — SIRS pattern",
    sev: "caution",
    sub: mildLeftShift
      ? "Pattern is consistent with SIRS; bacterial infection not excluded but less specific than the bandemia + eosinopenia signature."
      : "Pattern is consistent with SIRS; bacterial infection not excluded. The left-shift limb is not evaluated here: this tool carries no IG%-specific cut-point, so an analyser IG% is displayed but not scored. Switch to manual diff if a band count is available.",
  };
  if (d.wbc >= 4 && d.wbc <= 12 && d.nlr != null && d.nlr < 3.0) return {
    label: "CBC within range for non-infected adult",
    sev: "calm",
    sub: "No dominant sepsis signature, and NLR sits at or below Zahorec's grey zone. Clinical context leads.",
  };
  if (d.wbc >= 4 && d.wbc <= 12 && d.nlr != null && d.nlr < 7.97) return {
    label: "Normal count, mildly raised NLR — non-specific",
    sev: "caution",
    sub: "NLR is above Zahorec's pathological limit of 3.0 but below the 7.97 sepsis-diagnosis cut-point. Inflammation, physiologic stress and early infection all occupy this band; direction across serial draws discriminates better than the single value.",
  };
  return {
    label: "Mixed pattern — interpret in clinical context",
    sev: "caution",
    sub: "No single signature dominates. Use lactate, MAP, PCT, and source assessment as primary inputs.",
  };
}

function patternLabel(d, toggles) {
  const base = corePattern(d, toggles);
  if (!toggles.has("steroids") || base.sev === "neutral") return base;
  // A confounder annotates the read. It does not replace it, and it does not
  // lower the severity ceiling: glucocorticoid exposure is near-universal in
  // this population (septic shock on hydrocortisone, meningitis on
  // dexamethasone, COPD, transplant), so the most commonly thrown toggle was
  // the one that suppressed the output.
  return {
    label: base.label + " (steroid-altered)",
    sev: base.sev,
    sub: "Active glucocorticoid exposure demarginates neutrophils and suppresses eosinophils and lymphocytes, so NLR and eosinopenia carry little diagnostic weight here. The underlying CBC pattern is shown unchanged and severity is taken from it, not from the confounder — lactate, MAP, source control and microbiology adjudicate. " + base.sub,
  };
}

// Evidence rows
function evidenceRows(d, toggles) {
  const rows = [];
  const t = (k) => toggles.has(k);

  // NLR
  if (d.nlr != null) {
    const sev = nlrSeverity(d.nlr);
    let claim, num, caveat;
    if (d.nlr >= 12.65) {
      claim = "NLR exceeds the bacteremia cut-point of 12.65 derived by Russell 2019.";
      num = "Patient-level meta-analysis of five studies (n=3,320): pooled AUC 0.72. Ten studies reported the association qualitatively, but only those five contributed patient-level data to the pooled AUC and to the >12.65 cut-point.";
      caveat = "Cut-off varies 10–13 across cohorts; never adjudicates alone. Pooled across 21 studies and 23,621 patients, high versus low NLR carries only OR 1.11 (95% CI 1.08–1.14) for sepsis mortality — a real but modest effect.";
    } else if (d.nlr >= 9.05) {
      claim = "NLR above the 90-day mortality cut-point of 9.05 in non-ICU septic cohorts.";
      num = "Spoto 2021: sens 69.6%, spec 61.4%, AUC 0.66, PPV 28.9%, NPV 89.9% for 90-day mortality.";
      caveat = "Read that asymmetry directly: NPV 89.9% makes it fair for ruling mortality out, PPV 28.9% and AUC 0.66 make it weak for ruling it in. Outside-ICU population; recalibrate at ICU prevalence.";
    } else if (d.nlr >= 7.97) {
      claim = "NLR above the sepsis-diagnosis cut-point of 7.97.";
      num = "Spoto 2021, 251 septic vs 126 non-septic infected patients outside the ICU: sens 64.3%, spec 80.2%, AUC 0.74. Those two figures give a positive likelihood ratio of about 3.2 and a negative of about 0.45 — calculated here from the reported sensitivity and specificity, not quoted from the paper. Likelihood ratios are the quantities that transport; apply them to your own pre-test probability.";
      caveat = "The same paper reports PPV 86.5% and NPV 53.2%, and those do NOT transport: 251 of its 377 patients were septic, a prevalence of about 66.6% by arithmetic on the group sizes. Carry the same sensitivity and specificity to a 25% pre-test probability and the post-test probability falls to roughly 52% (calculated, not reported). Quoting a raw PPV without its denominator is the exact error this tool exists to teach against. NPV 53.2% likewise means a value below the cut-point does not clear the patient. In 1,572 ED episodes of suspected sepsis the neutrophil-lymphocyte count ratio reached AUC 0.68 (95% CI 0.65–0.71) for bacterial sepsis by Sepsis-2 criteria — modest standalone.";
    } else if (d.nlr >= 3) {
      claim = "NLR above Zahorec's pathological limit of 3.0, below the 7.97 sepsis-diagnosis cut-point.";
      num = "Direction beats the single value: across 30 studies and 26,441 critically ill patients, NLR was the leucocyte parameter that best predicted mortality, running lower in survivors on days 0–1 (mean difference −0.29, 95% CI −0.45 to −0.12), days 2–4 (−1.02, −1.57 to −0.48) and days 5–7 (−0.69, −1.00 to −0.38).";
      caveat = "Single value at any cut-point has limited specificity. Inflammation, physiologic stress and early infection all sit in this band.";
    } else if (d.nlr >= 2.3) {
      claim = "NLR in Zahorec's grey zone (2.3–3.0) — an early-warning band for inflammation, infection or stress.";
      num = "Zahorec 2021: normal range 1–2; grey zone 2.3–3.0; values above 3.0 or below 0.7 are pathological in adults.";
      caveat = "Healthy-population reference intervals run wider than the grey zone: 0.78–3.53 (n=413) and 0.89–3.26 in men / 0.87–3.16 in women (n=29,947). A value inside the grey zone is not by itself abnormal.";
    } else if (d.nlr >= 0.7) {
      claim = d.nlr >= 2 ? "NLR between Zahorec's normal range (1–2) and the grey zone (2.3–3.0) — no published band covers this interval."
            : d.nlr >= 1 ? "NLR within Zahorec's normal range (1–2)."
            : "NLR below Zahorec's normal range (1–2), above the 0.7 low pathological limit.";
      num = "Reassuring on its own. But persistently low NLR in septic shock is itself a J-curve mortality signal: adjusted HR 2.25 (95% CI 1.63–3.11) for 28-day mortality, against HR 2.65 (1.64–4.29) for persistently high NLR (Hwang 2017, n=1,395).";
      caveat = "Low NLR with shock may reflect immunoparesis — in that cohort the lowest NLR quintile carried the highest 28-day mortality at 24.4%.";
    } else {
      claim = "NLR below Zahorec's low pathological limit of 0.7 — abnormal, not normal.";
      num = "Zahorec 2021 places values below 0.7 outside the adult normal range, alongside values above 3.0. Hwang 2017 supplies the outcome: among 1,395 patients with severe sepsis or septic shock, the lowest NLR quintile (median 0.2, IQR 0.1–0.7) carried the highest 28-day mortality at 24.4% — higher than the top quintile's 16.1% — and persistently low NLR carried adjusted HR 2.25 (95% CI 1.63–3.11) for 28-day mortality.";
      caveat = "Do not read this as inflammation resolving. A ratio this low is a collapsed neutrophil count, a raised lymphocyte count, or both: read the ANC and ALC rows directly. In a hypoperfused patient it is a flag for immunoparesis, not reassurance.";
    }
    if (t("steroids")) {
      caveat = "STEROID EFFECT: NLR is not interpretable under active glucocorticoid exposure.";
    }
    if (t("chemo") && d.anc != null && d.anc < 0.5) {
      caveat = "ANC <500: NLR denominator and numerator are both perturbed; do not interpret.";
    }
    rows.push({
      id: "nlr",
      finding: `NLR = ${d.nlr.toFixed(2)}`,
      state: t("steroids") || (t("chemo") && d.anc != null && d.anc < 0.5) ? "Uninterpretable" : sev,
      sev,
      claim, num, caveat,
      cites: [1, 2, 3, 4, 19, 20, 21, 28, 29],
    });
  }

  // WBC + ANC
  const wbcSev = wbcSeverity(d.wbc);
  let wbcClaim, wbcNum, wbcCaveat;
  if (d.wbc == null) {
    wbcClaim = "No white cell count entered.";
    wbcNum = "—";
    wbcCaveat = "A blank field is not a zero. Every absolute count on this page is WBC × percent, so ANC, ALC, AEC and NLR are all withheld until a count is entered.";
  } else if (d.wbc < 1) {
    wbcClaim = "Profound leukopenia.";
    wbcNum = "WBC <1: high mortality risk; classified per neutropenic-fever guidance.";
    wbcCaveat = "Look for marrow suppression, sepsis-induced cytopenia, drug effect.";
  } else if (d.wbc < 4) {
    wbcClaim = "Leukopenia.";
    wbcNum = "A low count is not the benign end of the range: in 1,395 patients with severe sepsis or septic shock, the lowest NLR quintile carried the highest 28-day mortality (24.4%). The risk in sepsis is bidirectional.";
    wbcCaveat = "Confounded by chemo, drug-induced agranulocytosis, marrow stress.";
  } else if (d.wbc > 20) {
    wbcClaim = "Marked leukocytosis.";
    wbcNum = "Etiologies: severe bacterial infection, steroid effect, hyperleukocytosis, leukemoid reaction.";
    wbcCaveat = "Rarely from sepsis alone; check smear for blasts.";
  } else if (d.wbc > 12) {
    wbcClaim = "Leukocytosis above the SIRS threshold.";
    wbcNum = "WBC discriminates bacteremia poorly. In 25,776 hospitalised patients with a differential and a blood culture, AUROC was 0.58 for WBC, 0.63 for ANC and 0.74 for neutrophil percentage — the percentage outperforms both absolute counts. SIRS criteria also miss about 12% of severe sepsis (13,278 of 109,663 ICU patients with infection and organ failure were SIRS-negative).";
    wbcCaveat = "Interpret pattern (NLR + bands + AEC), not absolute count.";
  } else {
    wbcClaim = "Total WBC within reference range.";
    wbcNum = "A normal WBC does not exclude infection: Drees 2012 found adjusted OR 6.2 for positive blood cultures at ≥20% bands in 2,342 admissions whose total WBC was normal.";
    wbcCaveat = "Differential is more informative than total here.";
  }
  rows.push({
    id: "wbc",
    finding: `WBC = ${fmt(d.wbc, 1)} ×10³/µL`,
    state: wbcSev,
    sev: wbcSev,
    claim: wbcClaim,
    num: wbcNum,
    caveat: wbcCaveat,
    cites: [3, 7, 18, 22],
  });

  // ANC
  const ancSev = ancSeverity(d.anc);
  rows.push({
    id: "anc",
    finding: `ANC = ${fmt(d.anc, 2)} ×10³/µL`,
    state: d.anc == null ? "No value" : ancSev,
    sev: ancSev,
    claim: d.anc == null ? "ANC not derivable — no WBC entered."
         : d.anc < 0.5 ? "Severe neutropenia. The febrile-neutropenia framework applies if fever is documented; this tool records no temperature and cannot establish that."
         : d.anc < 1.0 ? "Mild-to-moderate neutropenia; risk-stratify for infection."
         : "ANC within or above reference range.",
    num: d.anc == null ? "—"
       : d.anc < 0.5 ? "ANC <500 is the empiric-coverage threshold and ANC <100 is profound neutropenia. Both come from standard IDSA/ASCO febrile-neutropenia guidance — consensus practice, not a figure derived from any study cited in this tool. Neither threshold carries a fever, and the causes of severe neutropenia that are not febrile neutropenia — drug-induced agranulocytosis, marrow infiltration, sepsis-induced suppression, benign ethnic (Duffy-null) neutropenia — do not call for empiric antibacterials on the count alone."
                       : "Trend matters more than the single value. The upper bound of 7.7 ×10³/µL used for the display band is a laboratory reference convention, also unsourced here.",
    caveat: t("chemo") ? "Chemotherapy active — interpret in chemo-nadir framework." : "Manage febrile neutropenia by local protocol; this tool carries no primary citation for those cut-points and no temperature input.",
    cites: [],
  });

  // Left shift. In MANUAL mode the Drees band thresholds apply, because that
  // is the measurement they were derived on. In AUTO mode the analyser IG% is
  // displayed and explicitly NOT scored against them.
  if (!d.isManual && d.leftShiftPct > 0) {
    rows.push({
      id: "bands",
      finding: `IG% = ${d.leftShiftPct.toFixed(1)}%`,
      state: "Not scored",
      sev: "neutral",
      claim: "Automated immature-granulocyte percentage — displayed, not scored.",
      num: "This tool carries no IG%-specific diagnostic cut-point. The 11% and 20% thresholds it does carry are Drees 2012's, derived on a 100-cell manual band count in 2,342 admissions whose total white count was normal; an analyser IG% is a different measurement on a different scale, and it typically runs far below a manual band percentage. Applying those odds ratios here would be a transported threshold, not a validated one.",
      caveat: "Lemkus 2022 (68 evaluable samples) found NE-SFL the strongest extended-differential discriminator for bacteraemia overall (AUC >0.8), with IG% best only in the HIV-negative subgroup (AUC 0.9) — a direction, not a cut-point. Switch to manual diff if a band count is available. Note also that IG is kept out of the ANC in this mode: analysers that already fold immature granulocytes into NEUT% would otherwise count them twice.",
      cites: [7, 9],
    });
  }
  if (d.isManual && (d.leftShiftPct > 0 || (d.abc != null && d.abc > 0))) {
    const bSev = d.bandPct >= 20 ? "critical" : d.bandPct >= 11 ? "concern" : d.bandPct >= 5 ? "caution" : "calm";
    let bClaim, bNum, bCaveat;
    if (d.bandPct >= 20) {
      bClaim = "Marked bandemia (≥20%).";
      bNum = "Drees 2012, 2,342 admissions with a normal total WBC (3,800–10,800/mm³): adjusted OR 6.2 (95% CI 3.2–11.8) for positive blood cultures, and adjusted OR 2.8 (1.7–4.3) for any significant positive culture.";
      bCaveat = "Manual band counts vary widely between laboratories — CV 55.8% among CAP proficiency-testing participants on a 100-cell manual differential, 32.9% among CAP Hematology and Clinical Microscopy Committee members. Grouping bands with segmented neutrophils drops those to 6.2% and 5.0%.";
    } else if (d.bandPct >= 11) {
      bClaim = "Moderate bandemia (11–19%).";
      bNum = "Drees 2012: adjusted OR 3.8 (95% CI 2.0–7.2) for positive blood cultures. An independent 970-patient cohort supports the same direction at a >10% threshold: adjusted OR 6.13 (95% CI 4.02–9.40), sens 0.42, spec 0.91.";
      bCaveat = "Band boundary set at 11% deliberately: Drees classed ≤10% bands as the normal reference group, so a 10% value belongs to that study's normal band, not to bandemia. Same inter-observer variability as above.";
    } else if (d.bandPct >= 5) {
      bClaim = "Mild left shift (5–10%).";
      bNum = "Less specific in isolation; correlate with NLR and AEC.";
      bCaveat = "This 5–10% band is a reporting convention, not a published cut-point — Drees treated everything ≤10% as normal. G-CSF or a recent seizure can also mimic it.";
    } else {
      bClaim = "No clinically meaningful left shift.";
      bNum = "—";
      bCaveat = "Absence of bands does not rule out infection.";
    }
    // Lemkus 2022 is a diagnostic-performance study, not a reproducibility one —
    // stated here as what it actually showed.
    bCaveat += " Lemkus 2022 (68 evaluable samples) found NE-SFL the strongest extended-differential discriminator for bacteraemia overall (AUC >0.8), with IG% best only in the HIV-negative subgroup (AUC 0.9).";
    if (t("gcsf"))    bCaveat = "G-CSF active: bandemia is iatrogenic and not interpretable.";
    if (t("seizure")) bCaveat = "Recent seizure: postictal demargination can produce a transient left shift.";
    rows.push({
      id: "bands",
      finding: `Bands = ${d.bandPct.toFixed(1)}%`,
      state: bSev,
      sev: bSev,
      claim: bClaim, num: bNum, caveat: bCaveat,
      cites: [7, 8, 9, 23],
    });
  }

  // ALC / Lymphopenia
  const alcSev = alcSeverity(d.alc);
  let lClaim, lNum, lCaveat;
  if (d.alc == null) {
    lClaim = "ALC not derivable — no WBC entered.";
    lNum = "—";
    lCaveat = "Enter a white cell count.";
  } else if (d.alc < 0.4) {
    lClaim = "Profound lymphopenia (ALC <400 cells/µL).";
    lNum = "The adult anchor is Drewry 2014: day-4 ALC modelled continuously in 335 patients with bacteraemic sepsis gave adjusted OR 0.68 per unit for 28-day survival and 0.74 for 1-year survival, with severe persistent lymphopenia defined as ALC ≤0.6 ×10⁹/L on day 4.";
    lCaveat = "The 400 cells/µL boundary is this tool's display convention, not a published cut-point — the nearest sourced adult threshold is Drewry's ≤0.6 ×10⁹/L on day 4. Steroids, chemo, HIV and post-transplant states all confound a single value.";
  } else if (d.alc < 1.0) {
    lClaim = "Lymphopenia.";
    lNum = "Pediatric: ALC <1,000 cells/µL on 2 days between study days 0–5 in 401 children with severe sepsis carried adjusted OR 2.98 (95% CI 1.85–4.02) for prolonged MODS or death. Adult: Drewry's severe persistent threshold is ALC ≤0.6 ×10⁹/L on day 4.";
    lCaveat = "There is no single shared threshold — roughly 0.6–1.0 ×10⁹/L depending on cohort and day. Single value < trend; reassess at 48–72 h.";
  } else {
    lClaim = "ALC within reference range.";
    lNum = "Does not exclude evolving immunoparesis — recheck on day 3–5. Trajectory carries the risk: among 1,640 septic patients with initial lymphopenia (<1.0 ×10⁹/L), the persistent-low trajectory group (n=544, 33.2%) had the lowest 7-day and 28-day survival, and after adjustment stayed associated with 28-day mortality (aHR 1.76, 95% CI 1.27–2.45) though not with 7-day.";
    lCaveat = "A normal ALC today does not predict the day-3 value.";
  }
  if (t("steroids")) lCaveat = "STEROIDS lower ALC within hours; the acute reading is uninformative.";
  // Correcting the count is not the same as correcting the outcome.
  if (d.alc != null) lCaveat += " Recombinant human IL-7 raises ALC in sepsis (mean difference 1.33 at 3 weeks across 4 RCTs) but reduces neither mortality (RR 1.01, 95% CI 0.36–2.81) nor secondary infection (RR 1.05, 0.48–2.30); the intravenous-route trial was stopped early after 3 of 15 patients developed fever and respiratory distress 5–8 h after dosing.";
  rows.push({
    id: "alc",
    finding: `ALC = ${fmt(d.alc, 2)} ×10³/µL`,
    state: alcSev,
    sev: alcSev,
    claim: lClaim, num: lNum, caveat: lCaveat,
    cites: [10, 11, 12, 30, 31, 32],
  });

  // AEC
  const aecSev = aecSeverity(d.aec);
  let eClaim, eNum, eCaveat;
  if (d.aec == null) {
    eClaim = "AEC not derivable — no WBC entered.";
    eNum = "—";
    eCaveat = "Enter a white cell count.";
  } else if (d.aec < AEC_EOSINOPENIA) {
    eClaim = "Eosinopenia (<50 cells/µL). This is the single boundary used by the severity colour, this row and the pattern engine alike. An analyser-reported 0 and a count of 30 are the same finding here — no source grades exactly zero as worse.";
    eNum = "Optimistic bound, Abidi 2008 (n=177, single medical ICU), at the same <50 cells/µL cut-point this tool displays: sens 80% (71–86), spec 91% (79–96), +LR 9.12 (3.9–21), −LR 0.21 (0.15–0.31), AUC 0.89 for non-infected versus infected. The harder comparison in that same paper — SIRS versus infection — used <40 cells/µL and fell to sens 80% (71–86), spec 80% (55–93), +LR 4 (1.65–9.65), AUC 0.84. Pooled reality, Lin 2021 (7 studies, 3,842 subjects): SROC AUC 0.73 (0.68–0.76), sens 0.66, spec 0.68, +LR 2.09 (1.44–3.02), −LR 0.49. Largest prospective series, Lavoignet 2026 (770 ED patients, 422 infected): at ≤10/mm³ spec 88%, sens 48%, AUC 0.75 — comparable to neutrophils (0.74) and leukocytes (0.72), inferior to CRP (0.89). Sustained AEC <45 cells/µL carried HR 4.20 (95% CI 2.66–6.62) for mortality in 2,311 first-bacteraemia episodes.";
    eCaveat = "Treat +LR 9.12 as the single-centre ceiling and ~2–4 as the pooled expectation. Note the width on the <40 specificity (55–93%) — that is the discrimination that matters at the bedside. Best used as a rule-in adjunct. Prognostic ceiling is low: in 496 ICU patients with severe CAP, eosinopenia was independently associated with 30-day mortality (HR 1.95, 1.19–3.20) yet had AUC 0.562 standalone. Confounded by steroids, stress and surgery.";
  } else if (d.aec >= 1.5) {
    eClaim = "Eosinophilia (≥1500 cells/µL).";
    eNum = "Sepsis pattern fits poorly. Consider DRESS, adrenal insufficiency post-taper, parasitic, hypereosinophilic syndrome.";
    eCaveat = "Recheck after culprit-drug withdrawal in suspected DRESS.";
  } else {
    eClaim = "AEC at or above the 50 cells/µL eosinopenia boundary.";
    eNum = "Argues mildly against bacterial sepsis but is not exclusionary. Abidi's sensitivity at this cut-point was 80%, so roughly one infected patient in five sits above it.";
    eCaveat = "Even mild steroid exposure suppresses eos.";
  }
  if (t("steroids")) eCaveat = "STEROIDS suppress eosinophils within hours, so a low AEC on active glucocorticoid is weak diagnostic evidence — but not empty: in a prospective CAP cohort the ≤30/µL threshold predicted mechanical ventilation (RR 2.12, 95% CI 1.61–2.80) regardless of glucocorticoid treatment. Discount the count; do not discard it.";
  rows.push({
    id: "aec",
    finding: `AEC = ${d.aec == null ? "—" : (d.aec * 1000).toFixed(0)} cells/µL`,
    state: aecSev,
    sev: aecSev,
    claim: eClaim, num: eNum, caveat: eCaveat,
    cites: [13, 14, 15, 16, 25, 26, 27],
  });

  return rows;
}

// =================== APP ===================
// Shared citation superscript — same affordance as the evidence rows, so a
// reference cited in a warning, the narrative or the pediatric note is
// clickable rather than orphaned.
const Cite = ({ ids, clickRef }) => (
  <>{(ids || []).map((c) => (
    <sup key={c} className="cite" onClick={() => clickRef(c)}> [{c}]</sup>
  ))}</>
);

function getInitialTheme() {
  try {
    const stored = localStorage.getItem("cbc-theme");
    if (stored === "light" || stored === "dark") return stored;
  } catch (_) {}
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}

function App() {
  // Default is auto-diff, so the five-part differential closes to 100 on its
  // own and IG% is carried alongside it — the way an analyser reports it.
  const [cbc, setCbc] = useState({
    wbc: 12.0, neutPct: 74, bandPct: 4, lymphPct: 20, monoPct: 4, eosPct: 1.5, basoPct: 0.5, plt: 200,
  });
  const [mode, setMode] = useState("auto"); // auto vs manual diff
  const [toggles, setToggles] = useState(new Set());
  const [highlightedRef, setHighlightedRef] = useState(null);
  const [theme, setTheme] = useState(getInitialTheme);
  const refsRef = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("cbc-theme", theme); } catch (_) {}
  }, [theme]);

  const toggleTheme = useCallback(() => setTheme((t) => t === "dark" ? "light" : "dark"), []);

  const d = useMemo(() => derive(cbc, mode), [cbc, mode]);
  const tset = toggles;
  // A cleared platelet field must reach the engine as null, never as 0.
  const pltVal = numOrNull(cbc.plt);
  const pattern = useMemo(() => patternLabel({ ...d, plt: pltVal }, tset), [d, pltVal, tset]);
  const rows = useMemo(() => {
    const r = evidenceRows(d, tset);
    // append platelet row
    const pltSev = plateletSeverity(pltVal);
    let pClaim, pNum, pCaveat;
    if (pltVal == null) {
      pClaim = "No platelet count entered.";
      pNum = "—";
      pCaveat = "A blank field is not a zero. Enter a count to interpret it.";
    } else if (pltVal < 20) {
      pClaim = "Critical thrombocytopenia.";
      pNum = "Bleed risk is immediate. Wei 2026 (363 ED sepsis episodes) gives the depth dose-response for 28-day mortality: nadir 50–99 ×10⁹/L adjusted HR 2.04, 20–49 aHR 2.98, <20 aHR 3.46.";
      pCaveat = "Trajectory > single value. Calculate ISTH DIC score (PT, fibrinogen, D-dimer).";
    } else if (pltVal < 50) {
      pClaim = "Severe thrombocytopenia.";
      pNum = "DIC, HIT, drug-induced and sepsis-driven consumption are the major differentials. Nadir 20–49 ×10⁹/L carried adjusted HR 2.98 for 28-day mortality.";
      pCaveat = "Timing of the nadir matters as much as its depth: intermediate and late platelet nadirs were independently associated with 28-day mortality (adjusted HR 4.39–7.28 and 5.85–9.58), while initial and early nadirs were not.";
    } else if (pltVal < 100) {
      pClaim = "Moderate thrombocytopenia.";
      pNum = "Plt <100 in sepsis contributes to organ-dysfunction scores; review trend. Nadir 50–99 ×10⁹/L carried adjusted HR 2.04 for 28-day mortality.";
      pCaveat = "Consider drug effect, splenic sequestration, evolving DIC. A fall of 30–50% from baseline carried aHR 1.79 and a fall >50% aHR 2.43, independent of the absolute nadir.";
    } else if (pltVal > 450) {
      pClaim = "Thrombocytosis.";
      pNum = "Reactive in inflammation, post-splenectomy, iron deficiency. Persistent → consider essential thrombocythemia.";
      pCaveat = tset.has("asplenia") ? "Expected baseline in asplenia." : "Trend over 1–2 weeks.";
    } else {
      pClaim = "Platelet count within reference range.";
      pNum = "—";
      pCaveat = "Recheck in 24 h if sepsis suspected — nadir typically lags.";
    }
    r.push({
      id: "plt",
      finding: `Platelets = ${pltVal == null ? "—" : pltVal} ×10³/µL`,
      state: pltVal == null ? "No value" : pltSev,
      sev: pltSev,
      claim: pClaim,
      num: pNum,
      caveat: pCaveat,
      cites: [24],
    });
    return r;
  }, [d, pltVal, tset]);

  const update = useCallback((k, v) => {
    setCbc((c) => ({ ...c, [k]: v === "" ? "" : Number(v) }));
  }, []);

  const toggle = useCallback((id) => {
    setToggles((s) => {
      const n = new Set(s);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  }, []);

  // A case is a differential of a particular KIND. Loading its numbers without
  // its mode is what let a manual band count be scored as an analyser IG%.
  const loadCase = useCallback((c) => {
    setCbc(c.cbc);
    setToggles(new Set(c.toggles));
    if (c.mode) setMode(c.mode);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  const clickRef = useCallback((id) => {
    setHighlightedRef(id);
    const el = document.getElementById(`ref-${id}`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => setHighlightedRef(null), 2200);
  }, []);

  // Edge-case warnings
  const warnings = [];
  if (tset.has("steroids")) warnings.push({
    sev: "caution",
    head: "Steroid effect — interpret CBC pattern with strong skepticism",
    body: "Glucocorticoids demarginate neutrophils and suppress eosinophils and lymphocytes acutely. The commonly quoted magnitude — a 2–3× neutrophil rise within 5–24 h — is conventional teaching; no primary source for that figure is carried in this tool, so treat the direction as reliable and the multiplier as an approximation. The suppression is also not total: in a prospective CAP cohort an eosinophil count ≤30/µL predicted mechanical ventilation regardless of glucocorticoid treatment, so a very low AEC on steroids still carries some prognostic weight even though its diagnostic value collapses. Lean on lactate, MAP, source control, and procalcitonin (if available).",
    cites: [26],
  });
  if (tset.has("chemo") && d.anc != null && d.anc < 0.5) warnings.push({
    sev: "critical",
    head: "Neutropenic fever framework",
    body: "ANC <500 in the setting of recent cytotoxic chemotherapy. NLR is uninterpretable. Treat as febrile neutropenia per institutional protocol; empiric coverage takes priority over CBC pattern.",
  });
  if (tset.has("gcsf")) warnings.push({
    sev: "caution",
    head: "G-CSF active — bandemia is iatrogenic",
    body: "Growth-factor-driven left shift is not diagnostic of bacterial infection. Look for toxic granulations on smear instead.",
  });
  if (tset.has("asplenia")) warnings.push({
    sev: "caution",
    head: "Asplenic baseline reframes the entire CBC",
    body: "Mild leukocytosis and reactive thrombocytosis are expected, and standard sepsis cut-offs do not apply. The specific baselines often quoted — WBC ~11–14 ×10³/µL and platelets >400 ×10³/µL — are expert-opinion approximations rather than measured population values; no cohort or reference-interval study establishing them was located, so anchor on the patient's own prior counts wherever they exist. Maintain a high pre-test probability for encapsulated pathogens (S. pneumoniae, H. influenzae, N. meningitidis).",
  });
  if (tset.has("hememalig")) warnings.push({
    sev: "caution",
    head: "Hematologic malignancy — morphology required",
    body: "Cytopenias or blasts on smear can mimic or coexist with infection. Heme-onc input and flow cytometry as needed.",
  });
  if (tset.has("seizure")) warnings.push({
    sev: "caution",
    head: "Postictal leukocytosis",
    body: "Leukocytosis appears immediately after a generalized convulsive seizure and normalises within about two hours. In 28 adults monitored through 28 generalized convulsive seizures in an epilepsy unit, the white count had returned to baseline by the 2-hour draw (p < 0.001) while CRP went on rising to a 24-hour peak. The practical consequence runs opposite to the older teaching: a count still elevated several hours out is not the seizure, and waiting 12–24 h to recheck wastes the window. No absolute ceiling for the postictal rise is quoted here — none is sourced.",
    cites: [33],
  });
  if (tset.has("pregnancy")) warnings.push({
    sev: "caution",
    head: "Pregnancy / peripartum baseline",
    body: "Baseline WBC runs higher in late pregnancy and higher again peripartum, so the >12 SIRS threshold carries almost no specificity. The commonly quoted ceilings of roughly 16 in the third trimester and 22 peripartum are conventional teaching; two searches this build found no primary source for either figure, so treat them as approximations rather than reference intervals. The nearest real dataset — 143,106 term singleton pregnancies linked to more than 972,000 CBC results — derives intervals by trimester and by gestational week, and warns that trimester bins are inappropriate for several leukocyte parameters because they move too fast within a trimester. Read against the patient's own earlier counts wherever they exist.",
    cites: [40],
  });
  if (tset.has("epi")) warnings.push({
    sev: "caution",
    head: "Acute β-adrenergic demargination",
    body: "Epinephrine and high-dose β-agonists raise WBC within minutes; resolves shortly after infusion ends.",
  });
  if (tset.has("transfusion")) warnings.push({
    sev: "caution",
    head: "Recent transfusion — dilutional shifts",
    body: "Interpret platelet and differential by trend, not absolute, for the next 4–6 h.",
  });

  return (
    <div className="shell">
      <header className="top">
        <div>
          <span className="overline">CBC · sepsis &amp; infection lens · ICU</span>
          <div className="hairline" aria-hidden="true"></div>
          <h1>Bedside CBC interpretation, evidence-graded</h1>
          <div className="sub">Adult-primary thresholds with pediatric callouts. Inputs accept auto-diff (IG%) or manual diff (bands).</div>
        </div>
        <div className="right">
          <button className="theme-toggle"
                  onClick={toggleTheme}
                  aria-label={`Switch to ${theme === "dark" ? "light" : "dark"} theme`}>
            <span className="glyph" aria-hidden="true"></span>
            {theme === "dark" ? "Light theme" : "Dark theme"}
          </button>
          <div className="disclaimer">Educational. Not for clinical decision-making. CBC alone does not adjudicate sepsis.</div>
        </div>
      </header>

      <main>
        <Ribbon d={d} cbc={cbc} pattern={pattern} />

        <div className="main">
          <section aria-labelledby="inputs-h">
            <InputPanel cbc={cbc} update={update} mode={mode} setMode={setMode}
                        toggles={tset} toggle={toggle} loadCase={loadCase}
                        clickRef={clickRef} />
          </section>
          <section aria-labelledby="interp-h">
            <Interpretation pattern={pattern} rows={rows} warnings={warnings}
                            d={d} cbc={cbc} clickRef={clickRef} />
          </section>
        </div>

        <section aria-labelledby="cases-h">
          <CaseShelf cases={CASES} loadCase={loadCase} />
        </section>

        <section aria-labelledby="narrative-h">
          <Narrative clickRef={clickRef} />
        </section>

        <section aria-labelledby="refs-h">
          <ReferencesList highlighted={highlightedRef} />
        </section>
      </main>

      <Footer />
    </div>
  );
}

function Ribbon({ d, cbc, pattern }) {
  const nlrSev = nlrSeverity(d.nlr);
  const plt = numOrNull(cbc.plt);
  // Ribbon band labels use the same published boundaries as nlrSeverity():
  // 0.7, 2.3 and 3.0 from Zahorec 2021 [19]; 7.97 sepsis-diagnosis and 9.05
  // 90-day mortality from Spoto 2021 [4]; 12.65 bacteremia from Russell 2019
  // [2]. The former 6 / 9 / 14 boundaries were a house scheme with no citation
  // and have been removed. Two intervals — 0.7–1.0 and 2.0–2.3 — are named as
  // gaps rather than folded into a neighbouring band, because Zahorec's scheme
  // does not cover them and "within normal range (1–2)" was being printed over
  // values that are not inside it.
  const nlrLabel =
    d.nlr == null   ? "Lymphocyte count zero or WBC missing" :
    d.nlr < 0.7     ? "Below Zahorec pathological low limit (<0.7)" :
    d.nlr < 1.0     ? "Below Zahorec normal range, above the 0.7 low limit" :
    d.nlr < 2.0     ? "Within Zahorec normal range (1–2)" :
    d.nlr < 2.3     ? "Between Zahorec normal range and grey zone (2–2.3)" :
    d.nlr < 3.0     ? "Zahorec grey zone (2.3–3.0)" :
    d.nlr < 7.97    ? "Above Zahorec pathological limit (>3.0)" :
    d.nlr < 9.05    ? "Sepsis-diagnosis cut-point exceeded (7.97)" :
    d.nlr < 12.65   ? "90-day mortality cut-point exceeded (9.05)" :
                      "Bacteremia cut-point exceeded (12.65)";
  const chips = [
    { key: "wbc", label: "WBC", val: fmt(d.wbc, 1),   unit: "×10³", sev: wbcSeverity(d.wbc) },
    { key: "anc", label: "ANC", val: fmt(d.anc, 2),   unit: "×10³", sev: ancSeverity(d.anc) },
    { key: "alc", label: "ALC", val: fmt(d.alc, 2),   unit: "×10³", sev: alcSeverity(d.alc) },
    { key: "aec", label: "AEC", val: d.aec == null ? "—" : (d.aec * 1000).toFixed(0), unit: "/µL", sev: aecSeverity(d.aec) },
    // 11%, not 10%: Drees 2012 classed ≤10% bands as its NORMAL reference group
    // [7] — and only on a manual count. An analyser IG% is shown uncoloured
    // because no IG%-specific cut-point is carried here.
    { key: "igp", label: d.isManual ? "Bands" : "IG", val: d.leftShiftPct.toFixed(1), unit: "%",
      sev: !d.isManual ? "neutral"
         : d.bandPct >= 20 ? "critical" : d.bandPct >= 11 ? "concern" : d.bandPct >= 5 ? "caution" : "calm" },
    { key: "plt", label: "Plt", val: plt == null ? "—" : String(plt), unit: "×10³", sev: plateletSeverity(plt) },
  ];
  return (
    <div className="ribbon">
      <div className="nlr-hero" data-sev={nlrSev}>
        <div className="label">NLR — Neutrophil-to-lymphocyte ratio</div>
        <div className="hero-val">{d.nlr == null ? "—" : d.nlr.toFixed(2)}</div>
        <div className="hero-sub">{nlrLabel}</div>
      </div>
      <div className="chip-grid">
        {chips.map((c) => (
          <div key={c.key} className="chip" data-sev={c.sev}>
            <div className="label"><span className="severity-dot"></span>{c.label}</div>
            <div className="val">{c.val}<span className="unit">{c.unit}</span></div>
          </div>
        ))}
      </div>
      <div className="verdict-tile" data-sev={pattern.sev}>
        <div className="label">Pattern read</div>
        <div className="verdict-text">{pattern.label}</div>
      </div>
    </div>
  );
}

function InputPanel({ cbc, update, mode, setMode, toggles, toggle, loadCase, clickRef }) {
  const fields = [
    { k: "wbc",      label: "WBC",   unit: "×10³/µL" },
    { k: "plt",      label: "Plt",   unit: "×10³/µL" },
    { k: "neutPct",  label: "Neut %", unit: "%" },
    { k: "lymphPct", label: "Lymph %", unit: "%" },
    { k: "monoPct",  label: "Mono %", unit: "%" },
    { k: "eosPct",   label: "Eos %", unit: "%" },
    { k: "basoPct",  label: "Baso %", unit: "%" },
    { k: "bandPct",  label: mode === "manual" ? "Bands %" : "IG %", unit: "%" },
  ];
  const audit = diffAudit(cbc, mode);
  const nameOf = (k) => (fields.find((f) => f.k === k) || { label: k }).label;
  const showAudit = audit.sumOff || audit.outOfRange.length > 0 || audit.blank.length > 0;
  return (
    <div className="card">
      <h2 id="inputs-h">CBC inputs</h2>

      <div className="seg" role="tablist" aria-label="Differential mode">
        <button aria-pressed={mode === "auto"}   onClick={() => setMode("auto")}>Auto diff (IG%)</button>
        <button aria-pressed={mode === "manual"} onClick={() => setMode("manual")}>Manual diff (bands)</button>
      </div>

      <div className="inputs" style={{ marginTop: 10 }}>
        {fields.map((f) => (
          <div key={f.k} className="input-row">
            <label htmlFor={`in-${f.k}`}>{f.label} <span style={{ color: "var(--ink-mute)", fontWeight: 400 }}>({f.unit})</span></label>
            <input id={`in-${f.k}`}
                   type="number" inputMode="decimal" step="0.1"
                   min={FIELD_SPEC[f.k].min} max={FIELD_SPEC[f.k].max}
                   aria-label={f.label}
                   aria-invalid={audit.outOfRange.includes(f.k) || audit.blank.includes(f.k) ? "true" : undefined}
                   aria-describedby={showAudit ? "input-audit" : undefined}
                   value={cbc[f.k]}
                   onChange={(e) => update(f.k, e.target.value)} />
          </div>
        ))}
      </div>
      {showAudit && (
        <div className="input-audit" id="input-audit" role="status" aria-live="polite">
          {audit.blank.length > 0 && (
            <div><strong>Empty:</strong> {audit.blank.map(nameOf).join(", ")}. A blank field is not read as zero — anything derived from it shows “—” rather than a number.</div>
          )}
          {audit.outOfRange.length > 0 && (
            <div><strong>Out of range:</strong> {audit.outOfRange.map(nameOf).join(", ")}. Percentages must sit between 0 and 100.</div>
          )}
          {audit.sumOff && (
            <div><strong>Differential sums to {audit.sum.toFixed(1)}%, not 100%.</strong> Every absolute on this page is WBC × percent, so a differential that does not close produces a wrong ANC, ALC and AEC — and a confident pattern read on top of them — with nothing else to signal it.{mode === "manual" ? " Bands are counted inside the 100 in manual mode." : " IG% is excluded from this sum: analysers report it alongside NEUT%, not inside the 100-cell differential."}</div>
          )}
        </div>
      )}
      <div className="hint" style={{ fontSize: 11, color: "var(--ink-mute)", marginTop: 6, fontStyle: "italic" }}>
        Absolutes derive from WBC × percent. <strong>Manual diff</strong> reads the last field as a 100-cell band count: bands enter the ANC and are scored against Drees 2012's 11% and 20% thresholds. <strong>Auto diff</strong> reads it as an analyser IG%: it is displayed but kept out of the ANC, and not scored, because no IG%-specific cut-point is carried here and the band thresholds were derived on a different measurement.
      </div>

      <h3>Confounder toggles</h3>
      <div className="toggles" role="group" aria-label="Confounder toggles">
        {TOGGLES.map((t) => (
          <button key={t.id} className="toggle"
                  aria-pressed={toggles.has(t.id)}
                  title={t.desc}
                  onClick={() => toggle(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      <div className="actions">
        <button className="btn" onClick={() => loadCase(CASES[0])}>Load case #1</button>
        <button className="btn"
                onClick={() => {
                  // reset
                  loadCase({
                    mode: "auto",
                    cbc: { wbc: 7.5, neutPct: 60, bandPct: 0, lymphPct: 30, monoPct: 8, eosPct: 1.5, basoPct: 0.5, plt: 250 },
                    toggles: [],
                  });
                }}>Reset to normal</button>
      </div>

      <div className="peds-note">
        <span className="ptag">Peds</span>
        Adult thresholds drive this artifact, and the current pediatric definition of sepsis does not use the white count at all. The 2024 Phoenix criteria retired the 2005 SIRS-based definition for poor predictive properties, retired the term “severe sepsis”, and score respiratory, cardiovascular, coagulation and neurological dysfunction only — derived across 3,049,699 encounters and externally validated in 581,317, with no leukocyte, band or NLR term among the four organ systems<Cite ids={[37, 38]} clickRef={clickRef} />. Where the CBC still earns diagnostic weight: neonatal NLR pools to sens 0.74, spec 0.88, +LR 6.35, AUC 0.87 across 14 studies and 1,499 newborns, although the contributing cut-offs span 0.1 to 9.4 and the +LR interval runs 2.6–15.47, so the pooled figure is far softer than it looks (Xin 2022)<Cite ids={[5]} clickRef={clickRef} />. A 2025 meta-analysis puts the immature-to-total neutrophil ratio &gt;0.20 at sens 66.3% / spec 85.4%, with white cell and platelet counts performing worse still<Cite ids={[39]} clickRef={clickRef} />. PICU lymphopenia below 1,000 cells/µL on two days between days 0–5 carried adjusted OR 2.98 for prolonged MODS or death (Podd 2023)<Cite ids={[10]} clickRef={clickRef} />. Age-banded ranges differ; do not extrapolate adult cut-offs to neonates.
      </div>
    </div>
  );
}

      <div className="pattern-label">{pattern.label}</div>
      <div className="pattern-sub">{pattern.sub}</div>

      {warnings.map((w, i) => (
        <div key={i} className="warn" data-sev={w.sev}>
          <div className="head">{w.head}</div>
          <div>{w.body}<Cite ids={w.cites} clickRef={clickRef} /></div>
        </div>
      ))}

      <h3>Evidence — by finding</h3>
      {rows.map((r) => (
        <div key={r.id} className="ev-row">
          <div className="ev-finding">
            <span>{r.finding}</span>
            <span className="ev-state" data-sev={r.sev}>
              {typeof r.state === "string" ? r.state : r.state}

          <div className="ev-claim">{r.claim}

          <div className="ev-num"><strong>Data:</strong> {r.num}</div>
          <div className="ev-caveat">Caveat — {r.caveat}</div>
        </div>
      ))}
    </div>
  );
}
