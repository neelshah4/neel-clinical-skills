    /* Tool tokens: every role aliases a neel-theme kit token, so light and dark both follow the kit. */

    var t = effective();

    try { localStorage.setItem(KEY, t); } catch(e){ /* private mode: session-only */ }
    sync();
  }
  window.NeelTheme = { get: effective, set: set };
  function mount(){
    if (document.querySelector('.nt-switch')) return;
    var wrap = document.createElement('div');
    wrap.className = 'nt-switch'; wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Colour theme');
    ['light', 'dark'].forEach(function(t){
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-nt', t); b.textContent = t === 'light' ? 'Light' : 'Dark';
      b.addEventListener('click', function(){ set(t); });
      wrap.appendChild(b); btns.push(b);
    });
    document.body.insertBefore(wrap, document.body.firstChild);
    sync();
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', function(){ if (!stored()) sync(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
