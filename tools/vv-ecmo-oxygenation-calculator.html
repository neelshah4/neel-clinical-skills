  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useCallback } = React;

    const BASELINE = {
      mode: "forward",
      sEcmo: 100, qEcmo: 4.0, co: 6.0, measuredSaO2: 88, recirc: 0,
      hgb: 11, paO2: 60, pvO2: 35, hufner: 1.34,
      wt: 70, vo2i: 3.0,
    };

    // Entry limits in one place so the scenario buttons and the fields cannot drift apart.
    // The flow and cardiac-output floors reach a neonate (about 0.2 L/min of circuit flow at 3 kg)
    // instead of silently clamping such a patient up to an adult value.
    const LIM = {
      sEcmo: [85, 100], qEcmo: [0.1, 8], co: [0.2, 12], measuredSaO2: [20, 100],
      recirc: [0, 60], hgb: [5, 18], paO2: [30, 150], pvO2: [15, 60],
      wt: [2, 150], vo2i: [1, 12],
    };
    const fmtFlow = (v) => (v < 1 ? v.toFixed(2) : v.toFixed(1));
    const perKg = (lpm, kg) => (kg > 0 ? (lpm * 1000 / kg).toFixed(0) : "\u2014");

    const cls = (...xs) => xs.filter(Boolean).join(" ");
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    // MODEL CLOSURE (repair round 1, finding M01).
    // VO₂ is an INPUT (weight × index) and SvO₂ is SOLVED from the Fick relation.
    // In the previous build SvO₂ was a free slider, so VO₂ = CO·(CaO₂−CvO₂)·10 and
    // DO₂ = CO·CaO₂·10 shared the cardiac-output factor: DO₂:VO₂ collapsed to 1/OER, CO
    // cancelled identically, weaning ECMO flow made the ratio RISE, and cutting hemoglobin by a
    // third moved the ratio by 0.02 while asserting that consumption had fallen 36%.
    //
    // Forward:  Δ = [VO₂/(10·CO) − 0.003·(PaO₂ − PvO₂)] / (K·Hgb)     (arterio-venous sat gap)
    //           SaO₂ = S_ECMO − Δ·(Q_native / Q_eff),   SvO₂ = SaO₂ − Δ
    // Reverse:  with x = SaO₂ − SvO₂ and A = S_ECMO − SaO₂ (fractions), G = 10·Q_eff,
    //           a = K·Hgb and b = 0.003·(PaO₂ − PvO₂):
    //             G·a·x² + [G·(b + a·A) − VO₂]·x + G·A·b = 0,   CO = Q_eff·(A + x)/x
    //           The larger root is the physiologic branch; the smaller returns CO in the hundreds
    //           of L/min. Forward and reverse round-trip exactly on all five worked examples.
    function calc(state) {
      const { mode, sEcmo, qEcmo, co, measuredSaO2, recirc, hgb, paO2, pvO2, hufner, wt, vo2i } = state;
      const R = clamp(recirc, 0, 95) / 100;
      // Effective ECMO flow definition: Q_eff = Q * (1 - R) (Fisser 2022, PMID 36117961).
      const qEff = qEcmo * (1 - R);
      const vo2 = vo2i * wt;              // mL/min (demand, held fixed)
      const a = hufner * hgb;             // mL/dL per unit saturation fraction
      const b = 0.003 * (paO2 - pvO2);    // dissolved-O₂ arterio-venous difference, mL/dL

      let coOut, saFrac, svFrac, error = null, warn = null;

      if (mode === "forward") {
        coOut = co;
        const qNative0 = Math.max(0, coOut - qEff);
        const delta = a > 0 ? (vo2 / (10 * coOut) - b) / a : 0;
        saFrac = (sEcmo / 100) - (qEff > 0 ? delta * qNative0 / qEff : 0);
        svFrac = saFrac - delta;
        if (coOut < qEff) warn = "CO is below effective ECMO flow. Physiologically impossible if no native lung function.";
        else if (saFrac <= 0) warn = "Solved SaO₂ ≤ 0. These inputs have no physiologic solution. Lower VO₂, or raise flow, hemoglobin or CO.";
        else if (svFrac <= 0) warn = "Solved SvO₂ ≤ 0. The entered VO₂ cannot be extracted from this delivery. Lower VO₂, or raise hemoglobin, CO or flow.";
      } else {
        saFrac = measuredSaO2 / 100;
        const A = (sEcmo / 100) - saFrac;
        const G = 10 * qEff;
        const p = G * a;
        const q = G * (b + a * A) - vo2;
        const r = G * A * b;
        const disc = q * q - 4 * p * r;
        const x = (p > 0 && disc >= 0) ? (-q + Math.sqrt(disc)) / (2 * p) : NaN;
        if (A < 0) {
          error = "Measured SaO₂ exceeds post-oxygenator sat: implies native lung is contributing (model assumption violated).";
        } else if (!Number.isFinite(x) || x <= 0) {
          error = "No physiologic solution: at this SaO₂, hemoglobin and effective flow the circuit cannot carry the entered VO₂.";
        } else if (saFrac - x <= 0) {
          error = "No physiologic solution: the implied SvO₂ falls to zero or below. Lower VO₂, or raise hemoglobin or flow.";
        }
        if (error) { coOut = NaN; svFrac = NaN; }
        else {
          svFrac = saFrac - x;
          coOut = qEff * (A + x) / x;
          // 12 L/min is a plausibility guard internal to this tool, not a published cut-point.
          if (coOut > 12) warn = "Solved CO > 12 L/min: a plausibility guard set by this tool, not a published cut-point. Suspect high recirculation, an over-stated VO₂, or sampling artifact.";
          else if (coOut < qEff * 1.05) warn = "Solved CO ≈ Q_ECMO: patient near full extracorporeal support.";
        }
      }

      const saO2 = Number.isFinite(saFrac) ? clamp(saFrac * 100, 0, 100) : NaN;
      const svO2 = Number.isFinite(svFrac) ? clamp(svFrac * 100, 0, 100) : NaN;
      const qNative = Number.isFinite(coOut) ? Math.max(0, coOut - qEff) : NaN;
      const caO2 = Number.isFinite(saO2) ? hufner * hgb * (saO2 / 100) + 0.003 * paO2 : NaN;
      const cvO2 = Number.isFinite(svO2) ? hufner * hgb * (svO2 / 100) + 0.003 * pvO2 : NaN;
      const do2  = (Number.isFinite(coOut) && Number.isFinite(caO2)) ? coOut * caO2 * 10 : NaN;
      const oer  = (Number.isFinite(do2) && do2 > 0) ? vo2 / do2 : NaN;
      const ratio = (Number.isFinite(do2) && vo2 > 0) ? do2 / vo2 : NaN;
      return { saO2, svO2, co: coOut, caO2, cvO2, do2, vo2, oer, ratio, qEff, qNative, R, error, warn };
    }

    // Provenance of the band edges below.
    // SOURCED: DO₂:VO₂ 5:1 normal and supply dependence near 2:1 (ELSO 2021, PMID 33965970).
    // SOURCED anchor for low-SaO₂ concern: ECMO flow below 60% of cardiac output is frequently
    //   associated with SaO₂ <90% in ARDS (Schmidt 2013, PMID 23291732); restated in ELSO 2021.
    // DERIVED / TOOL HEURISTIC, no published cut-point: the 75% and 80% SaO₂ edges (80% is taken
    //   from the lower bound of the ELSO-described 80–90% typical band), the 3:1 ratio flag,
    //   the 95% + 5:1 over-support label, and the 40% OER flag used in the stat tiles.
    // UNSOURCED, TOOL DEFAULT: the 3.0 mL/kg/min resting VO₂ index. No published resting-VO₂
    //   reference was verified this run; it is a teaching default chosen so the baseline case
    //   reproduces the previous build's numbers, and it is labelled as such where it is entered.
    // The ratio branches are interpretable only because VO₂ is now an independent input.
    function statusFor(saO2, ratio, error) {
      if (error) return { label: "Cannot solve; check inputs", tone: "danger" };
      if (!Number.isFinite(saO2) || !Number.isFinite(ratio)) return { label: "Cannot solve; check inputs", tone: "danger" };
      if (ratio < 1)      return { label: "Delivery below demand", tone: "danger" };
      if (ratio < 2)      return { label: "Critical (anaerobic threshold)", tone: "danger" };
      if (saO2 < 75)      return { label: "Inadequate oxygenation", tone: "danger" };
      if (ratio < 3)      return { label: "Marginal; consider escalation", tone: "warn" };
      if (saO2 < 80)      return { label: "Below target; verify lactate", tone: "warn" };
      if (saO2 > 95 && ratio > 5) return { label: "Comfortable (likely over-supported)", tone: "info" };
      return { label: "Within target range", tone: "ok" };
    }

    const TONE = {
      ok:     { bg: "bg-emerald-50",  text: "text-emerald-800",  dot: "bg-emerald-500", border: "border-emerald-300" },
      info:   { bg: "bg-sky-50",      text: "text-sky-800",      dot: "bg-sky-500",     border: "border-sky-300" },
      warn:   { bg: "bg-amber-50",    text: "text-amber-900",    dot: "bg-amber-500",   border: "border-amber-300" },
      danger: { bg: "bg-rose-50",     text: "text-rose-900",     dot: "bg-rose-500",    border: "border-rose-300" },
    };

    // M08: commit a parseable, in-range keystroke immediately; clamp only on blur; and always say
    // what happened. The previous build ran clamp() on every keystroke, which made multi-digit
    // entry impossible (backspacing 11 to 1 snapped Hgb to 5) and rewrote values with no message.
    function Field({ label, value, onChange, min, max, step, unit, hint, format, badge }) {
      step = step || 1;
      const display = format ? format(value) : String(value);
      const [draft, setDraft] = useState(null);
      const [msg, setMsg] = useState(null);
      const editing = draft !== null;
      const shown = editing ? draft : display;
      const range = min + "\u2013" + max + (unit ? " " + unit : "");
      const onText = (e) => {
        const t = e.target.value;
        setDraft(t);
        if (t.trim() === "") { setMsg("Enter a value in " + range + " \u2014 nothing applied yet."); return; }
        const v = parseFloat(t);
        if (!Number.isFinite(v)) { setMsg("Not a number \u2014 allowed range " + range + "."); return; }
        if (v < min || v > max) { setMsg("Outside " + range + " \u2014 not applied. It will snap to the nearest allowed value when you leave the field."); return; }
        setMsg(null);
        onChange(v);
      };
      const onBlur = () => {
        if (draft === null) return;
        const raw = draft;
        const v = parseFloat(raw);
        setDraft(null);
        if (!Number.isFinite(v)) { setMsg("Kept the previous value \u2014 that entry is not a number."); return; }
        if (v < min || v > max) { const c = clamp(v, min, max); onChange(c); setMsg("Adjusted " + v + " to " + c + " \u2014 allowed range is " + range + "."); return; }
        setMsg(null);
      };
      const invalid = editing && msg !== null;
      const fromSlider = (e) => { setDraft(null); setMsg(null); onChange(parseFloat(e.target.value)); };
      return (
        <div className="flex flex-col gap-1.5 py-2">
          <div className="flex items-baseline justify-between gap-3">
            <label className="text-[13px] font-medium text-slate-700 flex items-center gap-2">
              {label}
              {badge && <span className="text-[10px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded bg-sky-100 text-sky-700">{badge}</span>}
            </label>
            <div className="flex items-baseline gap-1">
              <input
                type="number"
                aria-label={label}
                aria-invalid={invalid ? "true" : undefined}
                value={shown}
                min={min} max={max} step={step}
                onChange={onText}
                onBlur={onBlur}
                className={cls("w-20 rounded-md border bg-white px-2 py-1 text-right text-sm font-semibold text-slate-900 tabular-nums focus:ring-2 focus:ring-sky-100", invalid ? "border-rose-300" : "border-slate-200 focus:border-sky-400")}
              />
              <span className="text-xs text-slate-500 w-12 text-left">{unit}</span>
            </div>
          </div>
          <input type="range" aria-label={label} min={min} max={max} step={step} value={value} onChange={fromSlider} className="w-full" />
          {msg && <p role="status" className={cls("text-[11px] leading-snug font-medium", invalid ? "text-rose-700" : "text-amber-800")}>{msg}</p>}
          {hint && <p className="text-[11px] leading-snug text-slate-500">{hint}</p>}
        </div>
      );
    }

    function DerivedValue({ label, value, unit, hint, error }) {
      return (
        <div className="flex flex-col gap-1.5 py-2">
          <div className="flex items-baseline justify-between gap-3">
            <label className="text-[13px] font-medium text-slate-700 flex items-center gap-2">
              {label}
              <span className="text-[10px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded bg-violet-100 text-violet-700">Derived</span>
            </label>
            <div className="flex items-baseline gap-1">
              <span className={cls("w-20 rounded-md border px-2 py-1 text-right text-sm font-semibold tabular-nums", error ? "border-rose-200 bg-rose-50 text-rose-700" : "border-violet-200 bg-violet-50 text-violet-900")}>
                {error ? "—" : value}
              </span>
              <span className="text-xs text-slate-500 w-12 text-left">{unit}</span>
            </div>
          </div>
          {hint && <p className="text-[11px] leading-snug text-slate-500">{hint}</p>}
        </div>
      );
    }

    function Stat({ label, value, unit, sub, tone, emphasize }) {
      const palette = {
        default: "bg-white border-slate-200",
        primary: "bg-sky-50 border-sky-200",
        derived: "bg-violet-50 border-violet-200",
        danger:  "bg-rose-50 border-rose-200",
        warn:    "bg-amber-50 border-amber-200",
        ok:      "bg-emerald-50 border-emerald-200",
      };
      return (
        <div className={cls("rounded-xl border px-4 py-3 flex flex-col justify-between min-h-[88px]", palette[tone] || palette.default)}>
          <div className="text-[11px] font-medium uppercase tracking-wide text-slate-500">{label}</div>
          <div className="flex items-baseline gap-1.5 mt-1">
            <span className={cls("tabular-nums font-semibold text-slate-900", emphasize ? "text-3xl" : "text-xl")}>{value}</span>
            {unit && <span className="text-xs text-slate-500">{unit}</span>}
          </div>
          {sub && <div className="text-[11px] text-slate-500 mt-0.5">{sub}</div>}
        </div>
      );
    }

    function SatGauge({ saO2, label, sub }) {
      const pct = clamp(saO2, 0, 100);
      let band = "from-rose-500 to-rose-600";
      if (saO2 >= 80 && saO2 <= 95) band = "from-emerald-500 to-emerald-600";
      else if (saO2 >= 75) band = "from-amber-500 to-amber-600";
      return (
        <div className="rounded-xl border border-slate-200 bg-white p-4">
          <div className="flex items-baseline justify-between mb-2">
            <div className="text-[11px] font-medium uppercase tracking-wide text-slate-500">{label}</div>
            <div className="text-3xl font-bold text-slate-900 tabular-nums">
              {saO2.toFixed(1)}<span className="text-base text-slate-500 font-normal">%</span>
            </div>
          </div>
          <div className="relative h-3 w-full rounded-full bg-slate-100 overflow-hidden">
            <div className={cls("absolute inset-y-0 left-0 bg-gradient-to-r rounded-full transition-all duration-300", band)} style={{ width: pct + "%" }} />
            <div className="absolute inset-y-0 border-l border-slate-400/60" style={{ left: "80%" }} />
            <div className="absolute inset-y-0 border-l border-slate-400/60" style={{ left: "90%" }} />
          </div>
          <div className="flex justify-between text-[10px] text-slate-500 mt-1 px-0.5">
            <span>0%</span>
            <span className="ml-auto mr-[10%]">80%</span>
            <span>90%</span>
            <span>100%</span>
          </div>
          <div className="mt-2 text-[11px] text-slate-500">{sub}</div>
        </div>
      );
    }

    function ScenarioButton({ label, sub, onClick, tone }) {
      const palette = {
        slate:  "bg-white hover:bg-slate-50 border-slate-200 text-slate-800",
        sky:    "bg-sky-50 hover:bg-sky-100 border-sky-200 text-sky-900",
        amber:  "bg-amber-50 hover:bg-amber-100 border-amber-200 text-amber-900",
        violet: "bg-violet-50 hover:bg-violet-100 border-violet-200 text-violet-900",
        rose:   "bg-rose-50 hover:bg-rose-100 border-rose-200 text-rose-900",
        teal:   "bg-teal-50 hover:bg-teal-100 border-teal-200 text-teal-900",
      };
      return (
        <button onClick={onClick} className={cls("rounded-lg border px-3 py-2.5 text-left transition-colors w-full", palette[tone] || palette.slate)}>
          <div className="text-[13px] font-semibold leading-tight">{label}</div>
          {sub && <div className="text-[11px] mt-0.5 opacity-75 leading-snug">{sub}</div>}
        </button>
      );
    }

    function App() {
      const [tab, setTab] = useState("sat");
      const [state, setState] = useState(BASELINE);
      const update = useCallback((patch) => setState((s) => ({ ...s, ...patch })), []);
      const reset = () => setState(BASELINE);
      const setMode = (mode) => update({ mode });

      const sCoUp     = () => update({ co: clamp(state.co * 1.3, LIM.co[0], LIM.co[1]) });
      const sVo2Up    = () => update({ vo2i: clamp(state.vo2i + 1.0, LIM.vo2i[0], LIM.vo2i[1]) });
      const sEcmoUp   = () => update({ qEcmo: clamp(state.qEcmo + 1.0, LIM.qEcmo[0], LIM.qEcmo[1]) });
      const sEcmoDown = () => update({ qEcmo: clamp(state.qEcmo - 1.0, LIM.qEcmo[0], LIM.qEcmo[1]) });
      const sRecircUp = () => update({ recirc: clamp(state.recirc + 20, LIM.recirc[0], LIM.recirc[1]) });
      const sAnemia   = () => update({ hgb: clamp(state.hgb - 4, LIM.hgb[0], LIM.hgb[1]) });
      const sTransfuse= () => update({ hgb: clamp(state.hgb + 2, LIM.hgb[0], LIM.hgb[1]) });
      const sSeptic   = () => update({ co: clamp(state.co * 1.4, LIM.co[0], LIM.co[1]), vo2i: clamp(state.vo2i + 1.0, LIM.vo2i[0], LIM.vo2i[1]) });
      const sSaUp     = () => update({ measuredSaO2: clamp(state.measuredSaO2 + 5, LIM.measuredSaO2[0], state.sEcmo) });
      const sSaDown   = () => update({ measuredSaO2: clamp(state.measuredSaO2 - 5, LIM.measuredSaO2[0], state.sEcmo) });

      const out = useMemo(() => calc(state), [state]);
      const status = useMemo(() => statusFor(out.saO2, out.ratio, out.error), [out]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 antialiased">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

            <header className="mb-4">
              <div className="flex flex-wrap items-end justify-between gap-3">
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-slate-900">V-V ECMO Oxygenation Calculator</h1>
                  <p className="text-sm text-slate-600 mt-0.5">Interactive teaching model · Bartlett mixing model, Compr Physiol 2020 · Adult-derived evidence base, weight-indexed inputs · For ICU / PCCM fellows</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={reset} className="text-sm px-3 py-1.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-slate-700">Reset baseline</button>
                </div>
              </div>
            </header>

            <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 mb-5 flex gap-3 items-start">
              <div className="text-amber-600 mt-0.5 shrink-0">⚠</div>
              <div className="text-[13px] text-amber-900 leading-snug">
                {state.mode === "forward" ? (
                  <React.Fragment><strong>Teaching model assumes zero native lung gas exchange.</strong> Real V-V ECMO patients have residual native-lung function, so actual SaO₂ is usually <em>higher</em> than predicted. In this direction the predicted SaO₂ is a lower bound and a thought aid, not a substitute for an arterial blood gas.</React.Fragment>
                ) : (
                  <React.Fragment><strong>Teaching model: in this direction the error changes sign.</strong> Residual native-lung function raises the measured SaO₂ above what mixing alone can produce, narrowing SaO₂ − SvO₂ and back-solving a cardiac output that is systematically <em>too low</em>. The lower-bound claim above is a forward-mode statement; here the solved CO is an under-estimate, and it does not correct the thermodilution bias. It errs the other way.</React.Fragment>
                )}
                {" "}Not for clinical decisions.
                <div className="mt-2 text-[11px] text-amber-800 leading-snug">
                  <strong>Scope.</strong> Every threshold, cohort and flow range cited in this tool is adult or animal: the ELSO 2021 <em>adult</em> V-V guideline, Schmidt 2013, Patel 2019, Fisser 2022, Russ 2022 (pigs) and BLENDER (veno-arterial); the only pediatric-adjacent source is a neonatal cannula simulation. Flow, cardiac-output and VO₂ fields are weight-indexed and the sliders reach neonatal values, but no pediatric cut-point here is sourced. Do not carry the 5–6 L/min cannula ceiling or the 80–90% SaO₂ band onto a child.
                </div>
              </div>
            </div>

            <div className="mb-4 rounded-xl border border-slate-200 bg-white p-3 flex flex-wrap items-center gap-3">
              <div className="text-[12px] font-medium text-slate-700 uppercase tracking-wide pr-2 border-r border-slate-200">Mode</div>
              <div className="flex gap-1 p-1 rounded-lg bg-slate-100">
                <button onClick={() => setMode("forward")} className={cls("px-3 py-1.5 rounded-md text-[13px] font-medium transition-colors", state.mode === "forward" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900")} title="Enter CO; predict SaO₂">
                  Predict SaO₂ <span className="text-slate-400 font-normal">(CO known)</span>
                </button>
                <button onClick={() => setMode("reverse")} className={cls("px-3 py-1.5 rounded-md text-[13px] font-medium transition-colors", state.mode === "reverse" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900")} title="Enter measured SaO₂; solve for CO">
                  Solve for CO <span className="text-slate-400 font-normal">(SaO₂ known)</span>
                </button>
              </div>
              <div className="text-[12px] text-slate-500 ml-1">
                {state.mode === "forward"
                  ? "Slide CO; the SaO₂ shown is predicted by the mixing equation."
                  : "Enter the patient's measured arterial sat; the calculator back-solves CO."}
              </div>
            </div>

            <div className="mb-4">
              <div className="flex gap-1 p-1 rounded-xl bg-slate-200/60 w-fit">
                <button onClick={() => setTab("sat")} className={cls("px-4 py-1.5 rounded-lg text-sm font-medium transition-colors", tab === "sat" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900")}>Saturation-only mixing</button>
                <button onClick={() => setTab("content")} className={cls("px-4 py-1.5 rounded-lg text-sm font-medium transition-colors", tab === "content" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900")}>Full content (CaO₂ / DO₂ / OER)</button>
              </div>
              <p className="text-[11px] text-slate-500 mt-1.5">These tabs switch the <em>output</em> tiles only. Every input that moves SaO₂ (hemoglobin, VO₂, weight, PaO₂, PvO₂ and the Hüfner constant) stays visible in both, because in the closed Fick model every one of them does. Hiding them was how a Status verdict could appear with no visible cause and how the anemia and transfusion buttons could do nothing at all.</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">

              <section className="lg:col-span-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 className="text-sm font-semibold text-slate-900 mb-1">Inputs</h2>
                <p className="text-[12px] text-slate-500 mb-3">Drag sliders or type values. Both inputs and outputs update live.</p>

                <div className="divide-y divide-slate-100">
                  <DerivedValue label="Mixed venous saturation (SvO₂)" value={Number.isFinite(out.svO2) ? out.svO2.toFixed(1) : "—"} unit="%" error={!!out.error}
                    hint="Solved from the Fick relation, not entered. On V-V ECMO the return cannula discharges upstream of the pulmonary artery, so a PA-catheter sample is the post-mixing product of this equation rather than an input to it: feeding one back in drives SaO₂ and SvO₂ together and, in reverse mode, back-solves an arbitrarily large cardiac output. No validated bedside route to a true mixed venous on V-V ECMO was found. Walker 2009 (PMID 19948749) is a bench derivation in a circuit primed with porcine blood whose own conclusion calls the original model an oversimplification of the high arterial pO₂ during therapy, with accurate clinical calculation left to future work (a method not yet clinically validated, not a sampling instruction)." />
                  <Field label="Post-oxygenator (ECMO outlet) saturation" value={state.sEcmo} onChange={(v) => update({ sEcmo: v })} min={LIM.sEcmo[0]} max={LIM.sEcmo[1]} step={1} unit="%" hint="A healthy oxygenator returns blood at ~100%. Judge oxygenator dysfunction by a rising transmembrane pressure drop (normal <50 mmHg; a change >100 mmHg suggests obstruction) together with a falling post-membrane PaO₂, not by a single saturation cut-point (Patel 2019, PMID 31632747). No published post-oxygenator saturation threshold was found." />
                  <Field label="ECMO blood flow (Q_ECMO)" value={state.qEcmo} onChange={(v) => update({ qEcmo: v })} min={LIM.qEcmo[0]} max={LIM.qEcmo[1]} step={0.05} unit="L/min" format={fmtFlow} hint={`Cannula-limited. ELSO 2021 gives 5–6 L/min as the usual ceiling set by cannula size and Patel 2019 describes typical flows of 3–4 L/min (both adult figures). At the ${state.wt} kg entered here that is ${perKg(state.qEcmo, state.wt)} mL/kg/min, shown for scale only: no weight-indexed flow target is sourced in this tool. Higher flows are conventionally linked to hemolysis and access insufficiency, but no flow threshold for either is published.`} />

                  {state.mode === "forward" ? (
                    <Field label="Cardiac output (CO)" value={state.co} onChange={(v) => update({ co: v })} min={LIM.co[0]} max={LIM.co[1]} step={0.05} unit="L/min" format={fmtFlow} badge="Input" hint={`Total venous return: ${perKg(state.co, state.wt)} mL/kg/min at ${state.wt} kg. Sepsis, fever and agitation raise CO; a higher CO dilutes the ECMO contribution. Thermodilution overestimated CO by 2.1–2.7 L/min during V-V ECMO in six anesthetized pigs (Russ 2022, PMID 34860710); a porcine finding, not a human V-V ECMO measurement, and not a licence to discount a measured cardiac output by 2 L/min at the bedside.`} />
                  ) : (
                    <React.Fragment>
                      <Field label="Measured arterial SaO₂" value={state.measuredSaO2} onChange={(v) => update({ measuredSaO2: v })} min={LIM.measuredSaO2[0]} max={state.sEcmo} step={0.5} unit="%" format={(v) => v.toFixed(1)} badge="Input" hint="From the patient's arterial blood gas; it must not exceed the post-oxygenator saturation. Any residual native-lung oxygenation carried inside this number biases the solved cardiac output low." />
                      <DerivedValue label="Cardiac output (solved)" value={Number.isFinite(out.co) ? out.co.toFixed(2) : "—"} unit="L/min" error={!!out.error} hint={out.error || `CO = Q_eff · (S_ECMO − SvO₂) / (SaO₂ − SvO₂), with SvO₂ solved jointly from VO₂ = CO · (CaO₂ − CvO₂) · 10. Read it as an under-estimate: residual native lung raises the measured SaO₂, narrows SaO₂ − SvO₂ and drives this number down, and the SaO₂ > S_ECMO guard cannot fire while S_ECMO is 100%. ${Number.isFinite(out.co) && state.wt > 0 ? "Equivalent to " + perKg(out.co, state.wt) + " mL/kg/min at " + state.wt + " kg." : ""}`} />
                    </React.Fragment>
                  )}

                  <Field label="Recirculation fraction" value={state.recirc} onChange={(v) => update({ recirc: v })} min={LIM.recirc[0]} max={LIM.recirc[1]} step={1} unit="%" hint="Femoro-jugular median 5% (IQR 0–11) vs jugulo-femoral 19% (IQR 13–28) (Fisser 2022, PMID 36117961, erratum on record, Front Med (Lausanne) 2022;9:1045207, PMID 36267622; linkage only, consult before relying on these figures). In single-lumen atrio-femoral support, a conventional draining cannula gave 38.0 ± 13.7% vs 19.0 ± 12.2% for a multistage design (Palmér 2016, PMID 27660904); malpositioned neonatal dual-lumen cannulae reached 39 ± 4%, maximum 42%, in a validated CFD model (Jamil 2019, PMID 31580212). Effective ECMO flow = Q_ECMO × (1 − R)." />

                  <Field label="Body weight" value={state.wt} onChange={(v) => update({ wt: v })} min={LIM.wt[0]} max={LIM.wt[1]} step={0.5} unit="kg" format={(v) => (v < 10 ? v.toFixed(1) : v.toFixed(0))} hint="Sets total VO₂ and indexes the flow readouts. Nothing else in this tool is size-specific. The cited bands and ceilings remain adult." />
                  <Field label="Oxygen consumption (VO₂ index)" value={state.vo2i} onChange={(v) => update({ vo2i: v })} min={LIM.vo2i[0]} max={LIM.vo2i[1]} step={0.1} unit="mL/kg/min" format={(v) => v.toFixed(1)} badge="Input" hint={`Demand, held fixed while flow, hemoglobin and cardiac output vary. This is what makes DO₂:VO₂ a genuine supply:demand ratio instead of an algebraic restatement of 1/OER. Total VO₂ = ${(state.vo2i * state.wt).toFixed(0)} mL/min at ${state.wt} kg. The 3.0 mL/kg/min default is this tool's teaching convention: no published resting-VO₂ reference was verified for it.`} />
                  <Field label="Hemoglobin" value={state.hgb} onChange={(v) => update({ hgb: v })} min={LIM.hgb[0]} max={LIM.hgb[1]} step={0.5} unit="g/dL" format={(v) => v.toFixed(1)} hint="Each gram binds 1.34 mL O₂ (Bartlett 2017, PMID 27040797). With VO₂ fixed, less hemoglobin forces a wider arterio-venous saturation gap, so anemia now lowers SvO₂ and SaO₂ as well as CaO₂ and DO₂. It is not silent on the saturation." />
                  <Field label="Arterial PaO₂" value={state.paO2} onChange={(v) => update({ paO2: v })} min={LIM.paO2[0]} max={LIM.paO2[1]} step={1} unit="mmHg" hint="On V-V ECMO commonly 50–80 mmHg (a teaching convention carried by this tool); ELSO 2021 gives no PaO₂ range and states only that SaO₂ is typically 80–90%. Contributes 0.003·PaO₂ mL/dL of dissolved O₂." />
                  <Field label="Venous PvO₂" value={state.pvO2} onChange={(v) => update({ pvO2: v })} min={LIM.pvO2[0]} max={LIM.pvO2[1]} step={1} unit="mmHg" hint="Normal mixed venous PO₂ ≈ 40 mmHg (standard oxygen-transport physiology), cited to Dunn 2016 (DOI 10.1093/bjaed/mkw012); that source is paywalled and the number was not independently verified here. Because SvO₂ is now solved rather than entered, PvO₂ is no longer tied to it by the dissociation curve and enters only the small dissolved-O₂ term." />
                  <div className="pt-3 flex items-center justify-between">
                    <div>
                      <div className="text-[13px] font-medium text-slate-700">Hüfner constant</div>
                      <div className="text-[11px] text-slate-500 mt-0.5">1.34 (US / Bartlett, accounts for dyshemoglobins) · 1.39 (ELSO 2021 / theoretical max).</div>
                    </div>
                    <div className="flex rounded-md border border-slate-200 overflow-hidden text-sm">
                      <button onClick={() => update({ hufner: 1.34 })} className={cls("px-3 py-1.5", state.hufner === 1.34 ? "bg-sky-600 text-white" : "bg-white text-slate-700 hover:bg-slate-50")}>1.34</button>
                      <button onClick={() => update({ hufner: 1.39 })} className={cls("px-3 py-1.5 border-l border-slate-200", state.hufner === 1.39 ? "bg-sky-600 text-white" : "bg-white text-slate-700 hover:bg-slate-50")}>1.39</button>
                    </div>
                  </div>
                </div>

                <div className="mt-4 rounded-lg bg-slate-50 border border-slate-200 px-3 py-2 text-[11px] text-slate-600">
                  <strong className="text-slate-800">Equation used:</strong>{" "}
                  {state.mode === "forward"
                    ? <code className="text-[11px]">Δ = [VO₂/(10·CO) − 0.003·(PaO₂ − PvO₂)] / (K·Hgb) ;  SaO₂ = S_ECMO − Δ·Q_native/Q_eff ;  SvO₂ = SaO₂ − Δ</code>
                    : <code className="text-[11px]">CO = Q_eff·(S_ECMO − SvO₂) / (SaO₂ − SvO₂), with SvO₂ solved jointly from VO₂ = CO·(CaO₂ − CvO₂)·10</code>}
                  <br />where Q_eff = Q_ECMO·(1 − R), Q_native = CO − Q_eff, and VO₂ = index × weight.
                  {tab === "content" && (
                    <React.Fragment><br /><code className="text-[11px]">CaO₂ = K·Hgb·SaO₂ + 0.003·PaO₂ ;  DO₂ = CO·CaO₂·10 ;  OER = VO₂/DO₂</code><br />ELSO 2021 writes the same content equation with a dissolved-O₂ coefficient of 0.0034 rather than 0.003; at PaO₂ 100 the two differ by under 0.05 mL/dL.</React.Fragment>
                  )}
                  <br /><span className="text-slate-500">Both directions describe one closed system: the forward and reverse solutions round-trip to the entered value on all five worked examples below.</span>
                </div>
              </section>

              <section className="lg:col-span-7 flex flex-col gap-4">

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="md:col-span-2">
                    <SatGauge saO2={out.saO2}
                      label={state.mode === "forward" ? "Predicted arterial SaO₂" : "Measured arterial SaO₂"}
                      sub={state.mode === "forward" ? "ELSO 2021 describes SaO₂ on V-V ECMO as typically 80–90% (a consequence of mixing, not a prescribed target); Patel 2019 reports ELSO guidance as SaO₂ 80–85% at rest ventilator settings, with some centers targeting >88%. The 75% and 80% band edges drawn here are display heuristics of this tool." : "Patient's measured value: used to back-solve CO."}
                    />
                  </div>

                    </div>

                    <div className="mt-1 text-[11px] text-slate-600 leading-snug">
                      Effective Q_ECMO: <span className="font-medium tabular-nums">{out.qEff.toFixed(2)} L/min</span>
                      {Number.isFinite(out.co) && (<React.Fragment> · Native flow: <span className="font-medium tabular-nums">{out.qNative.toFixed(2)} L/min</span></React.Fragment>)}
                    </div>
                    {out.warn && (<div className="mt-1 text-[11px] text-amber-800 leading-snug">{out.warn}</div>)}
                    {state.recirc > 0 && !out.warn && (<div className="mt-1 text-[11px] text-amber-800 leading-snug">R = {state.recirc}% removed from delivered flow.</div>)}
                    {state.mode === "reverse" && (<div className="mt-1 text-[11px] text-amber-800 leading-snug">Reverse mode: residual native-lung oxygenation biases this solved CO <strong>low</strong>, and the SaO₂ &gt; S_ECMO guard cannot fire while S_ECMO is 100%.</div>)}
                    <div className="mt-1.5 text-[10px] text-slate-500 leading-snug">Status labels are this tool's display heuristics, not guideline cut-points; see Key caveats.</div>
                  </div>
                </div>

                {tab === "sat" ? (
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <Stat label={state.mode === "forward" ? "Predicted SaO₂" : "Measured SaO₂"} value={Number.isFinite(out.saO2) ? out.saO2.toFixed(1) : "—"} unit="%" tone="primary" emphasize sub={state.mode === "forward" ? "Flow-weighted mean" : "Patient's ABG"} />
                    <Stat label="SvO₂ (solved)" value={Number.isFinite(out.svO2) ? out.svO2.toFixed(1) : "—"} unit="%" tone="derived" emphasize sub="From Fick, not entered" />
                    <Stat label={state.mode === "forward" ? "Cardiac output (input)" : "Cardiac output (solved)"} value={Number.isFinite(out.co) ? out.co.toFixed(2) : "—"} unit="L/min" tone={state.mode === "reverse" ? "derived" : "default"} emphasize={state.mode === "reverse"} sub={state.mode === "reverse" ? "Back-solved (biased low)" : "User-supplied"} />
                    <Stat label="ECMO fraction" value={Number.isFinite(out.co) ? (out.qEff / out.co * 100).toFixed(0) : "—"} unit="% of CO" sub="Effective Q_ECMO ÷ CO · <60% linked to SaO₂ <90% (Schmidt 2013, adult ARDS)" />
                  </div>
                ) : (
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <Stat label={state.mode === "forward" ? "Predicted SaO₂" : "Measured SaO₂"} value={Number.isFinite(out.saO2) ? out.saO2.toFixed(1) : "—"} unit="%" tone="primary" sub={state.mode === "forward" ? "Flow-weighted mean" : "Patient's ABG"} />
                    <Stat label="SvO₂ (solved)" value={Number.isFinite(out.svO2) ? out.svO2.toFixed(1) : "—"} unit="%" tone="derived" sub="From Fick, not entered" />
                    <Stat label={state.mode === "forward" ? "Cardiac output" : "Cardiac output (solved)"} value={Number.isFinite(out.co) ? out.co.toFixed(2) : "—"} unit="L/min" tone={state.mode === "reverse" ? "derived" : "default"} emphasize sub={state.mode === "reverse" ? "Back-solved (biased low)" : "User-supplied"} />
                    <Stat label="CaO₂ (arterial)" value={Number.isFinite(out.caO2) ? out.caO2.toFixed(2) : "—"} unit="mL/dL" tone="primary" sub={`${state.hufner}·Hgb·SaO₂ + 0.003·PaO₂`} />
                    <Stat label="CvO₂ (venous)" value={Number.isFinite(out.cvO2) ? out.cvO2.toFixed(2) : "—"} unit="mL/dL" sub="From the solved SvO₂" />
                    <Stat label="DO₂ (delivery)" value={Number.isFinite(out.do2) ? out.do2.toFixed(0) : "—"} unit="mL/min" tone={out.ratio < 3 ? "warn" : "ok"} emphasize sub="CO × CaO₂ × 10" />
                    <Stat label="VO₂ (demand, input)" value={out.vo2.toFixed(0)} unit="mL/min" sub={`${state.vo2i.toFixed(1)} mL/kg/min × ${state.wt} kg · tool default, unsourced`} />
                    <Stat label="OER" value={Number.isFinite(out.oer) ? (out.oer * 100).toFixed(0) : "—"} unit="%" tone={out.oer > 0.4 ? "warn" : "ok"} sub="VO₂ ÷ DO₂ · normal ≈ 25% (transport physiology) · the 40% flag is this tool's heuristic" />
                    <Stat label="DO₂ : VO₂ ratio" value={Number.isFinite(out.ratio) ? out.ratio.toFixed(1) : "—"} unit=": 1" tone={out.ratio < 2 ? "danger" : out.ratio < 3 ? "warn" : "ok"} emphasize sub="Now responds to flow, Hgb and CO · ELSO 2021: normal 5:1, supply dependence near 2:1 · the 3:1 flag is this tool's" />
                  </div>
                )}

                <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                  <div className="flex items-baseline justify-between mb-3">
                    <h2 className="text-sm font-semibold text-slate-900">Clinical scenarios</h2>
                    <span className="text-[11px] text-slate-500">One click adjusts the relevant inputs from current state.</span>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                    {state.mode === "forward" ? (
                      <React.Fragment>
                        <ScenarioButton label="↑ Cardiac output" sub="Active patient · +30% CO · dilutes ECMO fraction, SaO₂ falls" onClick={sCoUp} tone="sky" />
                        <ScenarioButton label="↑ Oxygen consumption" sub="Fever / agitation / shivering · VO₂ +1 mL/kg/min" onClick={sVo2Up} tone="amber" />
                        <ScenarioButton label="↑ ECMO flow (+1 L/min)" sub="Escalation · SaO₂ climbs toward the oxygenator outlet" onClick={sEcmoUp} tone="teal" />
                        <ScenarioButton label="↓ ECMO flow (−1 L/min)" sub="Weaning · SaO₂ and DO₂:VO₂ both fall" onClick={sEcmoDown} tone="violet" />
                        <ScenarioButton label="↑ Recirculation (+20%)" sub="Cannula migration / high flow / RV dysfunction" onClick={sRecircUp} tone="rose" />
                        <ScenarioButton label="↓ Hemoglobin (−4 g/dL)" sub="Bleeding · CaO₂ and DO₂ fall, and SaO₂ with them; the same VO₂ must come off less Hgb" onClick={sAnemia} tone="rose" />
                        <ScenarioButton label="Transfuse 2 units (+2 g/dL)" sub="Raises DO₂ and SaO₂ without raising flow" onClick={sTransfuse} tone="teal" />
                        <ScenarioButton label="Septic / hyperdynamic" sub="↑ CO +40% & ↑ VO₂ +1 mL/kg/min" onClick={sSeptic} tone="amber" />
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <ScenarioButton label="↑ Measured SaO₂ (+5)" sub="Imagine the ABG improved; solved CO falls" onClick={sSaUp} tone="sky" />
                        <ScenarioButton label="↓ Measured SaO₂ (−5)" sub="Imagine the ABG worsened; solved CO rises" onClick={sSaDown} tone="violet" />
                        <ScenarioButton label="↑ Oxygen consumption" sub="VO₂ +1 mL/kg/min · solved CO falls, solved SvO₂ falls further" onClick={sVo2Up} tone="amber" />
                        <ScenarioButton label="↑ ECMO flow (+1 L/min)" sub="Same SaO₂ now consistent with higher CO" onClick={sEcmoUp} tone="teal" />
                        <ScenarioButton label="↓ ECMO flow (−1 L/min)" sub="Same SaO₂ now consistent with lower CO" onClick={sEcmoDown} tone="violet" />
                        <ScenarioButton label="↑ Recirculation (+20%)" sub="Q_eff falls; solved CO falls" onClick={sRecircUp} tone="rose" />
                        <ScenarioButton label="↓ Hemoglobin (−4 g/dL)" sub="Solved CO falls and DO₂ falls further" onClick={sAnemia} tone="rose" />
                        <ScenarioButton label="Transfuse 2 units (+2 g/dL)" sub="Solved CO rises; DO₂ rises with it" onClick={sTransfuse} tone="teal" />
                      </React.Fragment>
                    )}
                  </div>
                </div>
              </section>
            </div>

            <section className="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <h2 className="text-sm font-semibold text-slate-900 mb-1">Five worked examples</h2>
                <p className="text-[12px] text-slate-500 mb-3">Each row is reversible: give it the SaO₂ and recover the CO, or give it the CO and recover the SaO₂. The first seven columns are inputs; SvO₂, SaO₂, DO₂ and the ratio are outputs of the closed model. Try both modes against the values below.</p>
              <div className="overflow-x-auto">
                <table className="min-w-full text-[12px]">
                  <thead>
                    <tr className="text-left text-slate-500 border-b border-slate-200">
                      <th className="py-2 pr-3 font-medium">#</th>
                      <th className="py-2 pr-3 font-medium">Scenario</th>
                      <th className="py-2 pr-3 font-medium">Hgb</th>
                      <th className="py-2 pr-3 font-medium">CO</th>
                      <th className="py-2 pr-3 font-medium">Q_ECMO</th>
                      <th className="py-2 pr-3 font-medium">R</th>
                      <th className="py-2 pr-3 font-medium">VO₂ in</th>
                      <th className="py-2 pr-3 font-medium">SvO₂ out</th>
                      <th className="py-2 pr-3 font-medium">SaO₂ out</th>
                      <th className="py-2 pr-3 font-medium">DO₂</th>
                      <th className="py-2 pr-3 font-medium">DO₂:VO₂</th>
                    </tr>
                  </thead>
                  <tbody className="text-slate-800">
                    {[
                      ["1", "ARDS, moderate flow", "11", "6.0", "4.0", "0%", "210", "65.1%", "88.4%", "792", "3.8"],
                      ["2", "Under-supported",     "10", "7.0", "3.0", "0%", "185", "54.8%", "74.2%", "705", "3.8"],
                      ["3", "Anemic, full flow",   "7",  "5.0", "4.5", "0%", "133", "69.9%", "97.0%", "467", "3.5"],
                      ["4", "Septic, hyperdyn",    "9",  "9.0", "5.0", "0%", "306", "50.0%", "77.8%", "856", "2.8"],
                      ["5", "Recirculation 30%",   "11", "5.5", "4.5", "30%","190", "60.0%", "82.9%", "682", "3.6"],
                    ].map((r, i) => (
                      <tr key={i} className="border-b border-slate-100">
                        {r.map((c, j) => (
                          <td key={j} className={cls("py-2 pr-3 tabular-nums", j === 1 && "font-medium text-slate-900")}>{c}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p className="text-[11px] text-slate-500 mt-3 leading-snug">Conventions: K = 1.34 mL O₂/g Hgb · S_ECMO = 100% · VO₂ in mL/min · PaO₂ 60 mmHg (cases 1, 5) / 45 (cases 2, 4) / 80 (case 3) · PvO₂ 35 / 30 / 40 / 28 / 33 mmHg. Case 5 uses effective Q_ECMO = 4.5 × (1−0.30) = 3.15 L/min. SvO₂ is no longer an entry: it is solved from the Fick relation, so each row has one degree of freedom fewer than in the previous build. All five rows were recomputed from the equations above, and the reverse solver returns the entered cardiac output to three decimals on every one of them.</p>
            </section>

            <section className="mt-6 grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 className="text-sm font-semibold text-slate-900 mb-2">Key caveats</h2>
                <ul className="text-[12px] text-slate-700 space-y-1.5 list-disc pl-5 leading-snug">
                  <li><strong>No native lung function: the sign of that error flips between the two modes.</strong> In <em>forward</em> mode the predicted SaO₂ is a lower bound: recovering lungs raise the real SaO₂ above it. In <em>reverse</em> mode the same residual lung function raises the measured SaO₂, narrows SaO₂ − SvO₂ and back-solves a cardiac output that is systematically <em>too low</em>. The tool's only reverse-mode guard fires when the measured SaO₂ exceeds the post-oxygenator saturation, which cannot happen at the default S_ECMO of 100%, so nothing warns automatically: read the solved CO as an under-estimate. It does not correct the thermodilution bias below; it errs the other way, and a spuriously low CO in a hypoxemic patient invites inotrope or volume decisions this model cannot support.</li>
                  <li><strong>SvO₂ is solved here, not sampled: no validated bedside route to a true mixed venous on V-V ECMO was found.</strong> The return cannula discharges upstream of the pulmonary artery, so a PA-catheter sample is the post-mixing product of this equation rather than an input to it. Entering one collapses the forward equation toward SaO₂ = SvO₂ and drives the reverse denominator toward zero, and at the bedside it teaches a trainee to read arterial-equivalent blood as a reassuring extraction ratio in an under-supported patient. The published alternative (correcting a pre-membrane sample for recirculation) rests on Walker 2009 (PMID 19948749), a bench derivation in a circuit primed with porcine blood whose own conclusion is that the original model is an oversimplification of the high arterial pO₂ during therapy and that accurate clinical calculation awaits further work. Treat it as a method not yet clinically validated. No published source was found for the sometimes-taught maneuver of briefly stopping sweep gas to read a true mixed venous, and neither Walker 2009 nor Schmidt 2013 describes it.</li>
                  <li><strong>Status bands are this tool's display heuristics.</strong> The 75% and 80% SaO₂ edges, the 3:1 ratio flag, the 95% over-support label and the 40% OER flag are conventions of this calculator, not guideline cut-points. The 80% edge is taken from the lower bound of the ELSO-described 80–90% typical band. The nearest sourced anchor for low-SaO₂ concern is an ECMO flow below 60% of cardiac output, frequently associated with SaO₂ &lt;90% in ARDS (Schmidt 2013, PMID 23291732; restated in ELSO 2021).</li>
                  <li><strong>SaO₂ 80–90% is a tolerated floor, not a goal</strong> (Ortoleva &amp; Chweich 2022, PMID 35644745; a two-page letter, not a primary study). Lactate, ScvO₂, and the DO₂:VO₂ trend trump any single number.</li>
                  <li><strong>DO₂:VO₂ &lt; 2:1</strong> = the supply-dependence threshold, with 5:1 as the normal ratio, both stated in ELSO 2021 (PMID 33965970).</li>
                  <li><strong>Dissolved O₂ small but real.</strong> 0.003·PaO₂ mL/dL: about 1.5% of CaO₂ at PaO₂ 100 with Hgb 15, about 2.0% at this tool's baseline Hgb 11, and larger in severe anemia. ELSO 2021 writes the same term as 0.0034·PaO₂.</li>
                  <li><strong>Hüfner constant 1.34 vs 1.39.</strong> 1.34 accounts for normal MetHb/COHb (Bartlett 2017, PMID 27040797); ELSO 2021 uses 1.39.</li>
                  <li><strong>DO₂:VO₂ means something here only because VO₂ is an input.</strong> When SvO₂ is a free slider, VO₂ = CO·(CaO₂ − CvO₂)·10 and DO₂ = CO·CaO₂·10 share the cardiac-output factor: the ratio collapses to 1/OER, CO cancels identically, weaning ECMO flow from 4.0 to 3.0 L/min makes the ratio <em>rise</em> from 3.8 to 4.7, and cutting hemoglobin from 11 to 7 g/dL moves it by 0.02 while asserting that oxygen consumption fell 36%. This build holds VO₂ fixed at weight × index and solves SvO₂ from Fick, so the ratio responds to flow, hemoglobin and cardiac output in the directions a bedside clinician expects. The 3.0 mL/kg/min default index is this calculator's teaching convention; no published resting-VO₂ reference was verified for it.</li>
                  <li><strong>Reverse mode has no solution when the entered VO₂ cannot be carried.</strong> The back-solve is a quadratic in SaO₂ − SvO₂; when its discriminant goes negative, when the only root is non-positive, or when the implied SvO₂ falls to zero, the tool says so instead of returning a number. Outside those bounds the requirement is still SvO₂ &lt; SaO₂ ≤ S_ECMO.</li>
                  <li><strong>Real recirculation runs higher than a zeroed slider suggests, and this tool has no input for its strongest determinant.</strong> In 21 high-flow V-V patients median recirculation was 14% (IQR 7–25) and 57% had ≥10%; right ventricular dysfunction more than doubled it (25% vs 9%) (PMID 42490650).</li>
                  <li><strong>Measured cardiac output is itself biased high on V-V ECMO (in pigs).</strong> Thermodilution overestimated CO by a mean 2.1 L/min in healthy animals and 2.7 L/min after lung injury, and the error grew with recirculation, in six anesthetized pigs (Russ 2022, PMID 34860710). It is a porcine finding, not a human V-V ECMO measurement, and the reverse mode is not the corrective for it: the back-solve carries its own opposite bias (first bullet above), so the two errors do not cancel.</li>
                  <li><strong>A return cannula across the interatrial septum breaks the model entirely.</strong> Inadvertent veno-left-atrial return produces a strikingly high PaO₂ with absent recirculation and a low sweep requirement; in reverse mode this calculator would back-solve a meaningless cardiac output (Guevara-Chaux, PMID 40985532).</li>
                  <li><strong>Oxygen-target trials do not yet license moving the band.</strong> BLENDER randomized conservative (SaO₂ 92–96%) against liberal (97–100%) targets and found no difference in ICU-free days or mortality, but it studied <em>veno-arterial</em> ECMO (PMID 39162827). A meta-analysis of 12 studies found hyperoxia associated with higher mortality overall (OR 1.41, 95% CI 1.22–1.64) with no significant association in the V-V subgroup (PMID 41237735), which also tempers the over-supported label above. <span className="text-slate-500">BLENDER (PMID 39162827) has an erratum on record: Intensive Care Med 2024;50(12):2241–2242, PMID 39412548. Linkage only; consult it before relying on this result.</span></li>
                  <li><strong>Confirming recirculation or cannula position is an ultrasound question.</strong> The 2026 ELSO state-of-the-art review covers the bedside strategies this calculator cannot substitute for (Douflé, PMID 41588617).</li>
                  <li><strong>Every threshold in this tool is adult or animal; none of it is a pediatric cut-point.</strong> The cited evidence base is the ELSO 2021 <em>adult</em> V-V guideline, Schmidt 2013 (adult ARDS), Patel 2019 (adult review), Fisser 2022 (adult), Russ 2022 (pigs), Ortoleva 2022 (adult letter) and BLENDER (adult veno-arterial); the only pediatric-adjacent source is a neonatal cannula CFD simulation (Jamil 2019). Flow, cardiac-output and VO₂ are now weight-indexed and the sliders reach neonatal values: a 3 kg neonate on roughly 0.2 L/min of circuit flow against a cardiac output near 0.6 L/min can be entered, where the previous floors of 0.5 and 1 L/min silently rewrote both, but the 5–6 L/min cannula ceiling, the 80–90% SaO₂ band and the 60%-of-CO flow anchor must not be carried onto a child. No weight-indexed flow target is sourced in this tool.</li>
                  <li><strong>Typed values are no longer rewritten in silence.</strong> Entry is validated on leaving the field rather than on every keystroke, an out-of-range entry is held rather than clamped mid-edit, and any adjustment is stated under the field. In the previous build, backspacing hemoglobin from 11 to 1 snapped it to 5 with no message, so the scenario on screen was not the scenario that had been entered.</li>
                </ul>
              </div>

                <p className="text-[10px] text-slate-500 mt-3 leading-snug">Retraction and expression-of-concern screen run 2026-08-31 across every entry above: none found. <strong>Correction screening, re-run 2026-09-01.</strong> The earlier pass screened publication types only, which cannot see an erratum published as its own record (the usual case). The screen was therefore re-run as an erratum-linkage screen: the CommentsCorrections field of every PMID printed in this tool, fetched from PubMed E-utilities and parsed for ErratumIn, RetractionIn, ExpressionOfConcernIn and CorrectedandRepublishedIn. The same screen by the same method was run over all eleven tools in this set. On this page 18 of 18 source PMIDs were screened, and two carry an erratum: PMID 36117961 (Fisser 2022) and PMID 39162827 (BLENDER), with no retraction and no expression of concern anywhere. What the screen returns is the linkage and not the correction: neither erratum was retrieved, so this page reports that each exists and that a reader should consult it, and asserts nothing about what either one changed. Both are marked on their reference-list row above and at their point of use: the recirculation-fraction field and the oxygen-target caveat bullet. Where a number in this tool has no published source it is labelled in place as a teaching convention or a display heuristic rather than removed.</p>
